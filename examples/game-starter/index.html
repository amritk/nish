<!doctype html>
<!-- examples/game-starter: served from the directory build.mjs writes. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>game-starter</title>
    <style>
      body { margin: 0; background: #000; }
      canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module">
      import { startGame } from "./nish/page-game.mjs"
      const prefer = new URLSearchParams(location.search).get("renderer") ?? undefined
      globalThis.game = await startGame(document.getElementById("game"), "./game.wasm", {
        prefer,
        onFallback: (from, to, reason) => console.warn(`${from} -> ${to}: ${reason}`),
      })
    </script>
  </body>
</html>
