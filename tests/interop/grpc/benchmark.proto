// The service `tests/link/net_grpc_interop` serves (`/grpc-server` in
// `server.dockerfile`), for interop.yml's `grpc` job: grpcurl and ghz read
// it with `-proto`, since the server offers no reflection. The routes are
// `tests/link/net_grpc/rig.ts`'s.
syntax = "proto3";

package benchmark;

service BenchmarkService {
  // a + b.
  rpc GetSum(SumRequest) returns (SumReply);
  // PERMISSION_DENIED, with the message "no 100% é".
  rpc Denied(SumRequest) returns (SumReply);
  // NOT_FOUND, with no message.
  rpc Missing(SumRequest) returns (SumReply);
  // Held unanswered until its deadline, capped by the server, has passed:
  // DEADLINE_EXCEEDED, with no message.
  rpc Slow(SumRequest) returns (SumReply);
  // Client streaming: the sum of every request's a + b, once the stream ends.
  rpc SumAll(stream SumRequest) returns (SumReply);
  // Server streaming: `count` replies, from `start` up, each with `pad` bytes
  // of padding (at most 4096).
  rpc Count(CountRequest) returns (stream CountReply);
  // Bidirectional: each request's a + b, sent back as it is read.
  rpc Echo(stream SumRequest) returns (stream SumReply);
}

message SumRequest {
  int32 a = 1;
  int32 b = 2;
}

message SumReply {
  int32 result = 1;
}

message CountRequest {
  int32 count = 1;
  int32 start = 2;
  int32 pad = 3;
}

message CountReply {
  int32 result = 1;
  bytes pad = 2;
}
