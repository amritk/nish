[package]
name = "curves"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
ed25519-dalek = "=3.0.0"
p256 = { version = "=0.14.0", features = ["ecdsa"] }
sha2 = "=0.11.1"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }

[profile.release]
codegen-units = 1
lto = true
