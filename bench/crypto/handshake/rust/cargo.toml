[package]
name = "handshake"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bytes = "=1.10.1"
quinn-proto = { version = "=0.11.19", default-features = false, features = ["rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[profile.release]
codegen-units = 1
lto = true
