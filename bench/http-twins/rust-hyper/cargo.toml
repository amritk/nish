# Cargo reads this as Cargo.toml: build.sh copies it under that name into the
# staging directory, because the repository's file names are kebab-case.
[package]
name = "serve"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "net", "io-std", "time"] }

[profile.release]
codegen-units = 1
lto = true
