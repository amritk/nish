# Cargo reads this as Cargo.toml: build.sh copies it under that name into the
# staging directory, because the repository's file names are kebab-case.
[package]
name = "serve"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
actix-web = { version = "=4.17.0", default-features = false, features = ["macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
