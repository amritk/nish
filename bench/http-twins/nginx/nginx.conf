# The nginx twin of bench/http1-server.ts. nginx/serve fills in @PORT@,
# @MASTER@ and @WORKERS@ and runs it with the per-port directory as nginx's prefix, so the pid file and the
# temporary directories land under build/http-twins/nginx/run/<port>/.
#
# With BENCH_CORES unset or 1, one process (`master_process off`,
# `worker_processes 1`); with BENCH_CORES=N, a master and N workers
# (`master_process on`, `worker_processes N`). Either way in the foreground
# (`daemon off`), answering from `return` alone. /json counts requests with
# $connection_requests, which is per connection, not per process: nginx keeps
# no counter shared between connections. /json-echo is a 404 (nginx cannot
# decode and re-encode a JSON body without a module), so its cell reads n/a,
# and so is POST /json, so the body scenario's cell reads n/a as well. A method
# other than GET is a 404 too, as it is from the Nish server.
#
# extra.conf, which build.sh generates from extra-routes.mjs and serve copies
# beside this file, maps "<method> <path>" to $extra; `location /` answers the
# extra routes from it, one regex at a time in table order.
daemon off;
master_process @MASTER@;
worker_processes @WORKERS@;
pid nginx.pid;
error_log stderr;

events {
    worker_connections 16384;
}

http {
    access_log off;
    server_tokens off;
    keepalive_requests 1000000000;

    include extra.conf;

    server {
        listen 127.0.0.1:@PORT@;

        location = / {
            if ($request_method != GET) {
                return 404;
            }
            default_type text/plain;
            return 200 "Hi";
        }

        location ~ ^/id/(?<id>[^/]+)$ {
            if ($request_method != GET) {
                return 404;
            }
            default_type text/plain;
            add_header x-powered-by benchmark;
            return 200 "$id $arg_name";
        }

        location = /plaintext {
            if ($request_method != GET) {
                return 404;
            }
            default_type text/plain;
            return 200 "Hello, World!";
        }

        location = /json {
            if ($request_method != GET) {
                return 404;
            }
            default_type application/json;
            return 200 '{"message":"Hello, World!","n":$connection_requests}';
        }

        location / {
            default_type text/plain;
            if ($extra) {
                return 200 "ok";
            }
            return 404;
        }
    }
}
