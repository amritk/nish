# The nginx twin of bench/http1-server.ts. nginx/serve fills in @PORT@ and runs
# it with the per-port directory as nginx's prefix, so the pid file and the
# temporary directories land under build/http-twins/nginx/run/<port>/.
#
# One process (`master_process off`, `worker_processes 1`) in the foreground
# (`daemon off`), answering from `return` alone. /json counts requests with
# $connection_requests, which is per connection, not per process: nginx keeps
# no counter shared between connections. /json-echo is a 404 (nginx cannot
# decode and re-encode a JSON body without a module), so its cell reads n/a.
# A method other than GET is a 404 too, as it is from the Nish server.
daemon off;
master_process off;
worker_processes 1;
pid nginx.pid;
error_log stderr;

events {
    worker_connections 16384;
}

http {
    access_log off;
    server_tokens off;
    keepalive_requests 1000000000;

    server {
        listen 127.0.0.1:@PORT@;

        location = /plaintext {
            if ($request_method != GET) {
                return 404;
            }
            default_type text/plain;
            return 200 "Hello, World!";
        }

        location = /json {
            if ($request_method != GET) {
                return 404;
            }
            default_type application/json;
            return 200 '{"message":"Hello, World!","n":$connection_requests}';
        }

        location / {
            return 404;
        }
    }
}
