# serde_json, the Rust twin of bench/json/json.ts. Built by bench/json/run.mjs
# with `cargo build --release`; the lock file pins the versions it measured.
[package]
name = "json-serde"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
