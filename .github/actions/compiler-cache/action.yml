name: The compiler under test, through the cache
description: >-
  Links src/compile.ts with the seed into `out`, or restores the binary an
  earlier run linked from the same inputs (tests/self/compiler-cache.js), and
  saves it on a miss. Run it after the seed is fetched, LLVM is on PATH and
  npm ci has run; a later `node tests/run.js` then copies the same binary from
  build/cache instead of spending a minute on the link.

inputs:
  seed:
    description: The seed that links the compiler
    default: build/seed/bin/nish
  out:
    description: Where the compiler goes
    default: build/nish-test
  save:
    description: >-
      Whether this job saves a miss. Every job of a matrix links the same
      binary, and only one save of a key can win, so a matrix saves from one row.
    default: "true"

outputs:
  hit:
    description: Whether the binary came from the cache
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The key is a hash of everything the link reads, so it can only be
    # computed once the seed, the toolchain and the checkout are all in place.
    - name: Compiler cache key
      id: key
      shell: bash
      env:
        SEED: ${{ inputs.seed }}
      run: |
        key="$(node tests/self/compiler-cache.js --key --seed "$SEED")"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "compiler under test: key $key"

    - name: Restore the compiler under test
      id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/cache/compiler-under-test/${{ steps.key.outputs.key }}
        key: compiler-under-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}

    - name: Link the compiler under test, or copy it from the cache
      shell: bash
      env:
        SEED: ${{ inputs.seed }}
        OUT: ${{ inputs.out }}
      run: node tests/self/compiler-cache.js --link "$OUT" --seed "$SEED"

    - name: Save the compiler under test
      if: steps.restore.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/cache/compiler-under-test/${{ steps.key.outputs.key }}
        key: compiler-under-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
