# Installs Ubuntu packages through the Actions cache. Every Ubuntu install in
# CI goes through here, so every one gets the same three defences.
#
# - The mirror: .github/apt-mirror.sh points apt away from the Azure mirror,
#   which has served libllvm18 at about 100 KB/s (#963), never idle long enough
#   for `APT_OPTS`'s thirty seconds, so the calling step's limit fired before
#   any test ran. apt fetches from a mirror list of our own instead and moves
#   to the next entry when one fails.
# - The cache: the .debs are kept in the Actions cache, keyed by runner image,
#   architecture and package list, so a job normally downloads nothing. apt
#   checks every cached .deb against the hash in the signed index before it
#   installs it, so a stale or altered one is fetched again, never installed.
# - The bound: on a miss each download attempt is cut at a minute and retried,
#   since apt has no deadline of its own for a transfer that trickles.
#
# The save is a step of its own rather than actions/cache's post step, which
# saves only when the whole job passes. Jobs that race to save one key lose
# with a warning and carry on.
name: Install apt packages through the cache
description: apt-get install with the .debs restored from and saved to the Actions cache

inputs:
  packages:
    description: Space-separated package names for apt-get install
    required: true

runs:
  using: composite
  steps:
    - name: Apt cache key
      id: key
      shell: bash
      env:
        PKGS: ${{ inputs.packages }}
      run: |
        sum="$(printf '%s' "$PKGS" | sha256sum | cut -c1-12)"
        prefix="apt-$sum-$ImageOS-$RUNNER_ARCH-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$ImageVersion" >> "$GITHUB_OUTPUT"

    - name: Restore apt packages
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Install
      shell: bash
      env:
        PKGS: ${{ inputs.packages }}
      run: |
        archives="$RUNNER_TEMP/apt-archives"
        mkdir -p "$archives/partial"
        # `_apt` cannot reach a directory under the runner's home, so apt would
        # download as root anyway, with a warning; say so up front.
        apt_cache="-o Dir::Cache::Archives=$archives -o APT::Sandbox::User=root"
        bash "$GITHUB_ACTION_PATH/../../apt-mirror.sh"
        sudo apt-get $APT_OPTS update
        for attempt in 1 2 3; do
          if sudo timeout -k 5 60 apt-get $APT_OPTS $apt_cache install -y --no-install-recommends \
            --download-only $PKGS; then
            break
          fi
          if [ "$attempt" = 3 ]; then
            echo "::error::apt could not download the packages in three one-minute attempts"
            exit 1
          fi
          echo "::warning::apt download attempt $attempt stalled or failed; retrying"
        done
        sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS $apt_cache install -y --no-install-recommends $PKGS
        # Drop .debs the mirror no longer offers (left over from an older
        # image's cache) and hand the directory back to the runner user, so
        # the save step can read apt's root-owned files.
        sudo apt-get $apt_cache autoclean
        sudo rm -rf "$archives/partial" "$archives/lock"
        sudo chown -R "$(id -u):$(id -g)" "$archives"

    - name: Save apt packages
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.key.outputs.key }}
