# The pull request title is the commit subject, so it is checked like one.
#
# This repository squash-merges, which means GitHub uses the pull request's
# title as the subject of the single commit that lands on main. That subject is
# what `scripts/changelog-gen.mjs` reads for the release-note heading and for
# the version bump, so a title that is not a conventional commit does not just
# look untidy -- the generator skips it, and the change is missing from the
# release notes and from the semver decision.
#
# The rule is not duplicated here. The check shells out to the generator's own
# `--check-subject`, so CI enforces exactly what the generator parses; a title
# this job accepts can never be one the generator cannot classify.
name: PR title

on:
  pull_request:
    # `edited` matters as much as `opened`: a title is usually fixed rather
    # than a pull request reopened, and without it the red check never clears.
    types: [opened, edited, reopened, synchronize]
  # The merge queue waits on every required check, this one included, so it
  # has to report there. The queue has no pull request in its event; what it
  # merges was checked on the pull request itself, so the step is skipped and
  # the job reports success.
  merge_group:
  # The Release PR's run. release-pr.yml pushes `release/next` with
  # GITHUB_TOKEN, whose `pull_request` runs wait for a maintainer's approval,
  # so it dispatches this workflow at the branch instead, and the check
  # reports on the PR's head commit. The step below holds a dispatch to that
  # one branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      # The title arrives through the environment, never interpolated into the
      # shell: a title is attacker-controlled text and `${{ }}` inside a `run:`
      # would splice it into the script.
      - name: Check the title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/changelog-gen.mjs --check-subject "$TITLE"

      # A dispatch has no pull request to read a title from. release-pr.yml
      # titles the Release PR with its commit's subject, so that subject is
      # what is checked; any other branch fails, so a dispatch cannot stand in
      # for another pull request's title check.
      - name: Check the Release PR's subject
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/release/next" ]; then
            echo "::error::a dispatched title check runs only at release/next, not $GITHUB_REF"
            exit 1
          fi
          node scripts/changelog-gen.mjs --check-subject "$(git log -1 --format=%s)"
