# The interop job (decision S2 of docs/wp34-hosting-cs.md): the Nish interop
# server against independent implementations, beside `npm test` rather than
# inside it. Each `tests/link/net_*` case proves its lane against recorded
# exchanges replayed byte for byte; this proves that live third-party peers
# agree with them.
#
# build:  the server image, tests/interop/server.dockerfile — Nish built from this
#         checkout by the seed (the newest release, or `seed`) with LLVM 18, compiling
#         tests/link/net_interop_server — shared with every job below.
# quic-interop-runner: the runner's server role against quic-go and ngtcp2:
#         handshake, transfer, retry, chacha20, multiplexing, keyupdate,
#         handshakeloss (L1), transferloss (L2), blackhole (B), http3, and
#         rebind-port (BP) and rebind-addr (BA), the client's NAT rebinding
#         mid-transfer, each new path validated before it is trusted.
# h2spec: every h2spec case against the HTTP/2 server.
# curl:   curl --http3 and --http2, a GET of a 1 MB file and a POST with a
#         body each; curl --http1.1, plain and over TLS, a GET of /hello and of
#         /big's 2 MiB chunked and a POST echoed back, small and of 1 MB; and
#         curl --http2 resuming a TLS 1.3 session on a second connection,
#         which the server's log must call `tls: resumed`.
# chrome: Playwright's Chromium opens a WebTransport session pinned by
#         serverCertificateHashes and echoes a datagram and a bidirectional
#         stream, and resumes a TLS 1.3 session on a second HTTP/2
#         connection (tests/interop/chrome-resume.py), with the certificate
#         the server mints (nish/crypto/x509) and with one openssl makes; and
#         speaks HTTP/1.1 to both HTTP/1.1 ports, a navigation over http/1.1,
#         a POST echoed and a WebSocket echoing text and binary, over TLS and
#         plain (tests/interop/chrome-http1.py).
# autobahn: the Autobahn TestSuite's fuzzingclient against the server's
#         WebSocket echo port (--ws-port), every case but 12.* and 13.*
#         (permessage-deflate, never negotiated); any case graded other than
#         OK or INFORMATIONAL fails (tests/interop/autobahn-verdict.py).
# arena:  examples/wasm-arena (docs/wp50-wasm-host.md §10, W9) in Playwright's
#         Chromium for ten minutes of scripted input (tests/interop/chrome-arena.py):
#         flat linear memory, the used heap after a forced GC at minute 1 and
#         minute 10 within a stated band, and the recorded input replayed
#         natively to the page's hash; then a WebTransport datagram write
#         copying its bytes (§5.3) and loadSync either side of 8 MB (§8).
#
# Every tool is pinned: actions by commit, images by digest, the runner by
# commit, h2spec by release and SHA-256, Python packages by hash
# (tests/interop/*-requirements.txt), tshark by its .debs' SHA-256. The
# simulator's run.sh is patched (tests/interop/simulator.dockerfile) so its
# pcaps keep the packets of the case's last fraction of a second. Nothing
# here turns a failure green: the one retry, a quic-interop-runner case run
# once more after it fails, passes only if that second run succeeds, and the
# verdict prints both.
#
# The image's seed is the newest published release (server.dockerfile).
# release.yml also calls this workflow, from its `interop` job, once `release`
# has published the tag's binaries and SHA256SUMS, with `seed` naming that
# release: the compiler just shipped builds and serves the interop server.
name: Interop

on:
  pull_request:
    paths:
      - "std/net/**"
      - "std/crypto/**"
      # WP38 S5: the AES kernels every TLS and QUIC connection here runs, the
      # lowering that calls them in place of std/crypto/aes.ts's seams, their
      # declarations, and the pairing and cache that link them.
      - "src/kernels.ts"
      - "src/emit.ts"
      - "src/runtime.ts"
      - "src/run-cache.ts"
      - "scripts/build.sh"
      - "runtime/runtime-aes.c"
      - "runtime/runtime-sha256.c"
      - "runtime/runtime-chacha20.c"
      - "runtime/runtime-checksum.c"
      - "runtime/runtime-bytes.c"
      - "runtime/runtime-sandbox.c"
      - "tests/interop/**"
      - "tests/link/net_interop_server*/**"
      # WP50 stage 6: the arena's page module, what builds and loads it, and
      # the ring it reads its input through.
      - "examples/wasm-arena/**"
      - "src/interop-wasm.ts"
      - "src/interop-dts.ts"
      - "src/host-module.ts"
      - "runtime/runtime-wasm.c"
      - "runtime/page.mjs"
      - "std/host/**"
      - ".github/workflows/interop.yml"
  push:
    branches: [main]
  # release.yml, once the release it builds is published (see the top).
  workflow_call:
    inputs:
      seed:
        description: the release whose compiler builds the image; empty for the newest
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

#
# Every Ubuntu install goes through .github/actions/apt-install, which points
# apt away from the Azure mirror (.github/apt-mirror.sh): that mirror served
# libllvm18 at about 100 KB/s on #963 and timed the five-minute install out
# before any test ran. The action also keeps the .debs in the Actions cache and
# cuts a stalled download at a minute.
env:
  # The quic-interop-runner at a fixed commit, and the images it drives.
  RUNNER_COMMIT: 740c05a10b61d65e8abd3ad38d60898004d335d9
  SIMULATOR: martenseemann/quic-network-simulator@sha256:c23d82a55caffe681b1bdae65d4d30d23e1283141a414a7f02ee56cf15f9c6b9
  QUIC_GO: martenseemann/quic-go-interop@sha256:6743eea41cb8d525686eb8f2437e3ac45835740ec87c62728f645cd89e85ab88
  NGTCP2: ghcr.io/ngtcp2/ngtcp2-interop@sha256:bd635531dbe210e5d7138a08dc61c2da2d702670ff718e440b961860f5e18235
  # The runner's cases, by the names its --json file gives them.
  RUNNER_CASES: handshake,transfer,retry,chacha20,multiplexing,keyupdate,handshakeloss,transferloss,blackhole,http3,rebind-port,rebind-addr
  # h2spec 2.6.0's release tarball and its SHA-256.
  H2SPEC_URL: https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
  H2SPEC_SHA256: 157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318
  # curl 8.17 with HTTP/3 (quiche) and HTTP/2.
  CURL: ghcr.io/macbre/curl-http3@sha256:c3a360869a4e132180f458f83af2ce67b873b2302739eda27274dad4f62155f8
  # Playwright 1.56.0's Python image: Chromium 141, the browser that Playwright release pins.
  PLAYWRIGHT: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
  # The Autobahn TestSuite 25.10.1's image, whose wstest drives the fuzzingclient.
  AUTOBAHN: crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074
  # The server's ports when a job runs it on the host's network.
  QUIC_PORT: "4433"
  H1_PORT: "8080"
  H1S_PORT: "8081"
  H2_PORT: "8443"
  # The WebSocket echo port, which tests/interop/autobahn-fuzzingclient.json names.
  WS_PORT: "9001"
  # serve's flags for those ports, expanded unquoted where the server starts.
  SERVE_PORTS: --port 4433 --h1-port 8080 --h1s-port 8081 --h2-port 8443
  # Every apt-get call's network bound, as in ci.yml: apt waits on a stalled
  # mirror with no timeout of its own (docs/wp10-ci.md, "Shards and time limits").
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

# Every job stops at 15 minutes, the repository's cap (docs/wp10-ci.md), but
# `arena`, whose soak is ten minutes by design and is given 25; and
# every step that waits on the network at 5 or 10: the slowest lane takes about
# 3 minutes, so a limit is reached only by a hang, in the step that names it.
jobs:
  build:
    name: build the server image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build tests/interop/server.dockerfile
        timeout-minutes: 10
        env:
          SEED: ${{ inputs.seed }}
        run: docker build -f tests/interop/server.dockerfile --build-arg SEED_VERSION="$SEED" -t nish-interop:ci .

      - name: Save the image
        run: docker save nish-interop:ci | gzip -1 > nish-interop.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nish-interop-image
          path: nish-interop.tar.gz
          retention-days: 3
          if-no-files-found: error

  quic-interop-runner:
    name: quic-interop-runner (${{ matrix.client }})
    needs: build
    runs-on: ubuntu-24.04
    # Room for the runner twice: a run that crashed retries every case.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        client: [quic-go, ngtcp2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner's docker-compose.yml names each endpoint's interface
      # (`interface_name`), which needs Docker Engine 28.1 or later; the image's
      # is older. The runner's own CI installs this version the same way.
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        timeout-minutes: 5
        with:
          version: version=v28.3.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 5
        with:
          name: nish-interop-image

      - name: Load the server image
        run: docker load --input nish-interop.tar.gz

      - name: Pull the simulator and the client
        timeout-minutes: 5
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          # The runner's docker-compose.yml names the simulator by tag; the
          # pinned digest, with tests/interop/simulator.dockerfile's fix to
          # the capture's teardown, is built under that tag, so compose finds it.
          docker pull "$SIMULATOR"
          docker build -f tests/interop/simulator.dockerfile --build-arg SIMULATOR="$SIMULATOR" \
            -t martenseemann/quic-network-simulator:latest tests/interop
          if [ "$CLIENT" = quic-go ]; then image="$QUIC_GO"; else image="$NGTCP2"; fi
          docker pull "$image"
          echo "CLIENT_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Enable IPv6 in Docker networks
        run: sudo modprobe ip6table_filter

      # tshark and its libraries are some 25 MB, most of it libwireshark.
      # The Azure mirror sometimes served that at a trickle, never idle for
      # `APT_OPTS`'s thirty seconds, so the step's five-minute limit fired
      # before any case ran (main, and #854, in October 2026). The action
      # fetches from other mirrors, keeps the .debs in the Actions cache keyed
      # by runner image, and cuts a stalled download at a minute per attempt.
      #
      # The runner needs Wireshark 4.5 or later (its README). Ubuntu 24.04 ships
      # 4.2.2, whose QUIC dissector cannot follow a server's packet on a new
      # path when the client's connection ID is zero-length, as quic-go's is:
      # 4.2 links a connection to a new 5-tuple only through the packet's own
      # DCID, so the server's first packet after a rebinding, its PATH_CHALLENGE,
      # reads as "Unknown QUIC connection" and rebind-port and rebind-addr fail
      # whatever the server sent. 4.6 attaches the connection to the new tuple
      # once the client's packet there matches its DCID. So tshark comes from
      # the Wireshark developers' stable PPA, as the exact .debs of its 4.6.9
      # build: fetched from the Launchpad librarian, which keeps a file for
      # good once the PPA moves on and drops it from its index, and each
      # checked against the SHA-256 that index's signed Packages file gave it
      # when it was pinned. apt then installs them, and fetches what they need
      # from Ubuntu, through the cache action.
      - name: Restore tshark's .debs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/tshark-download
          key: tshark-4.6.9-1-ubuntu24.04.0-ppa1-amd64

      - name: Fetch tshark's .debs and check their SHA-256
        timeout-minutes: 5
        run: |
          dir="$RUNNER_TEMP/tshark-download"
          mkdir -p "$dir" "$RUNNER_TEMP/tshark"
          while read -r sum id name; do
            if [ ! -f "$dir/$name" ]; then
              curl -fsSL --retry 3 --connect-timeout 30 --max-time 120 -o "$dir/$name" "https://launchpadlibrarian.net/$id/$name"
            fi
            cp "$dir/$name" "$RUNNER_TEMP/tshark/$name"
            echo "$sum  $RUNNER_TEMP/tshark/$name" | sha256sum -c -
          done <<'EOF'
          a97f88f43f1f2a32605491f6b46517ae2fada7a82df13d63c38412eead10c1a3 883202570 libwsutil17_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
          e5648ea04631ba9414ab0b12f8e9384d987c00268763b123ccedf0874d2f0af6 883202568 libwiretap16_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
          187cf9ac5753f4a91f3980948ed3fbb2feef0f4ac5a13895cb0b62df61681118 883202548 libwireshark-data_4.6.9-1~ubuntu24.04.0~ppa1_all.deb
          21794bd0e73c57baa67f664235d4b23d5feb5fcf2f774a2892744a9a4b5b3492 883202566 libwireshark19_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
          4fc6794928720b333261f14c3861401383a5dac732129b362d3022e8d0b0d8f1 883202573 wireshark-common_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
          d03542b43901e69792b1b85d4ee0770bfdc425f9eda3635ef33afe25cf1f9718 883202572 tshark_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
          EOF

      - name: Install tshark, which the runner reads the traces with
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            ${{ runner.temp }}/tshark/libwsutil17_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
            ${{ runner.temp }}/tshark/libwiretap16_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
            ${{ runner.temp }}/tshark/libwireshark-data_4.6.9-1~ubuntu24.04.0~ppa1_all.deb
            ${{ runner.temp }}/tshark/libwireshark19_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
            ${{ runner.temp }}/tshark/wireshark-common_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb
            ${{ runner.temp }}/tshark/tshark_4.6.9-1~ubuntu24.04.0~ppa1_amd64.deb

      - name: Check the tshark installed
        run: |
          # The first line reads "TShark (Wireshark) 4.6.9." for this build.
          v="$(tshark --version | head -n1)"
          echo "$v"
          case "$v" in
            "TShark (Wireshark) 4.6.9."*|"TShark (Wireshark) 4.6.9 "*) ;;
            *) echo "expected tshark 4.6.9" >&2; exit 1 ;;
          esac

      - name: Fetch the runner at its pinned commit
        timeout-minutes: 5
        run: |
          git init -q "$RUNNER_TEMP/qir"
          git -C "$RUNNER_TEMP/qir" fetch -q --depth 1 https://github.com/quic-interop/quic-interop-runner.git "$RUNNER_COMMIT"
          git -C "$RUNNER_TEMP/qir" checkout -q FETCH_HEAD
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r tests/interop/runner-requirements.txt

      - name: Register the Nish server and the pinned client
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          python3 - "$RUNNER_TEMP/qir/implementations_quic.json" <<'EOF'
          import json, os, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              impls = json.load(f)
          impls["nish"] = {"image": "nish-interop:ci", "url": "https://github.com/amritk/nish", "role": "server"}
          impls[os.environ["CLIENT"]]["image"] = os.environ["CLIENT_IMAGE"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(impls, f, indent=2)
          EOF

      - name: Run the runner
        env:
          CLIENT: ${{ matrix.client }}
        working-directory: ${{ runner.temp }}/qir
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          start=$(date +%s)
          status=0
          # -d: the runner prints what docker compose said when a step fails.
          "$RUNNER_TEMP/venv/bin/python" run.py -d -s nish -c "$CLIENT" -t "$RUNNER_CASES" \
            -l "$RUNNER_TEMP/logs" -j "$RUNNER_TEMP/result.json" || status=$?
          echo "runner exit $status after $(( $(date +%s) - start )) s"
          # A case that failed runs once more, on its own, and must succeed
          # then (tests/interop/runner-verdict.py says why); the verdict
          # prints both results for it.
          failed="$(python3 "$GITHUB_WORKSPACE/tests/interop/runner-verdict.py" --failed "$RUNNER_TEMP/result.json" "$RUNNER_CASES")"
          if [ -z "$failed" ]; then
            python3 "$GITHUB_WORKSPACE/tests/interop/runner-verdict.py" "$RUNNER_TEMP/result.json" "$RUNNER_CASES"
            exit $?
          fi
          echo "running $failed once more"
          status=0
          "$RUNNER_TEMP/venv/bin/python" run.py -d -s nish -c "$CLIENT" -t "$failed" \
            -l "$RUNNER_TEMP/logs-retry" -j "$RUNNER_TEMP/result-retry.json" || status=$?
          echo "runner exit $status on the retry, $(( $(date +%s) - start )) s in all"
          python3 "$GITHUB_WORKSPACE/tests/interop/runner-verdict.py" "$RUNNER_TEMP/result.json" "$RUNNER_CASES" "$RUNNER_TEMP/result-retry.json"

      - name: Upload the runner's logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-logs-${{ matrix.client }}
          path: |
            ${{ runner.temp }}/logs
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/logs-retry
            ${{ runner.temp }}/result-retry.json
          retention-days: 7
          if-no-files-found: warn

  h2spec:
    name: h2spec
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 5
        with:
          name: nish-interop-image

      - name: Start the server
        run: |
          docker load --input nish-interop.tar.gz
          docker run -d --name nish --network host --entrypoint /interop-server nish-interop:ci \
            serve $SERVE_PORTS
          # Ready once it has printed its ports, which it does after binding them and writing the hash file.
          for _ in $(seq 1 100); do docker logs nish 2>&1 | grep -q '^ports ' && break; sleep 0.1; done
          docker logs nish
          docker logs nish 2>&1 | grep -q '^ports '

      # The tarball is pinned by its SHA-256, so the cache is keyed by it, and
      # the check below runs on a restored copy exactly as on a download.
      - name: Restore h2spec
        id: h2spec-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/h2spec-download
          key: h2spec-${{ env.H2SPEC_SHA256 }}

      - name: Fetch h2spec and check its SHA-256
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/h2spec-download"
          if [ ! -f "$RUNNER_TEMP/h2spec-download/h2spec.tar.gz" ]; then
            curl -fsSL --retry 3 --connect-timeout 30 -o "$RUNNER_TEMP/h2spec-download/h2spec.tar.gz" "$H2SPEC_URL"
          fi
          cp "$RUNNER_TEMP/h2spec-download/h2spec.tar.gz" "$RUNNER_TEMP/h2spec.tar.gz"
          echo "$H2SPEC_SHA256  $RUNNER_TEMP/h2spec.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/h2spec.tar.gz" -C "$RUNNER_TEMP" h2spec

      - name: Run every h2spec case
        run: |
          # h2spec 2.6.0 was built with a Go that offers TLS 1.3 only when asked.
          GODEBUG=tls13=1 "$RUNNER_TEMP/h2spec" -k -t -h 127.0.0.1 -p "$H2_PORT" -o 5 | tee "$RUNNER_TEMP/h2spec.txt"
          tail -n 1 "$RUNNER_TEMP/h2spec.txt" | grep -E '^[0-9]+ tests, ([0-9]+) passed, 0 skipped, 0 failed$'

      - name: The server's log
        if: always()
        run: docker logs nish

  curl:
    name: curl --http3, --http2 and --http1.1
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 5
        with:
          name: nish-interop-image

      - name: Pull curl
        timeout-minutes: 5
        run: docker pull "$CURL"

      - name: Start the server on a directory with a 1 MB file
        run: |
          mkdir -p "$RUNNER_TEMP/www"
          head -c 1048576 /dev/urandom > "$RUNNER_TEMP/www/file"
          docker load --input nish-interop.tar.gz
          docker run -d --name nish --network host -v "$RUNNER_TEMP/www:/www:ro" --entrypoint /interop-server nish-interop:ci \
            serve --www /www $SERVE_PORTS
          # Ready once it has printed its ports, which it does after binding them and writing the hash file.
          for _ in $(seq 1 100); do docker logs nish 2>&1 | grep -q '^ports ' && break; sleep 0.1; done
          docker logs nish
          docker logs nish 2>&1 | grep -q '^ports '

      - name: GET and POST over HTTP/3 and HTTP/2
        run: |
          # A minute for each call: a transfer that stalls fails here, not at the job's timeout.
          curl_in() { docker run --rm --network host --entrypoint curl "$CURL" --max-time 60 "$@"; }
          want="$(sha256sum < "$RUNNER_TEMP/www/file")"
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "PASS  $1"; else echo "FAIL  $1: got '$2', want '$3'"; fail=1; fi
          }
          check "curl --http3-only GET of the file" "$(curl_in -sSfk --http3-only "https://127.0.0.1:$QUIC_PORT/file" | sha256sum)" "$want"
          check "curl --http3-only POST" "$(curl_in -sSfk --http3-only --data-binary 'a body of 21 bytes...' "https://127.0.0.1:$QUIC_PORT/post")" "received 21 bytes"
          check "curl --http2 GET of the file" "$(curl_in -sSfk --http2 "https://127.0.0.1:$H2_PORT/file" | sha256sum)" "$want"
          check "curl --http2 POST" "$(curl_in -sSfk --http2 --data-binary 'a body of 21 bytes...' "https://127.0.0.1:$H2_PORT/post")" "received 21 bytes"
          # -w prints the version even for a transfer that failed, so the transfer must succeed too.
          check "curl --http2 says it spoke HTTP/2" "$(curl_in -sSfk --http2 -o /dev/null -w '%{http_version}' "https://127.0.0.1:$H2_PORT/file" || echo ' (failed)')" "2"
          check "curl --http3-only says it spoke HTTP/3" "$(curl_in -sSfk --http3-only -o /dev/null -w '%{http_version}' "https://127.0.0.1:$QUIC_PORT/file" || echo ' (failed)')" "3"
          exit "$fail"

      # The HTTP/1.1 ports serve tests/link/net_http1_server's routes, not --www:
      # /hello's short body with a length, /big's 2 MiB chunked (byte k is
      # (7k + 3) mod 256), and /echo, which streams a body back chunked.
      - name: GET and POST over HTTP/1.1, plain and over TLS
        run: |
          curl_in() { docker run --rm --network host -v "$RUNNER_TEMP/www:/www:ro" --entrypoint curl "$CURL" --max-time 60 "$@"; }
          big="$(python3 -c 'import sys; sys.stdout.buffer.write(bytes((k * 7 + 3) & 255 for k in range(2097152)))' | sha256sum)"
          file="$(sha256sum < "$RUNNER_TEMP/www/file")"
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "PASS  $1"; else echo "FAIL  $1: got '$2', want '$3'"; fail=1; fi
          }
          for base in "http://127.0.0.1:$H1_PORT" "https://127.0.0.1:$H1S_PORT"; do
            check "curl --http1.1 GET $base/hello" "$(curl_in -sSfk --http1.1 "$base/hello")" "hello from nish/net/http1"
            check "curl --http1.1 GET $base/big, 2 MiB chunked" "$(curl_in -sSfk --http1.1 "$base/big" | sha256sum)" "$big"
            check "curl --http1.1 POST $base/echo" "$(curl_in -sSfk --http1.1 --data-binary 'a body of 21 bytes...' "$base/echo")" "a body of 21 bytes..."
            # 1 MiB is past curl's threshold for Expect: 100-continue, which /echo answers first.
            check "curl --http1.1 POST $base/echo of the 1 MB file" "$(curl_in -sSfk --http1.1 --data-binary @/www/file "$base/echo" | sha256sum)" "$file"
            check "curl --http1.1 says it spoke HTTP/1.1 to $base" "$(curl_in -sSfk --http1.1 -o /dev/null -w '%{http_version}' "$base/hello" || echo ' (failed)')" "1.1"
          done
          exit "$fail"

      - name: curl --http2 resumes a TLS 1.3 session
        run: |
          curl_in() { docker run --rm --network host --entrypoint curl "$CURL" --max-time 60 "$@"; }
          fail=0
          check() {
            if [ "$2" = "$3" ]; then echo "PASS  $1"; else echo "FAIL  $1: got '$2', want '$3'"; fail=1; fi
          }
          # The pinned curl has no --ssl-sessions, so one invocation fetches two URLs and keeps the
          # first connection's ticket for the second. /close answers and then sends GOAWAY, so the
          # second URL needs a new connection: num_connects is 1 for each, where two URLs on one
          # connection read "1 0".
          seen="$(docker logs nish 2>&1 | wc -l)"
          url="https://127.0.0.1:$H2_PORT/close"
          check "curl --http2 opens a new connection for the second /close" \
            "$(curl_in -sSfk --http2 -o /dev/null -o /dev/null -w '%{num_connects} ' "$url" "$url" || echo ' (failed)')" "1 1 "
          # The server logs one line per handshake as it completes, before it answers.
          handshakes=""
          for _ in $(seq 1 50); do
            handshakes="$(docker logs nish 2>&1 | tail -n +"$((seen + 1))" | grep '^tls: ' | tr '\n' ' ')"
            [ "$handshakes" = "tls: full tls: resumed " ] && break
            sleep 0.1
          done
          check "the server resumed curl's second connection" "$handshakes" "tls: full tls: resumed "
          exit "$fail"

      - name: The server's log
        if: always()
        run: docker logs nish

  chrome:
    name: chrome WebTransport and HTTP/1.1 (${{ matrix.certificate }} certificate)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        certificate: [minted, openssl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 5
        with:
          name: nish-interop-image

      - name: Pull Playwright's image
        timeout-minutes: 10
        run: docker pull "$PLAYWRIGHT"

      - name: Start the server
        env:
          CERTIFICATE: ${{ matrix.certificate }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/certs"
          certs=""
          if [ "$CERTIFICATE" = openssl ]; then
            # The shape the runner's certs.sh makes: P-256, ten days, with extensions.
            openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/certs/priv.key"
            openssl req -x509 -sha256 -key "$RUNNER_TEMP/certs/priv.key" -out "$RUNNER_TEMP/certs/cert.pem" \
              -days 10 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
            certs="--certs /certs"
          fi
          docker load --input nish-interop.tar.gz
          # shellcheck disable=SC2086 # $certs is empty or two words
          docker run -d --name nish --network host -v "$RUNNER_TEMP/out:/out" -v "$RUNNER_TEMP/certs:/certs:ro" \
            --entrypoint /interop-server nish-interop:ci \
            serve $SERVE_PORTS \
            --hash-file /out/hash $certs
          # Ready once it has printed its ports, which it does after binding them and writing the hash file.
          for _ in $(seq 1 100); do docker logs nish 2>&1 | grep -q '^ports ' && break; sleep 0.1; done
          docker logs nish
          docker logs nish 2>&1 | grep -q '^ports '

      # pip's install is the network part; Chromium's own wait is a few seconds.
      - name: Chromium opens a session and echoes a datagram and a stream
        timeout-minutes: 5
        run: |
          docker run --rm --network host --ipc host \
            -v "$GITHUB_WORKSPACE/tests/interop:/interop:ro" -v "$RUNNER_TEMP/out:/out:ro" \
            "$PLAYWRIGHT" sh -c "set -e
              pip install --quiet --no-deps --require-hashes -r /interop/chrome-requirements.txt
              python3 /interop/chrome-webtransport.py $H1_PORT $QUIC_PORT /out/hash"

      # The verdict is the server's: the script reads the log streamed here, and passes only if
      # the first navigation's handshake was full and the second's, on a new connection, resumed.
      - name: Chromium resumes a TLS 1.3 session on a second connection
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/log"
          docker logs -f nish > "$RUNNER_TEMP/log/server.log" 2>&1 &
          follow=$!
          trap 'kill "$follow"' EXIT
          # The script's baseline is the file's length when it starts, so the stream must hold the log so far.
          lines="$(docker logs nish 2>&1 | wc -l)"
          for _ in $(seq 1 100); do [ "$(wc -l < "$RUNNER_TEMP/log/server.log")" -ge "$lines" ] && break; sleep 0.1; done
          [ "$(wc -l < "$RUNNER_TEMP/log/server.log")" -ge "$lines" ] || { echo "the streamed log never reached the server's $lines lines"; exit 1; }
          docker run --rm --network host --ipc host \
            -v "$GITHUB_WORKSPACE/tests/interop:/interop:ro" -v "$RUNNER_TEMP/out:/out:ro" -v "$RUNNER_TEMP/log:/log:ro" \
            "$PLAYWRIGHT" sh -c "set -e
              pip install --quiet --no-deps --require-hashes -r /interop/chrome-requirements.txt
              python3 /interop/chrome-resume.py $H2_PORT /out/hash /log/server.log"

      # The HTTP/1.1 ports present the test leaf whatever --certs names, so one matrix row is enough.
      - name: Chromium speaks HTTP/1.1 and WebSocket, over TLS and plain
        if: matrix.certificate == 'minted'
        timeout-minutes: 5
        run: |
          docker run --rm --network host --ipc host \
            -v "$GITHUB_WORKSPACE/tests/interop:/interop:ro" \
            "$PLAYWRIGHT" sh -c "set -e
              pip install --quiet --no-deps --require-hashes -r /interop/chrome-requirements.txt
              python3 /interop/chrome-http1.py $H1_PORT $H1S_PORT"

      - name: The server's log
        if: always()
        run: docker logs nish

  autobahn:
    name: autobahn fuzzingclient (WebSocket over HTTP/1.1)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 5
        with:
          name: nish-interop-image

      - name: Pull the Autobahn TestSuite
        timeout-minutes: 10
        run: docker pull "$AUTOBAHN"

      - name: Start the server
        run: |
          docker load --input nish-interop.tar.gz
          # shellcheck disable=SC2086 # $SERVE_PORTS is several words
          docker run -d --name nish --network host --entrypoint /interop-server nish-interop:ci \
            serve $SERVE_PORTS --ws-port "$WS_PORT"
          for _ in $(seq 1 100); do docker logs nish 2>&1 | grep -q '^ports ' && break; sleep 0.1; done
          docker logs nish
          docker logs nish 2>&1 | grep -q " ws $WS_PORT\$"

      # The cases take about three minutes, most of it 9.*'s messages of up to 16 MiB.
      - name: The fuzzingclient runs every case
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          chmod 777 "$RUNNER_TEMP/reports"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/tests/interop:/config:ro" -v "$RUNNER_TEMP/reports:/reports" \
            --entrypoint wstest "$AUTOBAHN" -m fuzzingclient -s /config/autobahn-fuzzingclient.json

      - name: Every case OK or INFORMATIONAL
        run: python3 -I tests/interop/autobahn-verdict.py "$RUNNER_TEMP/reports/servers/index.json" nish

      - name: The server's log
        if: always()
        run: docker logs nish

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: autobahn-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore

  # The soak is ten minutes by design, so this job alone is given 25: the soak,
  # the compiler built from the seed (about two minutes), the image pull and pip.
  arena:
    name: chrome wasm-arena soak (ten minutes)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4

      # The runner image ships these; the action makes sure, through the cache.
      # wasm-host links need no WASI sysroot.
      - name: Install LLVM 18 + lld
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: clang-18 lld-18 llvm-18

      - name: Link the LLVM 18 tools by their plain names
        run: |
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang llc llvm-as llvm-link llvm-nm opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 5
        with:
          name: nish-interop-image

      - name: Pull Playwright's image
        timeout-minutes: 10
        run: docker pull "$PLAYWRIGHT"

      # The compiler from this checkout, then the page (client.wasm under
      # --profile wasm-host, its loader, page.js) and the native replay.
      - name: Build the compiler and examples/wasm-arena
        timeout-minutes: 8
        run: |
          bash scripts/fetch-seed.sh
          build/seed/bin/nish src/compile.ts --link build/nish
          node --no-warnings examples/wasm-arena/build.mjs --nish build/nish --out build/arena
          ls -l build/arena/web

      # The page over plain HTTP on localhost, a secure context; the server for
      # the datagram check, with the certificate it mints.
      - name: Serve the page and start the interop server
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          (cd build/arena/web && python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &)
          docker load --input nish-interop.tar.gz
          # shellcheck disable=SC2086 # $SERVE_PORTS is the flags, word by word
          docker run -d --name nish --network host -v "$RUNNER_TEMP/out:/out" \
            --entrypoint /interop-server nish-interop:ci \
            serve $SERVE_PORTS --hash-file /out/hash
          for _ in $(seq 1 100); do docker logs nish 2>&1 | grep -q '^ports ' && break; sleep 0.1; done
          docker logs nish 2>&1 | grep -q '^ports '
          curl -sSf -o /dev/null http://127.0.0.1:8000/index.html

      - name: Chromium runs the arena for ten minutes
        timeout-minutes: 14
        run: |
          docker run --rm --network host --ipc host \
            -v "$GITHUB_WORKSPACE/tests/interop:/interop:ro" -v "$RUNNER_TEMP/out:/out" \
            "$PLAYWRIGHT" sh -c "set -e
              pip install --quiet --no-deps --require-hashes -r /interop/chrome-requirements.txt
              python3 /interop/chrome-arena.py http://127.0.0.1:8000/index.html 600 /out/arena.json \
                --expect webgpu --adapter swiftshader --webtransport $QUIC_PORT /out/hash"

      # The browser's input, replayed by sim.ts compiled natively with
      # --deterministic, must land on the hash the page printed.
      - name: The recorded input replays natively to the same hash
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/out/arena.json" build/arena/replay <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess, sys
          if not os.path.exists(sys.argv[1]):
              print("### wasm-arena: no report\n\nchrome-arena.py wrote no arena.json; its step's log says why.")
              sys.exit(1)
          d = json.load(open(sys.argv[1]))
          print("### wasm-arena: ten minutes in Chromium", d.get("chromium"))
          print()
          print("| | |\n|---|---|")
          print(f"| browser | {d.get('chromium')}; {d.get('userAgent')} |")
          print(f"| renderer | {d.get('renderer')}, expected {d.get('expect')} on {d.get('adapter')} ({d.get('gpu')}) |")
          for f in d["failures"]:
              print(f"| FAIL | {f} |")
          if "heap" not in d:
              sys.exit(1)
          native = subprocess.run([sys.argv[2], "1", str(d["ticks"])] + d["runs"], capture_output=True, text=True, check=True).stdout.split()
          h = d["heap"]
          print(f"| frames, ticks | {d['frames']}, {d['ticks']} in {d['elapsed']} s |")
          print(f"| memory.buffer.byteLength | {d['byteLength']}, moved after {d['moved']} frames |")
          print(f"| arena mark | {d['mark']}, the same after every frame: {d['moved'] == 0} |")
          print(f"| used heap after GC, minute 1 / 10 | {h['early']} / {h['late']} ({h['delta']:+d} bytes; band ±{d['heapBand']}) |")
          print(f"| sampled allocation | {h['bytesPerFrame']} bytes a frame over {h['sampledFrames']} frames (band {d['frameBand']}) |")
          print(f"| heaviest sites | {'; '.join(s['site'] + ' ' + str(s['bytes']) for s in h['heaviest'])} |")
          print(f"| page hash / native replay | {d['hash']} / {native[3]} |")
          dg = d.get("datagram", {})
          print(f"| datagram write copies (§5.3) | {dg.get('copied')} after {dg.get('tries')} tries: {dg.get('detail')} |")
          for r in d.get("loadSync", []):
              print(f"| loadSync of {r['size']} bytes (§8) | {'ok' if r['ok'] else 'refused'} in {r['ms']:.1f} ms: {r['detail']} |")
          if native[3] != d["hash"]:
              print(f"native replay {native[3]} != page {d['hash']}", file=sys.stderr)
              sys.exit(1)
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: The server's log
        if: always()
        run: docker logs nish
