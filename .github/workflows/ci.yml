# Nish continuous integration.
#
# test: typecheck + the full golden/native test suite on Linux and macOS with
#       LLVM 18 (clang, llc, llvm-as, opt, ld.lld, wasm-ld), then a binary size
#       table in the job summary, and the IR cookbook staleness check.
# lint: `npm run lint` when package.json defines it (no-op otherwise), then
#       docs/check-links.mjs over every Markdown file.
#
# Also reusable via `workflow_call`: release.yml runs it before packing a tag.
# To run the same steps locally see docs/wp10-ci.md.
name: CI

# `push` is scoped to main on purpose. An unscoped `push:` fires on every
# branch, so one push to a branch with an open pull request ran the whole
# matrix twice: once for `push` and once for `pull_request`. The concurrency
# group below cannot collapse those two, because `github.ref` is
# `refs/heads/<branch>` for the push and `refs/pull/<n>/merge` for the pull
# request, which puts them in different groups where neither cancels the
# other. Tags keep their coverage: release.yml triggers on `v*` and reaches
# this workflow through `workflow_call`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest was out of this matrix for a reason that has since been
        # fixed at both sites, so it is back. For the record, because the
        # symptom was confusing: scripts/build.sh runs under `set -u` and macOS
        # ships bash 3.2 (Apple will not ship GPLv3), where expanding an empty
        # array as "${arr[@]}" is an "unbound variable" error -- bash 4.4 made
        # it legal, so every Linux runner was fine and every --link at the
        # speed/size/napi profiles died on macOS with
        #   scripts/build.sh: line 96: pgo[@]: unbound variable
        # build.sh took the ${arr[@]+"${arr[@]}"} spelling in 2f5dd13, and
        # scripts/smoke.sh dropped its bash-4 `mapfile` for a read loop, which
        # was the other half nobody had noticed.
        #
        # Two entries, where release.yml builds three binaries. This matrix
        # runs on every pull request, and what it covers is the two operating
        # systems -- the bash version, the linker (ld64 vs lld), the strip
        # flag, BSD vs GNU userland. A second architecture per OS would cost
        # every contributor another wait to re-test the same code paths. Each
        # *binary* is built and smoke-tested on its own native runner by
        # release.yml, which is where an arch-specific break would show.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/llvm

      - name: Node versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Smoke (build + run every example with a main, size profile)
        run: bash scripts/smoke.sh

      # docs/IR_COOKBOOK.md promises the exact IR each construct compiles to
      # *today*, and agents are pointed at it as a reference. It drifted once
      # (the `internal` linkage of --strict-exports and the `nsw` defaults were
      # missing), so the staleness check is a gate rather than a chore.
      - name: Docs (IR cookbook up to date)
        run: bash docs/cookbook/regen.sh --check

      # The diagnostic-code registry is generated from the compiler's own
      # diagnostic sites; a new diagnostic without a code must not ship.
      # `npm test` checks it too -- this names it in its own step so a stale
      # registry reads as itself rather than as one failure among a thousand.
      - name: Diagnostic codes (registry up to date)
        run: node scripts/gen-diagnostic-codes.mjs --check

      - name: Size report
        run: |
          node dist/index.js examples/add.ts -o build/add.ll
          bash scripts/size-report.sh --markdown build/add.ll examples/main.c | tee build/size-report.md
          {
            echo "### Binary size (${{ matrix.os }}, LLVM 18)"
            echo
            echo '`examples/add.ts` + `examples/main.c` + `runtime/runtime.c`'
            echo
            cat build/size-report.md
          } >> "$GITHUB_STEP_SUMMARY"

  # WP19 G3: build self/ with the LAST RELEASED nish rather than with stage0.
  #
  # This is the job that enforces the rolling freeze. Nish has no conditional
  # compilation and will not grow any -- there is no #[cfg(bootstrap)] to
  # write -- so "a construct added in 0.N cannot be used by self/ until
  # 0.(N+1)" (docs/wp12-release.md, "The bootstrap seed") is a discipline, and
  # a discipline CI does not check is a comment. Using a construct too early
  # breaks here and nowhere else: `npm test` bootstraps with stage0, which
  # always knows every construct the working tree does.
  #
  # G3 asks for this on both operating systems, and now that macos-latest is
  # back in the matrix above it runs on both. Each runner seeds from the asset
  # for its own platform, which is also what proves that asset is a working
  # compiler and not just a file that uploaded cleanly.
  #
  # Two states are reported rather than failed, because neither is a fault in
  # the commit under test: a repository with no release at all (which is where
  # this started), and a release that predates the platform this runner is on
  # -- v0.1.1 shipped x86_64-linux alone, so every other platform has nothing
  # to seed from until the next release. Both are deliberately NOT a silent
  # success: the last step says which release it used, or exactly why it used
  # none, so a green run cannot be mistaken for a freeze that was checked.
  bootstrap:
    name: bootstrap (${{ matrix.os }}, from the last release)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ./.github/actions/llvm

      - name: Install dependencies
        run: npm ci

      # `gh release download` fails when the repository has no release at all,
      # and again when the release has no asset for this runner's platform --
      # so ask both questions and record the answer, rather than reading a
      # failed download as "no release".
      - name: Find the last release
        id: seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -z "$tag" ]; then
            echo "why=no release exists yet" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="nish-${tag#v}-$(bash scripts/platform.sh)"
          # Listed, not probed with a download: a download that fails cannot
          # tell "this release has no binary for this platform" apart from an
          # API or auth error, and those two want opposite handling. A failing
          # `gh release view` takes the step down with it, which is right --
          # that is a broken runner, not a release that predates a platform.
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "$assets" | grep -qx "$name.tar.gz"; then
            echo "why=$tag has no $name.tar.gz asset" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$tag" --pattern "$name.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$name/bin/nish" >> "$GITHUB_OUTPUT"

      - name: Build self/ with the seed
        if: steps.seed.outputs.tag != ''
        run: |
          "${{ steps.seed.outputs.path }}" --version
          NISH_BOOTSTRAP="${{ steps.seed.outputs.path }}" bash scripts/bootstrap.sh --verify

      - name: Say what this proved
        run: |
          if [ -z "${{ steps.seed.outputs.tag }}" ]; then
            echo "::notice::self/ was NOT built from a seed on ${{ matrix.os }} (${{ steps.seed.outputs.why }}). The rolling freeze is unchecked here until a release carries this platform."
          else
            echo "::notice::self/ built and verified with ${{ steps.seed.outputs.tag }} as the seed on ${{ matrix.os }}."
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (only when package.json defines a lint script)
        run: npm run lint --if-present

      # Every relative link and heading anchor in README, CHANGELOG and docs/**.
      # The guidelines are a graph of pointers between files; a broken one sends
      # a reader -- human or agent -- to a page that does not exist.
      - name: Docs (links and anchors resolve)
        run: node docs/check-links.mjs
