# Nish continuous integration.
#
# test: typecheck + the full golden/native test suite on Linux with LLVM 18
#       (clang, llc, llvm-as, opt, ld.lld, wasm-ld), then a binary size table
#       in the job summary, and the IR cookbook staleness check. The matrix is
#       written for macOS too and that row is commented out; the comment
#       beside it names the checks that fail there, and which are left.
# seeds + bootstrap: the rolling freeze (WP19 G3), as a pair of jobs rather
#       than one, so that "the freeze held" and "there was nothing here to
#       check it with" are not the same colour. `seeds` asks the last release
#       which seed binaries it attaches; `bootstrap` is one row per seed that
#       exists, so a platform with no seed has no row rather than a green one.
#       The table above the pair says which conclusion means which.
# parity-changed: WP19 G1 on the push path, bounded by the diff -- the corpus
#       programs this pull request touched, through both compilers under every
#       flag variation. A pull request that touches none pays nothing; the
#       nightly `parity.yml` is what covers the rest, and the flag-set half of
#       the mode already runs inside `npm test` above.
# lint: `npm run lint` when package.json defines it (no-op otherwise), then
#       docs/check-links.mjs over every Markdown file.
#
# Also reusable via `workflow_call`: release.yml runs it before packing a tag.
# To run the same steps locally see docs/wp10-ci.md.
name: CI

# `push` is scoped to main on purpose. An unscoped `push:` fires on every
# branch, so one push to a branch with an open pull request ran the whole
# matrix twice: once for `push` and once for `pull_request`. The concurrency
# group below cannot collapse those two, because `github.ref` is
# `refs/heads/<branch>` for the push and `refs/pull/<n>/merge` for the pull
# request, which puts them in different groups where neither cancels the
# other. Tags keep their coverage: release.yml triggers on `v*` and reaches
# this workflow through `workflow_call`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Node's on-disk V8 compile cache, for every job in this file.
#
# This is a measurement rather than a habit. The suite's cost is not compiling
# Nish; it is starting Node. `tests/batch_worker.js` has the breakdown for one
# `node dist/index.js <case>` -- about 634 ms on the box it was written on, of
# which 1.5 ms is compiling and ~473 ms is `import ts from "typescript"` -- and
# section A already avoids paying it by driving the library API in process. The
# oracles and `tests/diagnostic_coverage.js` cannot: they compare what the
# *command line* answers, so a process per program is the thing being checked.
#
# So the import is made cheaper instead of avoided. `NODE_COMPILE_CACHE` caches
# V8's compilation of every module it loads, keyed on the file's content and the
# Node version, and Node falls back to compiling normally when the key misses --
# a stale or absent cache costs time and can never change an answer. Measured on
# this repository: 412 ms -> 315 ms for one compiler spawn (-24%), and
# `tests/diagnostic_coverage.js --require-coverage --strict-refusals` 77.0 s ->
# 65.5 s (-15%).
#
# The path is outside the checkout on purpose. A cache directory inside
# `github.workspace` is a tree the repository does not track, and `npm test`,
# `docs/check-links.mjs` and `biome` all walk the tree.
env:
  NODE_COMPILE_CACHE: /tmp/nish-node-compile-cache

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest stays out of THIS job, and the reason is no longer a
        # guess. The row was run for the first time on 2026-09-13 (WP19 R2) and
        # `npm test` failed there with **five** failures in four families, none
        # of which is a compiler bug and all of which are checks that encode an
        # ELF/Linux assumption. Three of the five are untouched; 4,5 below are
        # narrowed rather than fixed, and they were the pair that reached past
        # this job:
        #
        #   1,2. `llvm-dwarfdump` of the linked binary reports an empty
        #        `.debug_line`. On Mach-O `clang -g` leaves DWARF in the .o
        #        files and the executable carries only a debug map; `dsymutil`
        #        is what produces a line table. Two checks read the executable.
        #   3.   "--threads IR refuses to link against a runtime built without
        #        -DNISH_THREADS" links fine and exits 0. ELF refuses a TLS
        #        symbol against a non-TLS definition; ld64 does not. The safety
        #        net build.sh's header describes does not exist on macOS --
        #        which is a finding about the platform, not about the check.
        #   4,5. `stage3 == stage2` as files failed at *identical size*
        #        (597,048 bytes both). The IR equalities all pass, so the
        #        compiler is deterministic and the linker is not -- but WHICH
        #        bytes ld64 varies has not been measured. NARROWED, not fixed:
        #        the comparison is scripts/verify-binaries.sh now, which on
        #        Darwin asserts the size, strips what it can, and fails
        #        anything left over as *unattributed* with the next step in the
        #        message. That is better than the raw byte comparison and it is
        #        not a pass: a darwin binary is as likely as not to trip it,
        #        which is why seed-targets.json holds the darwin pair back.
        #
        # Restoring the row therefore means porting the remaining three checks
        # in two families, on hardware that has to be iterated against, and
        # that is a package of its own rather than a line in this matrix. So
        # NOTHING in this file runs on macOS until a release attaches a darwin
        # seed: the `bootstrap` job below has one row per seed the last release
        # attaches, and v0.2.0 attaches x86_64-linux alone.
        #
        # The install half is already written and was exercised by that run:
        # the two "Install LLVM 18 + lld" steps below are guarded by
        # `runner.os`, so restoring the row is this line plus the three
        # remaining fixes.
        #
        # `fail-fast: false` above is what would keep a macOS-only failure from
        # cancelling the Linux row that says whether it is the platform or the
        # change.
        os: [ubuntu-latest] # , macos-latest -- see the failures above
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          # Debian ships versioned binaries (clang-18, llc-18, ...). Expose the
          # plain names through a private bin dir placed ahead of /usr/bin so the
          # scripts and tests/run.js find `clang`, `llc`, `llvm-as`, `opt`,
          # `ld.lld` and `wasm-ld` regardless of what the runner image ships.
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install LLVM 18 + lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          # Homebrew's llvm@18 bundles lld (ld.lld, wasm-ld). If a build ever
          # drops it, fall back to the standalone formula.
          if [ ! -x "$prefix/bin/wasm-ld" ]; then brew install lld; fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          for tool in clang llc llvm-as opt ld.lld wasm-ld; do
            printf '%-8s ' "$tool"; command -v "$tool"
          done
          clang --version | head -n 1
          llc --version | sed -n '2p'
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Smoke (build + run every example with a main, size profile)
        run: bash scripts/smoke.sh

      # docs/IR_COOKBOOK.md promises the exact IR each construct compiles to
      # *today*, and agents are pointed at it as a reference. It drifted once
      # (the `internal` linkage of --strict-exports and the `nsw` defaults were
      # missing), so the staleness check is a gate rather than a chore.
      - name: Docs (IR cookbook up to date)
        run: bash docs/cookbook/regen.sh --check

      # The diagnostic-code registry is generated from the compiler's own
      # diagnostic sites; a new diagnostic without a code must not ship.
      # `npm test` checks it too -- this names it in its own step so a stale
      # registry reads as itself rather than as one failure among a thousand.
      - name: Diagnostic codes (registry up to date)
        run: node scripts/gen-diagnostic-codes.mjs --check

      # The other half of WP19 G2.4 -- every code provoked by a program, not
      # only every diagnostic given a code -- is not a step here: it is inside
      # `npm test`, which runs `tests/diagnostic_coverage.js` with
      # `--require-coverage` and `--strict-refusals`.

      - name: Size report
        run: |
          node dist/index.js examples/add.ts -o build/add.ll
          bash scripts/size-report.sh --markdown build/add.ll examples/main.c | tee build/size-report.md
          {
            echo "### Binary size (${{ matrix.os }}, LLVM 18)"
            echo
            echo '`examples/add.ts` + `examples/main.c` + `runtime/runtime.c` + `runtime/runtime_os.c`'
            echo
            cat build/size-report.md
          } >> "$GITHUB_STEP_SUMMARY"

  # WP19 G3: build self/ with the LAST RELEASED nish rather than with stage0.
  #
  # Two jobs, because there are three answers and only two colours.
  #
  # `seeds` asks the last release which seed binaries it attaches; `bootstrap`
  # is a matrix over that answer, one row per seed that actually exists. A
  # platform with no seed therefore has no row rather than a green one, and
  # nothing in the checks list claims a freeze that nothing checked. CLAUDE.md
  # reads green as permission to merge, and this gate has now lied to that
  # reader twice: first by passing with a warning when it had verified nothing,
  # then by failing for a state in which nothing is wrong.
  #
  # WHICH CONCLUSION MEANS WHAT. Read the pair, not either half:
  #
  #   seeds green + a bootstrap row green   the freeze was checked with that
  #                                         seed, on that seed's own platform,
  #                                         and it held.
  #   seeds green + no row for a platform   the freeze was NOT checked there,
  #                                         and nothing is wrong: no release
  #                                         carries a seed for it yet. The
  #                                         `seeds` job summary lists every
  #                                         platform in both states by name.
  #   seeds green + bootstrap SKIPPED       the same, for every platform at
  #                                         once: there is no release at all.
  #   seeds RED                             a seed that should exist does not.
  #                                         The release is missing an asset
  #                                         release.yml attaches, and the
  #                                         annotation says how to get unstuck.
  #   a bootstrap row RED                   self/ does not build with the last
  #                                         release, which is the rolling
  #                                         freeze broken -- the failure this
  #                                         pair exists to catch.
  #
  # A job skipped by an `if:` reports SUCCESS to branch protection -- that is
  # GitHub's own rule for a conditional skip, as against a workflow skipped by
  # a path filter, which stays pending and blocks. So the grey is for the
  # reader and not for the merge button, which is the right way round:
  # CLAUDE.md's merge rule is addressed to a reader, and a required check that
  # stayed pending on every fork and before the first release is the deadlock
  # below.
  #
  # WHY "no release at all" MAY NOT BE RED. `release.yml`'s `release` job is
  # `needs: ci`, so a red CI is a release that cannot be cut. A repository with
  # no release has no seed, and if that were red the first release could never
  # be made: the gate would be waiting for an artifact only a release produces,
  # and the release would be waiting for the gate. That is the 0.1.0 base case
  # docs/wp12-release.md describes, and it is every fork of this repository on
  # the day it is forked. It is also, exactly, the argument this file makes for
  # keeping the macOS `test` row out, applied to a job that sits on the release
  # path.
  #
  # WHY a missing x86_64-linux seed IS red. There the release exists and is
  # supposed to carry it: .github/seed-targets.json marks that target
  # `attached`, which is release.yml's own statement that it builds one. Its
  # absence is a regression in that workflow or in the asset name the two
  # workflows share, not a state of the world -- and it costs the rolling
  # freeze its only check.
  #
  # This pair is what enforces the rolling freeze. Nish has no conditional
  # compilation and will not grow any -- there is no #[cfg(bootstrap)] to
  # write -- so "a construct added in 0.N cannot be used by self/ until
  # 0.(N+1)" (docs/wp12-release.md, "The bootstrap seed") is a discipline, and
  # a discipline CI does not check is a comment. Using a construct too early
  # breaks here and nowhere else: `npm test` bootstraps with stage0, which
  # always knows every construct the working tree does.
  #
  # G3 asks for this on **both** operating systems and it runs on Linux alone,
  # because v0.2.0 attaches x86_64-linux and nothing else. What kept the second
  # one out was two things. One has landed and one is narrowed but open:
  #
  #   * the darwin **seed**, which is WP19 G5, and which release.yml now
  #     builds -- one per target, from .github/seed-targets.json. Until a
  #     release carries it macOS is the second state above: no row, and the
  #     `seeds` summary saying which version it is waiting for.
  #   * the **ld64 fixed point**, which was the `stage3 == stage2` family in
  #     the `test` matrix comment above, and which is **narrowed rather than
  #     settled**. scripts/verify-binaries.sh asserts the size on Darwin,
  #     strips what it can, and fails the remainder as *unattributed* -- which
  #     no longer misreports a benign difference as a compiler difference, but
  #     also does not yet let one through. Until someone measures which bytes
  #     ld64 varies, a macOS row could still be red on the day its seed
  #     arrived, which is the other way a gate lies about itself -- so the
  #     darwin pair's attachedSince is held past the next release rather than
  #     this being called done.
  #
  # Neither is a line in this file, and that is the point of the matrix being
  # the release's answer: the row appears when the seed does, on the runner
  # seed-targets.json names for it, with no edit here.
  seeds:
    name: which seeds the last release attaches
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.pick.outputs.rows }}
    steps:
      - uses: actions/checkout@v4

      # The lookup is a job of its own, before any toolchain and before
      # `npm ci`, for two reasons. It is the gate, so it should answer in
      # seconds rather than after two minutes of setup it may be about to throw
      # away; and its answer has to be a *job* conclusion and a matrix, because
      # a step that skips inside a green job leaves the job green.
      #
      # The script is in a file rather than here so that `npm test` can run it:
      # tests/run.js drives it against a stand-in for `gh` through each of its
      # states, which is the check that was missing both times this logic was
      # got wrong.
      - name: Ask the last release what it carries
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/seed-matrix.sh

  bootstrap:
    name: bootstrap (${{ matrix.seed.asset }})
    needs: seeds
    # Before the first release nothing is seeded anywhere, which is an empty
    # matrix -- and an empty matrix is a strategy GitHub refuses to evaluate
    # rather than a job with no rows. `seeds` is what says so in that state,
    # and this job is grey rather than green.
    if: needs.seeds.outputs.rows != '[]'
    runs-on: ${{ matrix.seed.runner }}
    strategy:
      # One platform's linker is not another's, so a failure on one row must
      # not cancel the row that would say whether it is the platform or the
      # change.
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.rows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The toolchain is installed on rows that have a seed to build with,
      # which is all of them: a platform with no seed has no row and rents no
      # runner. A `brew install llvm@18` on a row whose every later step is
      # skipped is 42 seconds of the slowest runner GitHub rents, on every
      # push, to emit one warning.
      - name: Install LLVM 18 + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install LLVM 18 + lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          if [ ! -x "$prefix/bin/wasm-ld" ]; then brew install lld; fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The tarball name is .github/seed-targets.json's, resolved against the
      # release by `seeds`. This row exists *because* that asset is on the
      # release, so a download that fails here is a network or permissions
      # fault rather than the absence the gate is about.
      #
      # The matrix reaches bash through `env:` rather than through ${{ }}
      # spliced into the script. A maintainer-created tag is not a plausible
      # attacker, but the value came out of a release and the rule costs
      # nothing -- it is the one pr-title.yml already states.
      - name: Download the seed
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.seed.tag }}
          TARBALL: ${{ matrix.seed.tarball }}
        run: |
          gh release download "$TAG" --pattern "$TARBALL" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP"
          echo "path=$RUNNER_TEMP/${TARBALL%.tar.gz}/bin/nish" >> "$GITHUB_OUTPUT"

      - name: Build self/ with the seed
        env:
          SEED: ${{ steps.download.outputs.path }}
        run: |
          "$SEED" --version
          NISH_BOOTSTRAP="$SEED" bash scripts/bootstrap.sh --verify

      # The command line's contract, asked of the compiler that outlives stage0.
      # `tests/nish/cli.ts` is a Nish program reading the compiler's own output —
      # the streams, the exit-code bands, one flat `--json` object per diagnostic —
      # and this is the only place it is pointed at a *self-hosted* nish. `npm test`
      # runs it against stage0; a divergence in stage1's driver fails only here.
      # Two checks are stage0's own and report as counted skips, which the summary
      # below prints.
      - name: The CLI contract, against the self-hosted compiler
        run: |
          set -o pipefail
          npm run build
          node dist/index.js tests/nish/cli.ts -o build/nish-cli.ir/ --link build/nish-cli
          build/nish-cli build/nish | tee "$RUNNER_TEMP/nish-cli.log"
          echo "::notice::tests/nish/cli.ts against build/nish: $(tail -n 1 "$RUNNER_TEMP/nish-cli.log")"

      # Reached only when every step above succeeded, which is the point: this
      # line is a claim about a run that happened, and there is no branch of it
      # that describes one that did not. The states in which it did not happen
      # do not reach this job at all -- they are the `seeds` job's summary and
      # a row that is not here.
      - name: Say what this proved
        env:
          TAG: ${{ matrix.seed.tag }}
          ASSET: ${{ matrix.seed.asset }}
          TRIPLE: ${{ matrix.seed.triple }}
        run: |
          echo "::notice::self/ built and verified with $TAG's $ASSET seed ($TRIPLE). That is the rolling freeze checked on this platform, and it says nothing about any other."
          { echo "### The rolling freeze (WP19 G3)"; echo; echo "self/ built and verified with $TAG's \`$ASSET\` seed ($TRIPLE). That is this platform; the \`seeds\` job lists the platforms nothing checked."; } >> "$GITHUB_STEP_SUMMARY"


  # The golden cases again, through the harness written in the language rather
  # than through the one written in Node (`tests/nish/run.ts`, `npm run
  # test:nish`). `npm test` builds that runner and runs it over five cases, which
  # proves it compiles and works; only the full pass proves it still *agrees*,
  # and a harness nobody runs is a harness that rots.
  #
  # It is not a duplicate of the `test` job, and what it adds is worth stating: a
  # compiler regression fails in both, but a regression in the runner itself --
  # or in `readdirSync`, `spawnSyncTo` or `monotonicNanos`, which nothing else
  # exercises together on a real workload -- fails only here. It runs in parallel
  # with `test`, so it costs a runner rather than wall-clock time, and it spawns a
  # compiler per case, which is why `npm test` does not pay for it.
  runner:
    name: the golden cases, in Nish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The runner answers 1 when any check failed, so the step's own exit status
      # is the gate. Its last line is the summary, which is what a reader wants
      # in the job log without expanding it.
      # `set -o pipefail` is load-bearing: the default shell for a `run:` step is
      # `bash -e`, without it, so the exit status of a pipeline would be `tee`'s
      # and a runner that answered 1 would still be a green step.
      - name: The corpus, through the Nish runner
        run: |
          set -o pipefail
          npm run test:nish | tee "$RUNNER_TEMP/nish-runner.log"

      - name: Say what this proved
        if: always()
        run: |
          summary="$(tail -n 1 "$RUNNER_TEMP/nish-runner.log" 2>/dev/null || echo 'the runner produced no summary')"
          echo "::notice::tests/nish/run.ts over tests/cases: $summary"

  # Section A of `tests/run.js` compiles the golden cases in process, sixty-four
  # to a worker, rather than spawning `dist/index.js` once per case. That is the
  # difference between six minutes and a handful of seconds, and the whole of it
  # rests on the two paths answering the same thing -- so this job compiles the
  # *whole* corpus both ways and compares the exit status, stdout, stderr and the
  # bytes of every module.
  #
  # `npm test` checks one case per shape on every run (`gateCases` in
  # `tests/batch_compile.js` says which, and why that set is derived from the
  # corpus rather than listed). The complete comparison costs one compiler process
  # per case -- the very thing the change removed -- which is exactly the bill a
  # CI runner should pay instead of a developer's inner loop. It runs in parallel
  # with `test`, so it costs a runner rather than wall-clock time, and the
  # toolchain is installed so that the goldens the gate reads still assemble and
  # run natively rather than skipping underneath it.
  #
  # It *is* a narrower run, and that is a correction rather than a relaxation.
  # This comment used to say the opposite -- "`npm test` with the gate widened,
  # not a narrower run" -- and the cost of the difference was measured on
  # 2026-09-18: the job took 18 m 21 s, of which 14 m 44 s was `tests/run.js`
  # making, a second time, on the same commit, exactly the checks the `test` job
  # makes. `--verify-batch` changes one set in one line and nothing else, so the
  # second run of the other nineteen hundred checks proved nothing the first did
  # not, and because this is the longest job in the workflow it was the workflow's
  # wall clock. `--batch-gate-only` stops after the gate and carries a counted
  # skip that names what it did not check, so the narrowing is in the output
  # rather than only here.
  batch-parity:
    name: the batched compile against the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `--batch-gate-only` widens the gate to the whole corpus and then stops;
      # the section's own checks run as usual, so a difference is a FAIL line
      # naming the case.
      #
      # It stops because `--verify-batch` alone changes exactly one thing about
      # the run -- the gate's set -- and then runs every other check in
      # `tests/run.js` a second time, on the same commit the `test` job is
      # already running them on. This is the longest job in the workflow, so
      # that duplicate was the workflow's wall clock. Measured: 105.8 s against
      # 684.9 s, making 1,780 of the full mode's 2,560 checks, where the 780 left
      # out are the ones the `test` job makes on this same commit. The narrow run
      # reports as a narrow run: its summary carries a counted skip naming them.
      - name: Every golden case, compiled both ways
        run: |
          set -o pipefail
          node tests/run.js --batch-gate-only | tee "$RUNNER_TEMP/batch-parity.log"

      # The summary is not the last line: a run with skips prints a note after it,
      # so the line is picked by what it says rather than by where it sits.
      - name: Say what this proved
        if: always()
        run: |
          summary="$(grep -E '^[0-9]+ passed, ' "$RUNNER_TEMP/batch-parity.log" 2>/dev/null | tail -n 1)"
          echo "::notice::the batched compile against the CLI, over tests/cases: ${summary:-the run produced no summary}"

  # WP19 G1 on the push path, bounded by the diff.
  #
  # `parity.yml` runs `node tests/run.js --parity` -- the whole corpus through
  # both compilers under every flag variation -- nightly on `main`. That fixes
  # "nobody remembered to type the command". It does not stop a pull request
  # from merging a difference, and that is exactly how one got in: the `CPtr`
  # internal compiler error under `-g` reached `main` on a green pull request
  # and was found by a nightly four nights later, by which time the gate had
  # been red for four days with nobody reading it.
  #
  # The full corpus cannot go here. Measured on `ubuntu-latest` on 2026-09-18:
  # `13260 runs over 884 programs (2100.5 s)`, in a job that took 36 minutes
  # end to end, and the four nightlies before it took 36 to 56. It grows with
  # every program and with every flag the suite adds, so putting it on every
  # push is the trade `parity.yml`'s own header argues against -- and that
  # header is right.
  #
  # So the check is bounded by what the pull request touched: the corpus
  # programs its diff adds, edits or deletes files of, and nothing else. A pull
  # request that touches no corpus program never installs a toolchain and never
  # builds a compiler; one that adds a case pays for that case, under all
  # fifteen variations, against both compilers. `changedPrograms` in
  # `tests/self/parity.js` owns the file-to-program mapping and its comment
  # states the rule.
  #
  # WHAT THIS DOES NOT COVER, and it is worth saying plainly because a bounded
  # gate read as an unbounded one is the failure this whole work package is
  # about. A `src/` or `self/` edit can move every program in the corpus, and
  # this job sees only the `self/` modules the diff happens to touch. The
  # nightly is what covers the rest, and the flag-set half of the mode --
  # the half that found `--no-warn-performance` and `--out-dir` -- already runs
  # on every `npm test` inside the `test` job above. Between the three, a
  # reintroduced difference is red somewhere a human is looking: on the pull
  # request when the pull request wrote the program, in the issue tracker the
  # next morning otherwise.
  parity-changed:
    name: parity (the programs this pull request touched)
    runs-on: ubuntu-latest
    steps:
      # Two commits deep, because the diff is taken from git rather than from
      # the API. On a `pull_request` event the checkout is the merge commit, so
      # `HEAD^1` is the base branch and `git diff HEAD^1 HEAD` is the pull
      # request's net change against it -- no second fetch and no base-ref
      # guessing. On a push it is the commit before this one, which after a
      # squash merge is the merged pull request's own diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--list` builds nothing: it reads the corpus off disk, maps the changed
      # files onto programs and names them. That is what makes "a pull request
      # that changes no corpus program pays nothing" true rather than nearly
      # true -- every step below this one is skipped, toolchain included.
      - name: Which corpus programs this diff touches
        id: select
        run: |
          base=HEAD^
          if [ "${{ github.event_name }}" = "pull_request" ]; then base=HEAD^1; fi
          if git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            # A repository with one commit in it, and nothing to compare against.
            : > "$RUNNER_TEMP/changed.txt"
          fi
          node tests/self/parity.js --changed "$RUNNER_TEMP/changed.txt" --list \
            > "$RUNNER_TEMP/selected.txt"
          count=$(wc -l < "$RUNNER_TEMP/selected.txt" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "selected $count corpus program(s) out of $(wc -l < "$RUNNER_TEMP/changed.txt") changed file(s)"
          cat "$RUNNER_TEMP/selected.txt"

      - name: Install LLVM 18 + lld
        if: steps.select.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.select.outputs.count != '0'
        run: npm ci

      # The mode spawns `dist/index.js` for stage0 and links its own stage1
      # binary out of `self/`, so stage0 has to exist first.
      - name: Build stage0
        if: steps.select.outputs.count != '0'
        run: npm run build

      # `set -o pipefail`, because the default shell for a `run:` step is
      # `bash -e` without it and the pipeline's status would be `tee`'s: a mode
      # that answered 1 would be a green step, which is this job's whole subject.
      - name: Parity over those programs
        if: steps.select.outputs.count != '0'
        run: |
          set -o pipefail
          node tests/run.js --parity --changed "$RUNNER_TEMP/changed.txt" \
            | tee "$RUNNER_TEMP/parity-changed.log"

      # What the job proved, in each of its three states -- because "no corpus
      # program changed", "every changed program agrees" and "the selection
      # never ran" are three different claims and one green tick says none of
      # them by itself. `COUNT` is empty rather than `0` in the third, which is
      # what keeps it apart from the first.
      - name: Say what this proved
        if: always()
        env:
          COUNT: ${{ steps.select.outputs.count }}
        run: |
          {
            echo "### Parity, bounded by this diff ($(date -u +%Y-%m-%d), ubuntu-latest)"
            echo
            if [ -z "$COUNT" ]; then
              echo "The selection step did not finish, so this diff was not compared at all."
            elif [ "$COUNT" = "0" ]; then
              echo "No corpus program is touched by this diff, so nothing was compared."
              echo "The nightly \`Parity\` workflow is what covers the corpus this did not."
            else
              echo "$COUNT corpus program(s), every flag variation, both compilers:"
              echo
              echo '```'
              cat "$RUNNER_TEMP/selected.txt" 2>/dev/null || true
              echo '```'
              echo
              echo '```'
              tail -n 20 "$RUNNER_TEMP/parity-changed.log" 2>/dev/null || echo "(the mode produced no output)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (only when package.json defines a lint script)
        run: npm run lint --if-present

      # Every relative link and heading anchor in README, CHANGELOG and docs/**.
      # The guidelines are a graph of pointers between files; a broken one sends
      # a reader -- human or agent -- to a page that does not exist.
      - name: Docs (links and anchors resolve)
        run: node docs/check-links.mjs
