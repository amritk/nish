# Nish continuous integration.
#
# test: typecheck + the full golden/native test suite on Linux with LLVM 18
#       (clang, llc, llvm-as, opt, ld.lld, wasm-ld), every case compiled by a
#       stage1 the last released nish builds, then a binary size table in the
#       job summary, and the IR cookbook staleness check. The matrix is
#       written for macOS too and that row is commented out; the comment beside
#       it names the four checks that still fail there, with the run that
#       measured them. `bootstrap` below has had darwin rows since the 0.4.0
#       seeds, `runtime-net` runs the network runtime on a mac, and `nish-cmp`
#       runs on the Linux rows only (.github/seed-matrix.sh says why).
# seeds + bootstrap: the rolling freeze (WP19 G3), as a pair of jobs rather
#       than one, so that "the freeze held" and "there was nothing here to
#       check it with" are not the same colour. `seeds` asks the last release
#       which seed binaries it attaches; `bootstrap` is one row per seed that
#       exists, so a platform with no seed has no row rather than a green one.
#       The table above the pair says which conclusion means which.
# nish-cmp: WP19 G2.1, the successor to the two largest oracles R6 deletes.
#       `tests/nish-cmp.js` compiles the corpus with the last released compiler
#       and with the one HEAD builds and requires every byte of every file to
#       match -- Go's `toolstash -cmp`. It shares the `seeds` job with
#       `bootstrap` and is a matrix for the same reason, so a row appears when
#       a release carries a seed it can use and there is no row otherwise; the
#       `cmpSince` note in .github/seed-targets.json says which releases those
#       are and why it is not all of them.
# simd-arm64: runtime/runtime-simd.c's, runtime/runtime-bytes.c's and
#       runtime/runtime-aes.c's agreement tests on an AArch64 runner, where
#       their native runs are the NEON and the ARMv8 AES and PMULL paths no x86-64 job can run, and the `aes
#       kernel` section, std/crypto/aes.ts lowered onto those AES kernels.
# runtime-net: runtime/runtime-net.c's Darwin branch (kqueue, SO_NOSIGPIPE,
#       errno translated to Linux's numbers) on a macOS runner: the runtime
#       unit tests, plain and with -DNISH_THREADS, and every `net_` section.
# lint: package-lock.json against package.json with no registry involved,
#       `npm run lint` when package.json defines it (no-op otherwise), then
#       docs/check-links.mjs over every Markdown file.
#
# Also reusable via `workflow_call`: release.yml runs it before packing a tag.
# Runs on `merge_group` too, for the merge queue on main (see `on:` below).
# To run the same steps locally see docs/wp10-ci.md.
name: CI

# `push` is scoped to main on purpose. An unscoped `push:` fires on every
# branch, so one push to a branch with an open pull request ran the whole
# matrix twice: once for `push` and once for `pull_request`. The concurrency
# group below cannot collapse those two, because `github.ref` is
# `refs/heads/<branch>` for the push and `refs/pull/<n>/merge` for the pull
# request, which puts them in different groups where neither cancels the
# other. Tags keep their coverage: release.yml triggers on `v*` and reaches
# this workflow through `workflow_call`.
#
# `merge_group` is the merge queue's run. A pull request's own run tests its
# head merged with `main` as it was when the run started; two pull requests
# green that way can still be red together, because the goldens and the `.ll`
# they share move without a textual conflict (#549 after #547). The queue tests
# each one on top of `main` plus everything queued ahead of it and merges only
# what passed there, so `main` is never the first place the pair meets. The
# queue itself is a ruleset setting on `main`; this trigger is what lets the
# required checks report on its temporary `gh-readonly-queue/main/*` branches.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

# Node's on-disk V8 compile cache, for every job in this file.
#
# This is a measurement rather than a habit, taken while the compiler was
# stage0: one `node dist/index.js <case>` cost about 634 ms, of which 1.5 ms
# was compiling and ~473 ms was `import ts from "typescript"`. The compiler
# under test is a native binary now, but the harness and its tools are still
# Node programs that spawn one another, and the oracles that parse with the
# `typescript` package pay that import. `NODE_COMPILE_CACHE` caches
# V8's compilation of every module it loads, keyed on the file's content and the
# Node version, and Node falls back to compiling normally when the key misses --
# a stale or absent cache costs time and can never change an answer. Measured on
# this repository: 412 ms -> 315 ms for one compiler spawn (-24%), and
# `tests/diagnostic-coverage.js --require-coverage --strict-refusals` 77.0 s ->
# 65.5 s (-15%).
#
# The path is outside the checkout on purpose. A cache directory inside
# `github.workspace` is a tree the repository does not track, and `npm test`,
# `docs/check-links.mjs` and `biome` all walk the tree.
#
# `APT_OPTS` is every `apt-get` call's network bound. apt waits on a stalled
# mirror with no timeout of its own: on #502, three jobs fell back from the
# Azure mirror to archive.ubuntu.com, sat on one `InRelease` fetch, and were
# cancelled by GitHub's six-hour job limit with no test having run. Thirty
# seconds per connection and three retries turn that into a failure inside the
# install step's own five-minute limit, which is the one that names it.
env:
  NODE_COMPILE_CACHE: /tmp/nish-node-compile-cache
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

# A newer push to a pull request makes the older run's answer worthless, so
# that run is cancelled. A push to main is never superseded that way: each one
# is a merge, and its run is the only record of whether main was green after
# it. With `cancel-in-progress: true` for every event, the next merge landing
# within the half hour a run takes cancelled the one before it, and #396's and
# #397's runs on main ended cancelled -- neither green nor red, and nothing
# said which merge broke main if one had. So only a pull request's runs cancel;
# main's queue up in the same group and each finishes. A merge-queue run has a
# ref of its own per queued entry, so it shares a group with nothing and the
# queue, not this setting, decides when it is superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    # 25 minutes, up from 15: shard 1 took 14m49s on main at 6e11fa6b once
    # #663 added about 3 s of clang -O2 to each program that imports p256, so
    # a 15-minute limit cancelled it. The shards are now dealt by cost
    # (tests/shard-costs.json), so each takes about ten; the limit stays as
    # headroom while the table drifts.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macos-latest stays out of THIS job, and what keeps it out is a list
        # of named checks with a date on it rather than a guess or a cost. The
        # row was run for the first time on 2026-09-13 (WP19 R2) and `npm test`
        # failed there with five failures in four families; it was re-run on
        # 2026-09-21 with the row in the matrix and reported
        # `2125 passed, 6 failed, 4 skipped` -- run 606, job
        # https://github.com/amritk/nish/actions/runs/35652075129. Not one of
        # the nine failures across those two runs is a compiler bug. Every one
        # is a check that read an ELF fact out of a *linked binary* instead of
        # the property it exists for, which is why they are listed by cause:
        # the cause is the shape of mistake a new check can still make.
        #
        # PORTED, and measured green on a mac in that run:
        #
        #   * `llvm-dwarfdump --debug-line` of the linked binary reported an
        #     empty table. On Mach-O `clang -g` leaves the DWARF in the object
        #     files and the executable keeps only a debug map naming them; the
        #     Darwin driver runs `dsymutil` at the end of a compile-and-link to
        #     turn that map into a `.dSYM` bundle, which is where the table is.
        #     `lineTableOf` in tests/run.js answers with the file the platform
        #     used and the two `-g` checks assert the same sentence about it on
        #     both: it names dbg_main.ts and it has at least one row.
        #   * "--threads IR refuses to link against a runtime built without
        #     -DNISH_THREADS". ELF refuses a TLS reference to a non-TLS
        #     definition; ld64 links it and clang exits 0. What the check can
        #     hold both platforms to is not the link error but that the
        #     mismatch is never quietly a working-looking program: on Darwin
        #     `_nish_arena` resolves to a plain `(__DATA,__common)` symbol and
        #     the binary segfaults on its first allocation, where the matched
        #     build of the same inputs prints `alloc_smoke delta = 16`. The
        #     check names which mechanism caught it.
        #   * Both `runtime objects: linking <case> ... gives the bytes the
        #     sources do` checks (#358). ld64 varies LC_UUID with the output
        #     path (docs/wp10-ci.md#what-ld64-varies-measured), so both links
        #     write one path and move each binary aside, as
        #     scripts/bootstrap.sh does.
        #     The default runtime's is measured green on a mac by the
        #     `runtime-net` job; the `--threads` one is the same loop.
        #
        # STILL RED, four checks in three causes, and none of them is this line:
        #
        #   1. `runtime objects: a --threads module refuses to link against the
        #      default runtime` -- the same ld64 finding as the ported one
        #      above, in the gate on the prebuilt object cache. It wants the
        #      same treatment and is a check somebody else owns this wave.
        #   2. `the self-hosted compiler: -g reaches the compiler and the
        #      linked program carries DWARF` -- the same Mach-O debug map, read
        #      through `.debug_info` rather than `.debug_line`. It wants
        #      `lineTableOf`.
        #   3. `stage3 == stage2` in tests/self/bootstrap.js. It compares two
        #      links of one input made to two *different output paths*, and
        #      LC_UUID is what ld64 varies with the path -- measured on both
        #      darwin rows, docs/wp10-ci.md#what-ld64-varies-measured. That is
        #      why it fails at identical size. scripts/bootstrap.sh already
        #      links its comparable stages at one path; this check does not.
        #   4. `verify-binaries: NISH_UNAME_S says on stderr that it overrode
        #      the platform` -- a check that drives the script's Darwin branch
        #      from Linux and reads the sentence saying so. On a mac there is
        #      no override to report, so the check is about the simulation
        #      rather than about the platform.
        #
        # WHAT IS NOT WAITING ON THIS LINE, because this comment claimed the
        # opposite until 2026-09-21: macOS is not absent from the file. The
        # `bootstrap` and `nish-cmp` jobs below take their rows from the seed
        # assets of the last release, `attachedSince` for the darwin pair is
        # 0.4.0, and v0.4.0 and v0.5.0 both carry them -- so `bootstrap
        # (aarch64-darwin)` and `bootstrap (x86_64-darwin)` have been running,
        # and passing, since 0.4.0. They are the reason the LC_UUID cause above
        # is known rather than suspected, and the three `runtime-net` shards
        # run the runtime unit tests and the `net_` sections on a mac. This
        # row is the whole suite on macOS, not the whole of macOS.
        #
        # The install half is written and has now been exercised twice: the two
        # "Install LLVM 18 + lld" steps below are guarded by `runner.os`, so
        # restoring the row is this line plus the four checks above.
        #
        # `fail-fast: false` above is what would keep a macOS-only failure from
        # cancelling the Linux row that says whether it is the platform or the
        # change.
        os: [ubuntu-latest] # , macos-latest -- see the four checks above
        # `npm test` is split four ways by `--shard` (tests/run.js, "Shards"):
        # shard 1 runs every section after the tests/link programs but WP14
        # self-hosting and crypto-bench, and the programs and those two
        # sections are dealt by their cost in tests/shard-costs.json so that
        # the four finish together.
        # One unsharded run took 25 minutes. The `/4` in the Test step is this
        # list's length, and a check in tests/run.js holds the two together.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The crypto bench's Go twins (bench/crypto/*/go) build with
      # GOTOOLCHAIN=local, so the Go on PATH must be at least the `go` line of
      # every twin's go.mod, and the strict run fails a twin that cannot build.
      # The runner image ships Go 1.24; the aead twin asks for 1.25 since #803
      # moved golang.org/x/crypto to v0.52.0, and the handshake twin for 1.26
      # since #818 moved golang.org/x/net to v0.60.0. The action exports
      # GOTOOLCHAIN=local, which is what the bench sets anyway.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      # The runner image ships clang-18, lld-18 and llvm-18, so what this job
      # downloads is the rest: valgrind with its libc6-dbg, wasi-libc and the
      # wasm32 builtins, about 23 MB. The Azure mirror sometimes serves that at
      # a trickle -- never idle long enough for `APT_OPTS`'s thirty seconds to
      # fire, so the step's five-minute limit did, and in October 2026 that was
      # every red run on main (one `test` shard of four, a different one each
      # time). The .debs are kept in the Actions cache, keyed by runner image,
      # so a shard normally downloads nothing. On a miss (a new image), the
      # download is cut at a minute per attempt and retried without the Azure
      # mirror: the stall is that mirror's (libc6-dbg, on #821's first
      # run, on all three attempts), so a retry against it stalls again.
      - name: Apt cache key (Ubuntu)
        id: apt-key
        if: runner.os == 'Linux'
        run: |
          echo "prefix=apt-test-$ImageOS-" >> "$GITHUB_OUTPUT"
          echo "key=apt-test-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages (Ubuntu)
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: ${{ steps.apt-key.outputs.prefix }}

      - name: Install LLVM 18 + lld (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives/partial"
          # `_apt` cannot reach a directory under the runner's home, so apt would
          # download as root anyway, with a warning; say so up front.
          apt_cache="-o Dir::Cache::Archives=$archives -o APT::Sandbox::User=root"
          sudo apt-get $APT_OPTS update
          # wasi-libc and compiler-rt's wasm32 builtins are the WASI sysroot the
          # `wasi` profile links against (scripts/build.sh). Without them the
          # suite's wasi checks -- argv_echo under Node's WASI, the compiler as
          # one wasi module (web/), range_export's `--profile wasi` -- are
          # counted skips, "no WASI sysroot", and nothing here would notice a
          # runtime that stops building against wasi-libc, as runtime-os.c did
          # when it called a `realpath` wasi-libc does not have (#396).
          pkgs="clang-18 lld-18 llvm-18 valgrind wasi-libc libclang-rt-18-dev-wasm32"
          for attempt in 1 2 3; do
            if sudo timeout -k 5 60 apt-get $APT_OPTS $apt_cache install -y --no-install-recommends \
              --download-only $pkgs; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt could not download the packages in three one-minute attempts"
              exit 1
            fi
            echo "::warning::apt download attempt $attempt stalled or failed; retrying without the Azure mirror"
            # The image's sources name `mirror+file:/etc/apt/apt-mirrors.txt`,
            # Azure first, then archive.ubuntu.com and security.ubuntu.com. apt
            # reads the list on each run, so no second `update` is needed.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
              cat /etc/apt/apt-mirrors.txt
            fi
          done
          sudo apt-get $APT_OPTS $apt_cache install -y --no-install-recommends $pkgs
          # Drop .debs the mirror no longer offers (left over from an older
          # image's cache) and hand the directory back to the runner user, so
          # the save step below can read apt's root-owned files.
          sudo apt-get $apt_cache autoclean
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          # Debian ships versioned binaries (clang-18, llc-18, ...). Expose the
          # plain names through a private bin dir placed ahead of /usr/bin so the
          # scripts and tests/run.js find `clang`, `llc`, `llvm-as`, `llvm-nm`, `opt`,
          # `ld.lld` and `wasm-ld` regardless of what the runner image ships.
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as llvm-link llvm-nm llvm-tli-checker opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      # Saved here rather than by actions/cache's post step, which saves only
      # when the whole job passes: a red test would otherwise leave every later
      # run downloading again. The four shards race to save one key; the losers
      # log a warning and carry on.
      - name: Save apt packages (Ubuntu)
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-key.outputs.key }}

      - name: Install LLVM 18 + lld (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          # Homebrew's llvm@18 bundles lld (ld.lld, wasm-ld). If a build ever
          # drops it, fall back to the standalone formula.
          if [ ! -x "$prefix/bin/wasm-ld" ]; then brew install lld; fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          for tool in clang llc llvm-as llvm-nm llvm-tli-checker opt ld.lld wasm-ld; do
            printf '%-8s ' "$tool"; command -v "$tool"
          done
          clang --version | head -n 1
          llc --version | sed -n '2p'
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      # The seed: the last release's compiler for this runner's platform,
      # unpacked into build/seed by `scripts/fetch-seed.sh` (install.sh's
      # download, asset name and version check). Every compile `npm test`
      # makes is stage1's, and stage1 is `src/` built by this binary -- the
      # rolling freeze (WP19 G3) asked on the platform the suite runs on.
      - name: Fetch the seed
        run: |
          bash scripts/fetch-seed.sh
          build/seed/bin/nish --version

      # `--seed` rather than NISH_BOOTSTRAP: the variable also turns on
      # `tests/nish-cmp.js`, which the `nish-cmp` job below already runs, one
      # row per seed, and whose `cmpSince` rule that job's matrix states.
      #
      # `--delegate-fixed-point` for the same kind of reason: the
      # `bootstrap (x86_64-linux)` row below asserts IR(stage1) == IR(stage2)
      # and stage3 == stage2 with this seed on this runner, so the suite counts
      # its own copy of that check as delegated to the row instead of spending
      # about eighty seconds of this job, the longest in the file, on it again.
      # The WP14 section of tests/run.js says when it honours the flag, and a
      # check there fails if this step asks for it while `bootstrap` has
      # stopped running `scripts/bootstrap.sh --verify`.
      #
      # `WASI_SYSROOT=/usr` because Debian's wasi-libc installs under
      # /usr/lib/wasm32-wasi and /usr/include/wasm32-wasi rather than in a
      # sysroot directory of its own, so none of the default locations
      # scripts/build.sh and tests/run.js look in exists.
      - name: Test
        env:
          WASI_SYSROOT: /usr
          SHARD: ${{ matrix.shard }}
        # The log is kept for the steps below that require a line of it.
        run: |
          set -o pipefail
          npm test -- --seed build/seed/bin/nish --delegate-fixed-point --shard "$SHARD/4" | tee "$RUNNER_TEMP/test.log"

      # The steps from here on run in shard 1 only: each answers once for the
      # commit, and every shard built the same compiler. Those that require a
      # line of the suite read it from the Test step's log rather than run its
      # section again, which built stage1 anew each time: three minutes of
      # shard 1, the longest of the four.

      # WP38 S1 and S6a: the `simd` section (shard 1) passes when a kernel's paths
      # agree, which they also do when the AVX2 path did not run at all. These
      # runners have AVX2, so here the drivers the suite built must name it, as
      # the `simd-arm64` job's line must name the NEON path.
      - name: The AVX2 path ran
        if: matrix.shard == 1
        run: |
          set -o pipefail
          build/test/simd/index-of-any | grep -E '^index-of-any: [0-9]+ cases agree across scalar base avx2;'
          build/test/simd/byte-runs | grep -E '^byte-runs: [0-9]+ cases agree across scalar base avx2;'

      # WP38 S5: likewise for runtime/runtime-aes.c, whose `simd` section passes
      # with the reference alone on a CPU without AES-NI. These runners have it
      # (the section also requires the path wherever /proc/cpuinfo names it).
      - name: The AES-NI path ran
        if: matrix.shard == 1
        run: |
          set -o pipefail
          build/test/simd/aes-gcm | grep -E '^aes-gcm: [0-9]+ cases agree across aesni-pclmul;'

      # WP38 S5's lowering: the `aes kernel` section (shard 1) checks a natively
      # built AES program against its bitsliced walker, and requires the kernels
      # to run wherever /proc/cpuinfo names the instructions. A runner that masked
      # them would take the section's other arm and stay green, so the line that
      # says the kernels ran is required here, where they are known to exist.
      - name: The lowered AES program ran the kernels
        if: matrix.shard == 1
        run: |
          grep -E '^PASS  aes kernel: crypto_aes_agree with NISH_AES unset calls all four kernels' "$RUNNER_TEMP/test.log"

      # #619: `par_map_vector` links its modules with `llvm-link` and runs `opt
      # -O3`, and skips without either tool. The line that says the map's loop
      # vectorised is required here, where both are installed.
      - name: parallelMapInto's element loop vectorises
        if: matrix.shard == 1
        run: |
          grep -E "^PASS  par_map_vector: opt -O3 vectorises parallelMapInto's element loop" "$RUNNER_TEMP/test.log"

      # WP38 S2: the `cpu level` section runs a `--cpu x86-64-v3` binary only
      # where /proc/cpuinfo names avx2, and skips elsewhere. A runner that masked
      # it would take the skip and stay green, so the line that says the binary
      # ran and printed what the baseline prints is required here.
      - name: A --cpu x86-64-v3 binary runs and prints what the baseline prints
        if: matrix.shard == 1
        run: |
          grep -E '^PASS  cpu level: a --cpu x86-64-v3 link of hello prints what the baseline link prints' "$RUNNER_TEMP/test.log"

      #
      # `build/nish` is what the steps after the suite drive: stage1, one
      # directory below the repository root, which is where its package root is
      # found from (`packageRoot` in src/compile.ts).
      #
      # It is the binary the suite just tested, copied rather than built again.
      # `npm test` links stage1 with this seed into build/nish-test before its
      # first check, and a separate `build/seed/bin/nish src/compile.ts --link
      # build/nish` step used to repeat that link, about 30 s on this runner.
      # The two writes are byte-identical binaries: the only difference is that
      # the suite names `src/compile.ts` by its absolute path, which moves the
      # `source_filename` line of each module's IR and not one byte of the
      # linked binary. The suite still builds its own compiler on every run, so nothing
      # here can hand it a stale one, and when the suite fails this step and
      # every step after it are skipped.
      - name: Keep the compiler the suite tested
        if: matrix.shard == 1
        run: cp build/nish-test build/nish

      # `NISH` names the compiler scripts/smoke.sh and docs/cookbook/regen.sh
      # run, the compiler this job built.
      - name: Smoke (build + run every example with a main, size profile)
        if: matrix.shard == 1
        env:
          NISH: build/nish
        run: bash scripts/smoke.sh

      # docs/IR_COOKBOOK.md promises the exact IR each construct compiles to
      # *today*, and agents are pointed at it as a reference. It drifted once
      # (the `internal` linkage of --strict-exports and the `nsw` defaults were
      # missing), so the staleness check is a gate rather than a chore.
      - name: Docs (IR cookbook up to date)
        if: matrix.shard == 1
        env:
          NISH: build/nish
        run: bash docs/cookbook/regen.sh --check

      # The diagnostic-code registry, src/codes.ts, is kept by hand: a new
      # code takes the next free number in its band, and this checks its
      # format and that every code is unique.
      # `npm test` checks it too -- this names it in its own step so a stale
      # registry reads as itself rather than as one failure among a thousand.
      - name: Diagnostic codes (registry up to date)
        if: matrix.shard == 1
        run: node scripts/gen-diagnostic-codes.mjs --check

      # The other half of WP19 G2.4 -- every code provoked by a program, not
      # only every diagnostic given a code -- is not a step here: it is inside
      # `npm test`, which runs `tests/diagnostic-coverage.js` with
      # `--require-coverage` and `--strict-refusals`.

      - name: Size report
        if: matrix.shard == 1
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          build/nish examples/add.ts -o build/add.ll
          bash scripts/size-report.sh --markdown build/add.ll examples/main.c | tee build/size-report.md
          {
            echo "### Binary size ($MATRIX_OS, LLVM 18)"
            echo
            echo '`examples/add.ts` + `examples/main.c` + `runtime/runtime.c` + `runtime/runtime-os.c`'
            echo
            cat build/size-report.md
          } >> "$GITHUB_STEP_SUMMARY"

  # WP19 G3: build src/ with the LAST RELEASED nish rather than with stage0.
  #
  # Two jobs, because there are three answers and only two colours.
  #
  # `seeds` asks the last release which seed binaries it attaches; `bootstrap`
  # is a matrix over that answer, one row per seed that actually exists. A
  # platform with no seed therefore has no row rather than a green one, and
  # nothing in the checks list claims a freeze that nothing checked. CLAUDE.md
  # reads green as permission to merge, and this gate has now lied to that
  # reader twice: first by passing with a warning when it had verified nothing,
  # then by failing for a state in which nothing is wrong.
  #
  # WHICH CONCLUSION MEANS WHAT. Read the pair, not either half:
  #
  #   seeds green + a bootstrap row green   the freeze was checked with that
  #                                         seed, on that seed's own platform,
  #                                         and it held.
  #   seeds green + no row for a platform   the freeze was NOT checked there,
  #                                         and nothing is wrong: no release
  #                                         carries a seed for it yet. The
  #                                         `seeds` job summary lists every
  #                                         platform in both states by name.
  #   seeds green + bootstrap SKIPPED       the same, for every platform at
  #                                         once: there is no release at all.
  #   seeds RED                             a seed that should exist does not.
  #                                         The release is missing an asset
  #                                         release.yml attaches, and the
  #                                         annotation says how to get unstuck.
  #   a bootstrap row RED                   src/ does not build with the last
  #                                         release, which is the rolling
  #                                         freeze broken -- the failure this
  #                                         pair exists to catch.
  #
  # A job skipped by an `if:` reports SUCCESS to branch protection -- that is
  # GitHub's own rule for a conditional skip, as against a workflow skipped by
  # a path filter, which stays pending and blocks. So the grey is for the
  # reader and not for the merge button, which is the right way round:
  # CLAUDE.md's merge rule is addressed to a reader, and a required check that
  # stayed pending on every fork and before the first release is the deadlock
  # below.
  #
  # WHY "no release at all" MAY NOT BE RED. `release.yml`'s `release` job is
  # `needs: ci`, so a red CI is a release that cannot be cut. A repository with
  # no release has no seed, and if that were red the first release could never
  # be made: the gate would be waiting for an artifact only a release produces,
  # and the release would be waiting for the gate. That is the 0.1.0 base case
  # docs/wp12-release.md describes, and it is every fork of this repository on
  # the day it is forked. It is also, exactly, the argument this file makes for
  # keeping the macOS `test` row out, applied to a job that sits on the release
  # path.
  #
  # WHY a missing x86_64-linux seed IS red. There the release exists and is
  # supposed to carry it: .github/seed-targets.json gives that target an
  # `attachedSince` the release has reached (.github/seed-due.sh decides),
  # which is release.yml's own statement that it builds one. Its
  # absence is a regression in that workflow or in the asset name the two
  # workflows share, not a state of the world -- and it costs the rolling
  # freeze its only check.
  #
  # This pair is what enforces the rolling freeze. Nish has no conditional
  # compilation and will not grow any -- there is no #[cfg(bootstrap)] to
  # write -- so "a construct added in 0.N cannot be used by src/ until
  # 0.(N+1)" (docs/wp12-release.md, "The bootstrap seed") is a discipline, and
  # a discipline CI does not check is a comment. Using a construct too early
  # breaks here and in `test`, which builds its compiler with the same seed;
  # these rows are the ones that do it on every platform the seed ships for.
  #
  # G3 asks for this on **both** operating systems and it gets both. That is
  # newer than it reads and it took two things, and neither was a line in this
  # file -- which is the point of the matrix being the release's answer:
  #
  #   * the darwin **seed**, which is WP19 G5. release.yml builds one per
  #     target from .github/seed-targets.json, the darwin pair's
  #     `attachedSince` is 0.4.0, and v0.4.0 was the first release to carry
  #     them. Before that macOS was the second state in the table above -- no
  #     row, and the `seeds` summary saying which version it was waiting for.
  #   * the **ld64 fixed point**, which was the `stage3 == stage2` family in
  #     the `test` matrix comment above, and which is settled for the two
  #     comparable stages this job builds: LC_UUID is what ld64 varies, it
  #     varies with the output path, and scripts/bootstrap.sh links both at one
  #     path and moves each into place afterwards
  #     (docs/wp10-ci.md#what-ld64-varies-measured). The Darwin narrowing in
  #     scripts/verify-binaries.sh stays as a net under a comparison that holds
  #     rather than as the arm that decides a row.
  #
  # So `bootstrap (aarch64-darwin)` and `bootstrap (x86_64-darwin)` are rows
  # this workflow runs, as is `runtime-net` further down. The
  # macOS gaps left in the file are the `test` row above (the whole suite;
  # the network runtime is the part `runtime-net` covers) and `nish-cmp`,
  # which runs on the Linux rows only. The `stage3 == stage2` comparison that tests/self/bootstrap.js
  # makes is *not* the one settled here -- it links its two stages at two
  # paths and is one of the four checks named up there.
  seeds:
    name: which seeds the last release attaches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      rows: ${{ steps.linux.outputs.rows }}
      cmp: ${{ steps.pick.outputs.cmp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The lookup is a job of its own, before any toolchain and before
      # `npm ci`, for two reasons. It is the gate, so it should answer in
      # seconds rather than after two minutes of setup it may be about to throw
      # away; and its answer has to be a *job* conclusion and a matrix, because
      # a step that skips inside a green job leaves the job green.
      #
      # The script is in a file rather than here so that `npm test` can run it:
      # tests/run.js drives it against a stand-in for `gh` through each of its
      # states, which is the check that was missing both times this logic was
      # got wrong.
      - name: Ask the last release what it carries
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/seed-matrix.sh

      # macOS is disabled in CI for now: the darwin rows kept failing. The
      # release still builds the darwin seeds; only their `bootstrap` rows are
      # dropped here, so seed-matrix.sh and its tests are untouched.
      - name: Leave the macOS rows out
        id: linux
        env:
          ROWS: ${{ steps.pick.outputs.rows }}
        run: echo "rows=$(jq -c '[.[] | select(.runner | startswith("macos") | not)]' <<< "$ROWS")" >> "$GITHUB_OUTPUT"

  bootstrap:
    name: bootstrap (${{ matrix.seed.asset }})
    needs: seeds
    # Before the first release nothing is seeded anywhere, which is an empty
    # matrix -- and an empty matrix is a strategy GitHub refuses to evaluate
    # rather than a job with no rows. `seeds` is what says so in that state,
    # and this job is grey rather than green.
    if: needs.seeds.outputs.rows != '[]'
    runs-on: ${{ matrix.seed.runner }}
    timeout-minutes: 15
    strategy:
      # One platform's linker is not another's, so a failure on one row must
      # not cancel the row that would say whether it is the platform or the
      # change.
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.rows) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The toolchain is installed on rows that have a seed to build with,
      # which is all of them: a platform with no seed has no row and rents no
      # runner. A `brew install llvm@18` on a row whose every later step is
      # skipped is 42 seconds of the slowest runner GitHub rents, on every
      # push, to emit one warning.
      - name: Install LLVM 18 + lld (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as llvm-nm llvm-tli-checker opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install LLVM 18 + lld (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          if [ ! -x "$prefix/bin/wasm-ld" ]; then brew install lld; fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The tarball is .github/seed-targets.json's, resolved against the
      # release by `seeds`. This row exists *because* that asset is on the
      # release, so a download that fails here is a network or permissions
      # fault rather than the absence the gate is about -- or a tarball whose
      # SHA-256 is neither pinned in install.sh nor in the release's
      # SHA256SUMS, which is refused before it is unpacked or run.
      # scripts/fetch-seed.sh is that one verified path; it used to be a bare
      # `gh release download` and `tar`, and then the seed ran.
      #
      # The matrix reaches bash through `env:` rather than through ${{ }}
      # spliced into the script. A maintainer-created tag is not a plausible
      # attacker, but the value came out of a release and the rule costs
      # nothing -- it is the one pr-title.yml already states.
      #
      # `--expect-tarball` is this row's architecture guard. install.sh picks
      # the asset from the runner's own `uname`, and a runner label can move to
      # other hardware (macos-13 and macos-latest both have), so without it a
      # drifted row would bootstrap with another platform's seed and go green
      # under this row's name. install.sh refuses, before downloading, unless
      # the tarball it resolves is the row's -- release.yml's `binaries` job
      # holds its rows to `host` the same way.
      - name: Download the seed
        id: download
        env:
          TAG: ${{ matrix.seed.tag }}
          TARBALL: ${{ matrix.seed.tarball }}
        run: |
          bash scripts/fetch-seed.sh "${TAG#v}" --expect-tarball "$TARBALL"
          echo "path=$PWD/build/seed/bin/nish" >> "$GITHUB_OUTPUT"

      - name: Build src/ with the seed
        env:
          SEED: ${{ steps.download.outputs.path }}
        run: |
          "$SEED" --version
          NISH_BOOTSTRAP="$SEED" bash scripts/bootstrap.sh --verify

      # The command line's contract, asked of the compiler that outlives stage0.
      # `tests/nish/cli.ts` is a Nish program reading the compiler's own output —
      # the streams, the exit-code bands, one flat `--json` object per diagnostic —
      # and here it is pointed at the stage2 this row's seed built, where `npm test`
      # points it at a stage1. Its counted skips are the summary below.
      - name: The CLI contract, against the self-hosted compiler
        run: |
          set -o pipefail
          build/nish tests/nish/cli.ts -o build/nish-cli.ir/ --link build/nish-cli
          build/nish-cli build/nish | tee "$RUNNER_TEMP/nish-cli.log"
          echo "::notice::tests/nish/cli.ts against build/nish: $(tail -n 1 "$RUNNER_TEMP/nish-cli.log")"

      # Reached only when every step above succeeded, which is the point: this
      # line is a claim about a run that happened, and there is no branch of it
      # that describes one that did not. The states in which it did not happen
      # do not reach this job at all -- they are the `seeds` job's summary and
      # a row that is not here.
      - name: Say what this proved
        env:
          TAG: ${{ matrix.seed.tag }}
          ASSET: ${{ matrix.seed.asset }}
          TRIPLE: ${{ matrix.seed.triple }}
        run: |
          echo "::notice::src/ built and verified with $TAG's $ASSET seed ($TRIPLE). That is the rolling freeze checked on this platform, and it says nothing about any other."
          { echo "### The rolling freeze (WP19 G3)"; echo; echo "src/ built and verified with $TAG's \`$ASSET\` seed ($TRIPLE). That is this platform; the \`seeds\` job lists the platforms nothing checked."; } >> "$GITHUB_STEP_SUMMARY"


  # WP19 G2.1 -- one corpus, two compilers, byte for byte.
  #
  # This is the check that replaced `tests/self/ir_oracle.js` and
  # `tests/self/interop_oracle.js`, the two largest of the six oracles R6
  # deleted with stage0's `src/`. What they proved -- the IR of every module of every
  # corpus program, and the four WP8 sidecars derived from the same checked
  # program -- they proved by comparing two implementations. There is only one
  # now, so the comparison changed axis: not stage0 against stage1, but the
  # last RELEASED compiler against the one HEAD builds. A wrong lowering then shows up as a release that changed output
  # nobody declared, which is the strongest thing a single-implementation
  # compiler can say about itself (docs/wp19-stage0-retirement.md §2B, §6).
  #
  # It is a job rather than a step in `test` because it needs a seed, which
  # `test` has no reason to download, and because it costs the corpus twice --
  # about three minutes -- which should be a runner rather than wall-clock time
  # on the critical path.
  #
  # An undeclared difference fails the job. The tool's `DECLARED` list is how a
  # difference that is INTENDED goes green, and it deliberately costs
  # something: an entry names the program, the file and the words `CHANGELOG.md`
  # has to carry, and an entry whose words have gone fails the run too, so the
  # release note and the tool cannot drift apart.
  nish-cmp:
    name: nish-cmp (${{ matrix.seed.asset }})
    needs: seeds
    # Empty for the two reasons the `cmpSince` note in seed-targets.json
    # separates: no release has happened, or every release so far carries a
    # seed that cannot compile the corpus. Either way this is grey rather than
    # green, because a green check here would claim a comparison that nothing
    # made -- and an empty matrix is an error GitHub refuses to evaluate rather
    # than a job with no rows, which is why the `if` is on the job.
    if: needs.seeds.outputs.cmp != '[]'
    runs-on: ${{ matrix.seed.runner }}
    timeout-minutes: 15
    strategy:
      # x86_64 and aarch64 have different registers and different calling
      # conventions, so one row failing must not cancel the row that would say
      # whether it is the architecture or the change.
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.cmp) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The candidate is built by the reference through `--link`
      # (`buildCandidate` in tests/nish-cmp.js, the arrangement G3 puts in
      # scripts/bootstrap.sh), so this job wants the toolchain for the same
      # reason `bootstrap` does rather than only to read IR.
      - name: Install LLVM 18 + lld
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as llvm-nm llvm-tli-checker opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The same verified download `bootstrap` makes, and the same rule about
      # the matrix reaching bash through `env:` rather than spliced into the
      # script, and the same refusal of a seed that is not this row's.
      - name: Download the seed
        id: download
        env:
          TAG: ${{ matrix.seed.tag }}
          TARBALL: ${{ matrix.seed.tarball }}
        run: |
          bash scripts/fetch-seed.sh "${TAG#v}" --expect-tarball "$TARBALL"
          echo "path=$PWD/build/seed/bin/nish" >> "$GITHUB_OUTPUT"

      # `NISH_BOOTSTRAP` rather than `--reference`, so the spelling is the one
      # scripts/bootstrap.sh and the harness already read and there is one name
      # for the seed across all three.
      - name: The released compiler and HEAD write the same bytes
        env:
          SEED: ${{ steps.download.outputs.path }}
        run: |
          set -o pipefail
          "$SEED" --version
          NISH_BOOTSTRAP="$SEED" node tests/nish-cmp.js | tee "$RUNNER_TEMP/nish-cmp.log"

      # The same equality on programs nobody wrote, which every seeded
      # `npm test` runs and the `test` job, with no seed, cannot (#438). Fixed
      # seed, so a red here is the change's and reproduces locally; 200
      # programs, a superset of the harness's 16, in about 3 s, because the
      # candidate is the `build/self/compile` the step above just linked from
      # this tree rather than a second 15 s link.
      - name: The released compiler and HEAD emit the same IR for random programs
        env:
          SEED: ${{ steps.download.outputs.path }}
        run: |
          NISH_BOOTSTRAP="$SEED" node tests/differential/fuzz.js --stage1 --seed 20261001 --count 200 \
            --candidate build/self/compile

      # The soundness differential: the same candidate compiles every runnable
      # case, the fuzz corpus and 200 fixed-seed programs a second time with
      # `--no-elision`, every proof-backed elision off, and both builds must
      # print and exit the same at -O2. A difference is a proof that does not
      # hold, and the run prints the path of its reproducer. About 40 s on 4
      # threads (941 programs, both sides built); the generated programs run
      # first, so a budget that runs out on a slow runner drops corpus cases,
      # which the suite links anyway. It runs on every row on purpose: the rows
      # are one per architecture, and an elision can be sound on one target's
      # code and not on the other's.
      - name: Every proof-backed elision changes nothing a program prints
        run: |
          node tests/differential/soundness.js --compiler build/self/compile --corpus tests/cases \
            --corpus tests/differential/corpus --seed 20261001 --count 200 --budget 300

      # Reached only when the comparison agreed, which is the point: this line
      # is a claim about a run that happened. The summary line carries its own
      # counts -- programs compared, files, IR lines, and what was refused by
      # both or written by neither -- so the notice is the tool's number rather
      # than a restatement of it.
      - name: Say what this proved
        env:
          TAG: ${{ matrix.seed.tag }}
          ASSET: ${{ matrix.seed.asset }}
        run: |
          summary="$(tail -n 1 "$RUNNER_TEMP/nish-cmp.log")"
          echo "::notice::$TAG's $ASSET compiler and HEAD agree byte for byte. $summary"
          { echo "### nish-cmp (WP19 G2.1)"; echo; echo "\`$TAG\`'s \`$ASSET\` compiler and HEAD write the same bytes over the corpus."; echo; echo "\`\`\`"; echo "$summary"; echo "\`\`\`"; } >> "$GITHUB_STEP_SUMMARY"


  # The golden cases again, through the harness written in the language rather
  # than through the one written in Node (`tests/nish/run.ts`, `npm run
  # test:nish`). `npm test` builds that runner and runs it over five cases, which
  # proves it compiles and works; only the full pass proves it still *agrees*,
  # and a harness nobody runs is a harness that rots.
  #
  # It is not a duplicate of the `test` job, and what it adds is worth stating: a
  # compiler regression fails in both, but a regression in the runner itself --
  # or in `readdirSync`, `spawnSyncTo` or `monotonicNanos`, which nothing else
  # exercises together on a real workload -- fails only here. It runs in parallel
  # with `test`, so it costs a runner rather than wall-clock time, and it spawns a
  # compiler per case, which is why `npm test` does not pay for it.
  runner:
    name: the golden cases, in Nish (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The runner walks the corpus one program at a time, twenty minutes in one
    # job; `--shard` deals the programs four ways. The `/4` below is this
    # list's length, and tests/run.js checks that the two agree.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as llvm-nm llvm-tli-checker opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The same seed, and the same compiler `npm test` builds in the `test`
      # job; see there. This job has no suite to borrow it from, so it links
      # its own.
      - name: Fetch the seed
        run: bash scripts/fetch-seed.sh

      - name: Build the compiler with the seed
        run: build/seed/bin/nish src/compile.ts --link build/nish

      # The runner answers 1 when any check failed, so the step's own exit status
      # is the gate. Its last line is the summary, which is what a reader wants
      # in the job log without expanding it.
      # `set -o pipefail` is load-bearing: the default shell for a `run:` step is
      # `bash -e`, without it, so the exit status of a pipeline would be `tee`'s
      # and a runner that answered 1 would still be a green step.
      # The runner is built by the compiler under test and handed it with
      # `--compiler`; with no filter it walks its shard of the whole corpus.
      - name: The corpus, through the Nish runner
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          build/nish tests/nish/run.ts -o build/nish-runner.ir/ --link build/nish-runner
          build/nish-runner --compiler build/nish --shard "$SHARD/4" | tee "$RUNNER_TEMP/nish-runner.log"

      - name: Say what this proved
        if: always()
        run: |
          summary="$(tail -n 1 "$RUNNER_TEMP/nish-runner.log" 2>/dev/null || echo 'the runner produced no summary')"
          echo "::notice::tests/nish/run.ts over tests/cases: $summary"

  # WP38 S1 and S6a: runtime/runtime-simd.c's and runtime/runtime-bytes.c's NEON
  # paths, run on the hardware they are for,
  # and WP38 S5's runtime/runtime-aes.c on the ARMv8 AES and PMULL instructions.
  #
  # The kernel has a base path per architecture, and every other job here is
  # x86-64, where the `simd` section of tests/run.js runs the scalar, SSE2 and
  # AVX2 paths and can only run the NEON one through qemu, which those runners
  # do not have -- so there it is a counted skip, and a NEON path that answered
  # wrong would ship with every check green. This row is the one place it runs:
  # on an AArch64 host the section's native run IS the NEON path, and the
  # agreement driver prints the paths it ran. A skip cannot pass here, because
  # the gate is that line naming `base` on arm64, not the section's exit status.
  simd-arm64:
    name: the NEON path agrees (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld
        timeout-minutes: 5
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as llvm-nm llvm-tli-checker opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # tests/run.js links its stage1 with the seed before any section runs,
      # and the section's GC check compiles examples/hello.ts with it.
      - name: Fetch the seed
        run: bash scripts/fetch-seed.sh

      # `set -o pipefail` so that a failed check in the section fails the step
      # before the grep is asked anything; the grep is then the guard against a
      # green section that ran no NEON code.
      - name: The simd section, natively on AArch64
        run: |
          set -o pipefail
          node tests/run.js simd | tee "$RUNNER_TEMP/simd.log"
          grep -E '^PASS  simd: native arm64: [0-9]+ cases agree across scalar base;' "$RUNNER_TEMP/simd.log"
          grep -E '^PASS  simd: byte-runs native arm64: [0-9]+ cases agree across scalar base;' "$RUNNER_TEMP/simd.log"
          grep -E '^PASS  simd: aes-gcm native arm64: [0-9]+ cases agree across armv8-aes-pmull;' "$RUNNER_TEMP/simd.log"

      # WP38 S5's lowering on AArch64: the compiler's branch to the ARMv8 AES and
      # PMULL kernels, run end to end against the bitsliced walker, the 8- and
      # 60-byte IV cases (whose GHASH state the walker finishes) among them.
      - name: The lowered AES program, natively on AArch64
        run: |
          set -o pipefail
          node tests/run.js "aes kernel" | tee "$RUNNER_TEMP/aes-kernel.log"
          grep -E '^PASS  aes kernel: crypto_aes_agree with NISH_AES unset calls all four kernels' "$RUNNER_TEMP/aes-kernel.log"

  # runtime/runtime-net.c's Darwin branch, run (#358). The file is one
  # `#ifdef __linux__` away from two event loops -- epoll on Linux, kqueue on
  # Darwin -- and two socket setups (MSG_NOSIGNAL against SO_NOSIGPIPE), with
  # errno translated to Linux's numbers so a Nish program reads one value on
  # both. The `bootstrap` darwin rows compile that branch; this job runs it:
  # the two runtime unit tests (tests/runtime-test.c's
  # socket, UDP and poll tests, plain and with -DNISH_THREADS) and every `net_`
  # section natively on an AArch64 mac, through tests/run.js so the clang line
  # lives in one place. It is not the commented-out `test` row: that row is the
  # whole suite and its four named checks, and this is the network runtime alone.
  #
  # Split three ways by `--shard`, as the `test` job is. The `net_` sections are
  # 188 link programs that run one at a time, and on one runner image a mac
  # took from 11 to over 28 minutes for them unsplit: run 39877823045's first
  # attempt was cancelled by the 30-minute limit this job had, a few programs
  # from the end. A filtered run deals only its own programs (tests/run.js,
  # "Shards"), so each shard gets about a third. Three rather than four, because an account runs
  # at most five macOS jobs at once and the two `bootstrap` darwin rows are the
  # other two. The `/3` in the net_ step is this list's length, and a check in
  # tests/run.js holds the two together.
  runtime-net:
    name: runtime-net (macos-latest, shard ${{ matrix.shard }}/3)
    # Disabled with macOS CI: it kept failing. Delete this line to bring it back.
    if: false
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # The `test` job's macOS install step, word for word.
      - name: Install LLVM 18 + lld (macOS)
        timeout-minutes: 10
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          # Homebrew's llvm@18 bundles lld (ld.lld, wasm-ld). If a build ever
          # drops it, fall back to the standalone formula.
          if [ ! -x "$prefix/bin/wasm-ld" ]; then brew install lld; fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      # tests/run.js links its stage1 with the seed before any section runs.
      - name: Fetch the seed
        timeout-minutes: 5
        run: bash scripts/fetch-seed.sh

      # Linux routes all of 127.0.0.0/8 to lo; Darwin's lo0 carries 127.0.0.1
      # alone, and net_relay's loopback.ts opens sessions from 127.0.0.2 and
      # 127.0.0.3 to test the relay's per-address cap. Without the aliases those
      # binds fail and seven relay checks read a refusal that never happened. The
      # step comes before the unit tests so their failure cannot skip it.
      - name: Alias 127.0.0.2 and 127.0.0.3 on lo0
        run: |
          sudo ifconfig lo0 alias 127.0.0.2 up
          sudo ifconfig lo0 alias 127.0.0.3 up

      # The full RUNTIME_C list with -std=c11 -Wall -Wextra -Werror -O2, run,
      # then the same with -DNISH_THREADS=1 -pthread: the two checks in
      # tests/run.js's `runtime_test` block, which a failure's detail prints
      # the test binary's output for. The grep is the guard against a green
      # step that ran neither. They answer once for the commit, so shard 1
      # alone runs them.
      - name: The runtime unit tests, natively on Darwin
        if: matrix.shard == 1
        run: |
          set -o pipefail
          node tests/run.js runtime_test | tee "$RUNNER_TEMP/runtime-test.log"
          grep -E '^PASS  runtime\.c, runtime-os\.c, .* pass the runtime unit test$' "$RUNNER_TEMP/runtime-test.log"
          grep -E '^PASS  runtime\.c -DNISH_THREADS: ' "$RUNNER_TEMP/runtime-test.log"

      # Every net_ section runs on a mac, so the step needs checks that passed
      # and no SKIP line: a filter that matches nothing, or a section skipped
      # for a missing tool, fails it rather than leaving it green. What a shard
      # leaves to the other two is counted as delegated, never as skipped.
      #
      # `--delegate-ir-checks`: a mac links and runs each program, which is
      # what only a mac can answer, and leaves every check of the compile (the
      # goldens, llvm-as and opt, declares, --emit-panics, the programs that
      # are a rejection alone) to the `test` job, which makes them for every
      # program on Linux with the same compiler. tests/run.js counts them as
      # delegated, and fails if the `test` job stops running every program.
      - name: The net_ sections, natively on Darwin
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          node tests/run.js net_ --shard "$SHARD/3" --delegate-ir-checks | tee "$RUNNER_TEMP/net.log"
          grep -E '^[1-9][0-9]* passed, 0 failed(, [0-9]+ delegated)?\.$' "$RUNNER_TEMP/net.log"
          if grep -E '^SKIP  ' "$RUNNER_TEMP/net.log"; then exit 1; fi

      # Every skip is named with its reason, so a green job that skipped its
      # sockets reads as what it is.
      - name: Summary
        if: always()
        run: |
          for run in runtime_test:runtime-test net_:net; do
            f="$RUNNER_TEMP/${run#*:}.log"
            [ -f "$f" ] || continue
            {
              echo "### \`node tests/run.js ${run%%:*}\`"
              echo
              grep -E '^[0-9]+ passed, ' "$f" || echo "no summary line: the run did not finish"
              echo
              echo "skips: $(grep -c '^SKIP  ' "$f" || true)"
              grep '^SKIP  ' "$f" | sed 's/^SKIP  /- /' || true
              grep '^FAIL  ' "$f" | sed 's/^FAIL  /- FAIL: /' || true
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package-lock.json agrees with package.json, read from the two files
      # alone. `npm ci` above is not this check, and 0.11.0 is why: it asks
      # the registry, and an optional dependency whose pinned version is not
      # published yet is dropped rather than refused. The release commit pins
      # the platform packages at a version release.yml publishes only after
      # the tag is built, so `npm ci` passed on that commit, went red on main
      # once the publish landed, and nothing re-ran to say so until the next
      # pull request merged main. `npm ls --package-lock-only` never asks the
      # registry, so the release commit is red here on its own push and stays
      # red until release.yml's `lockfile` job's pull request merges.
      #
      # Skipped exactly where that disagreement is the release working: on
      # the Release PR, which carries the bump but cannot carry the entries,
      # and on a tag, where release.yml runs this workflow before publishing
      # and a red here would stop the publish that fixes it. In the merge
      # queue `head_ref` is empty, so the Release PR is known there by the
      # subject of the commit the queue built for it.
      - name: Lockfile agrees with package.json
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.head_ref != 'release/next' && !startsWith(github.event.merge_group.head_commit.message, 'chore(release):') }}
        run: npm ls --package-lock-only --all > /dev/null

      - name: Lint (only when package.json defines a lint script)
        run: npm run lint --if-present

      # Unused files, exports and dependencies (knip.json). An export no other
      # module imports is one the compiler must keep external, so it is not
      # free: this is what keeps src/'s internal functions internal.
      - name: Dead code
        run: npm run lint:dead

      # Ubuntu runners ship shellcheck; `pip install shellcheck-py` is the
      # local route. Warnings and up, over every shell script the repo runs.
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh docs/cookbook/regen.sh install.sh .github/*.sh .claude/hooks/*.sh

      # Every relative link and heading anchor in README, CHANGELOG and docs/**.
      # The guidelines are a graph of pointers between files; a broken one sends
      # a reader -- human or agent -- to a page that does not exist.
      - name: Docs (links and anchors resolve)
        run: node docs/check-links.mjs
