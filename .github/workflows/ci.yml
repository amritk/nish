# Nish continuous integration.
#
# test: typecheck + the full golden/native test suite on Linux with LLVM 18
#       (clang, llc, llvm-as, opt, ld.lld, wasm-ld), every case compiled by a
#       stage1 the last released nish builds, then a binary size table in the
#       job summary, and the IR cookbook staleness check. The matrix is
#       written for macOS too and that row is commented out; the comment beside
#       it names the six checks that still fail there, with the run that
#       measured them. It is the one macOS gap in this file -- `bootstrap` and
#       `nish-cmp` below have had darwin rows since the 0.4.0 seeds.
# seeds + bootstrap: the rolling freeze (WP19 G3), as a pair of jobs rather
#       than one, so that "the freeze held" and "there was nothing here to
#       check it with" are not the same colour. `seeds` asks the last release
#       which seed binaries it attaches; `bootstrap` is one row per seed that
#       exists, so a platform with no seed has no row rather than a green one.
#       The table above the pair says which conclusion means which.
# nish-cmp: WP19 G2.1, the successor to the two largest oracles R6 deletes.
#       `tests/nish-cmp.js` compiles the corpus with the last released compiler
#       and with the one HEAD builds and requires every byte of every file to
#       match -- Go's `toolstash -cmp`. It shares the `seeds` job with
#       `bootstrap` and is a matrix for the same reason, so a row appears when
#       a release carries a seed it can use and there is no row otherwise; the
#       `cmpSince` note in .github/seed-targets.json says which releases those
#       are and why it is not all of them.
# lint: `npm run lint` when package.json defines it (no-op otherwise), then
#       docs/check-links.mjs over every Markdown file.
#
# Also reusable via `workflow_call`: release.yml runs it before packing a tag.
# To run the same steps locally see docs/wp10-ci.md.
name: CI

# `push` is scoped to main on purpose. An unscoped `push:` fires on every
# branch, so one push to a branch with an open pull request ran the whole
# matrix twice: once for `push` and once for `pull_request`. The concurrency
# group below cannot collapse those two, because `github.ref` is
# `refs/heads/<branch>` for the push and `refs/pull/<n>/merge` for the pull
# request, which puts them in different groups where neither cancels the
# other. Tags keep their coverage: release.yml triggers on `v*` and reaches
# this workflow through `workflow_call`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Node's on-disk V8 compile cache, for every job in this file.
#
# This is a measurement rather than a habit, taken while the compiler was
# stage0: one `node dist/index.js <case>` cost about 634 ms, of which 1.5 ms
# was compiling and ~473 ms was `import ts from "typescript"`. The compiler
# under test is a native binary now, but the harness and its tools are still
# Node programs that spawn one another, and the oracles that parse with the
# `typescript` package pay that import. `NODE_COMPILE_CACHE` caches
# V8's compilation of every module it loads, keyed on the file's content and the
# Node version, and Node falls back to compiling normally when the key misses --
# a stale or absent cache costs time and can never change an answer. Measured on
# this repository: 412 ms -> 315 ms for one compiler spawn (-24%), and
# `tests/diagnostic_coverage.js --require-coverage --strict-refusals` 77.0 s ->
# 65.5 s (-15%).
#
# The path is outside the checkout on purpose. A cache directory inside
# `github.workspace` is a tree the repository does not track, and `npm test`,
# `docs/check-links.mjs` and `biome` all walk the tree.
env:
  NODE_COMPILE_CACHE: /tmp/nish-node-compile-cache

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest stays out of THIS job, and what keeps it out is a list
        # of named checks with a date on it rather than a guess or a cost. The
        # row was run for the first time on 2026-09-13 (WP19 R2) and `npm test`
        # failed there with five failures in four families; it was re-run on
        # 2026-09-21 with the row in the matrix and reported
        # `2125 passed, 6 failed, 4 skipped` -- run 606, job
        # https://github.com/amritk/nish/actions/runs/35652075129. Not one of
        # the nine failures across those two runs is a compiler bug. Every one
        # is a check that read an ELF fact out of a *linked binary* instead of
        # the property it exists for, which is why they are listed by cause:
        # the cause is the shape of mistake a new check can still make.
        #
        # PORTED, and measured green on a mac in that run:
        #
        #   * `llvm-dwarfdump --debug-line` of the linked binary reported an
        #     empty table. On Mach-O `clang -g` leaves the DWARF in the object
        #     files and the executable keeps only a debug map naming them; the
        #     Darwin driver runs `dsymutil` at the end of a compile-and-link to
        #     turn that map into a `.dSYM` bundle, which is where the table is.
        #     `lineTableOf` in tests/run.js answers with the file the platform
        #     used and the two `-g` checks assert the same sentence about it on
        #     both: it names dbg_main.ts and it has at least one row.
        #   * "--threads IR refuses to link against a runtime built without
        #     -DNISH_THREADS". ELF refuses a TLS reference to a non-TLS
        #     definition; ld64 links it and clang exits 0. What the check can
        #     hold both platforms to is not the link error but that the
        #     mismatch is never quietly a working-looking program: on Darwin
        #     `_nish_arena` resolves to a plain `(__DATA,__common)` symbol and
        #     the binary segfaults on its first allocation, where the matched
        #     build of the same inputs prints `alloc_smoke delta = 16`. The
        #     check names which mechanism caught it.
        #
        # STILL RED, six checks in three causes, and none of them is this line:
        #
        #   1. `runtime objects: a --threads module refuses to link against the
        #      default runtime` -- the same ld64 finding as the ported one
        #      above, in the gate on the prebuilt object cache. It wants the
        #      same treatment and is a check somebody else owns this wave.
        #   2. `the self-hosted compiler: -g reaches the compiler and the
        #      linked program carries DWARF` -- the same Mach-O debug map, read
        #      through `.debug_info` rather than `.debug_line`. It wants
        #      `lineTableOf`.
        #   3,4,5. `stage3 == stage2` in tests/self/bootstrap.js, and both
        #      `runtime objects: linking <case> ... gives the bytes the sources
        #      do` checks. All three compare two links of one input made to two
        #      *different output paths*, and LC_UUID is what ld64 varies with
        #      the path -- measured on both darwin rows,
        #      docs/wp10-ci.md#what-ld64-varies-measured. That is why each
        #      fails at identical size. scripts/bootstrap.sh already links its
        #      comparable stages at one path; these three do not.
        #   6. `verify-binaries: NISH_UNAME_S says on stderr that it overrode
        #      the platform` -- a check that drives the script's Darwin branch
        #      from Linux and reads the sentence saying so. On a mac there is
        #      no override to report, so the check is about the simulation
        #      rather than about the platform.
        #
        # WHAT IS NOT WAITING ON THIS LINE, because this comment claimed the
        # opposite until 2026-09-21: macOS is not absent from the file. The
        # `bootstrap` and `nish-cmp` jobs below take their rows from the seed
        # assets of the last release, `attachedSince` for the darwin pair is
        # 0.4.0, and v0.4.0 and v0.5.0 both carry them -- so `bootstrap
        # (aarch64-darwin)` and `bootstrap (x86_64-darwin)` have been running,
        # and passing, since 0.4.0. They are the reason the LC_UUID cause above
        # is known rather than suspected. This row is the one macOS gap left in
        # the file, not the whole of macOS.
        #
        # The install half is written and has now been exercised twice: the two
        # "Install LLVM 18 + lld" steps below are guarded by `runner.os`, so
        # restoring the row is this line plus the six checks above.
        #
        # `fail-fast: false` above is what would keep a macOS-only failure from
        # cancelling the Linux row that says whether it is the platform or the
        # change.
        os: [ubuntu-latest] # , macos-latest -- see the six checks above
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 valgrind
          # Debian ships versioned binaries (clang-18, llc-18, ...). Expose the
          # plain names through a private bin dir placed ahead of /usr/bin so the
          # scripts and tests/run.js find `clang`, `llc`, `llvm-as`, `opt`,
          # `ld.lld` and `wasm-ld` regardless of what the runner image ships.
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install LLVM 18 + lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          # Homebrew's llvm@18 bundles lld (ld.lld, wasm-ld). If a build ever
          # drops it, fall back to the standalone formula.
          if [ ! -x "$prefix/bin/wasm-ld" ]; then brew install lld; fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          for tool in clang llc llvm-as opt ld.lld wasm-ld; do
            printf '%-8s ' "$tool"; command -v "$tool"
          done
          clang --version | head -n 1
          llc --version | sed -n '2p'
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      # The seed: the last release's compiler for this runner's platform,
      # unpacked into build/seed by `scripts/fetch-seed.sh` (install.sh's
      # download, asset name and version check). Every compile `npm test`
      # makes is stage1's, and stage1 is `self/` built by this binary -- the
      # rolling freeze (WP19 G3) asked on the platform the suite runs on.
      - name: Fetch the seed
        run: |
          bash scripts/fetch-seed.sh
          build/seed/bin/nish --version

      # `build/nish` is what the steps after the suite drive: stage1, one
      # directory below the repository root, which is where its package root is
      # found from (`packageRoot` in self/compile.ts).
      - name: Build the compiler with the seed
        run: build/seed/bin/nish self/compile.ts --link build/nish

      # `--seed` rather than NISH_BOOTSTRAP: the variable also turns on
      # `tests/nish-cmp.js`, which the `nish-cmp` job below already runs, one
      # row per seed, and whose `cmpSince` rule that job's matrix states.
      - name: Test
        run: npm test -- --seed build/seed/bin/nish

      # `NISH` names the compiler scripts/smoke.sh and docs/cookbook/regen.sh
      # run, the compiler this job built.
      - name: Smoke (build + run every example with a main, size profile)
        env:
          NISH: build/nish
        run: bash scripts/smoke.sh

      # docs/IR_COOKBOOK.md promises the exact IR each construct compiles to
      # *today*, and agents are pointed at it as a reference. It drifted once
      # (the `internal` linkage of --strict-exports and the `nsw` defaults were
      # missing), so the staleness check is a gate rather than a chore.
      - name: Docs (IR cookbook up to date)
        env:
          NISH: build/nish
        run: bash docs/cookbook/regen.sh --check

      # The diagnostic-code registry is generated from the compiler's own
      # diagnostic sites; a new diagnostic without a code must not ship.
      # `npm test` checks it too -- this names it in its own step so a stale
      # registry reads as itself rather than as one failure among a thousand.
      - name: Diagnostic codes (registry up to date)
        run: node scripts/gen-diagnostic-codes.mjs --check

      # The other half of WP19 G2.4 -- every code provoked by a program, not
      # only every diagnostic given a code -- is not a step here: it is inside
      # `npm test`, which runs `tests/diagnostic_coverage.js` with
      # `--require-coverage` and `--strict-refusals`.

      - name: Size report
        run: |
          build/nish examples/add.ts -o build/add.ll
          bash scripts/size-report.sh --markdown build/add.ll examples/main.c | tee build/size-report.md
          {
            echo "### Binary size (${{ matrix.os }}, LLVM 18)"
            echo
            echo '`examples/add.ts` + `examples/main.c` + `runtime/runtime.c` + `runtime/runtime_os.c`'
            echo
            cat build/size-report.md
          } >> "$GITHUB_STEP_SUMMARY"

  # WP19 G3: build self/ with the LAST RELEASED nish rather than with stage0.
  #
  # Two jobs, because there are three answers and only two colours.
  #
  # `seeds` asks the last release which seed binaries it attaches; `bootstrap`
  # is a matrix over that answer, one row per seed that actually exists. A
  # platform with no seed therefore has no row rather than a green one, and
  # nothing in the checks list claims a freeze that nothing checked. CLAUDE.md
  # reads green as permission to merge, and this gate has now lied to that
  # reader twice: first by passing with a warning when it had verified nothing,
  # then by failing for a state in which nothing is wrong.
  #
  # WHICH CONCLUSION MEANS WHAT. Read the pair, not either half:
  #
  #   seeds green + a bootstrap row green   the freeze was checked with that
  #                                         seed, on that seed's own platform,
  #                                         and it held.
  #   seeds green + no row for a platform   the freeze was NOT checked there,
  #                                         and nothing is wrong: no release
  #                                         carries a seed for it yet. The
  #                                         `seeds` job summary lists every
  #                                         platform in both states by name.
  #   seeds green + bootstrap SKIPPED       the same, for every platform at
  #                                         once: there is no release at all.
  #   seeds RED                             a seed that should exist does not.
  #                                         The release is missing an asset
  #                                         release.yml attaches, and the
  #                                         annotation says how to get unstuck.
  #   a bootstrap row RED                   self/ does not build with the last
  #                                         release, which is the rolling
  #                                         freeze broken -- the failure this
  #                                         pair exists to catch.
  #
  # A job skipped by an `if:` reports SUCCESS to branch protection -- that is
  # GitHub's own rule for a conditional skip, as against a workflow skipped by
  # a path filter, which stays pending and blocks. So the grey is for the
  # reader and not for the merge button, which is the right way round:
  # CLAUDE.md's merge rule is addressed to a reader, and a required check that
  # stayed pending on every fork and before the first release is the deadlock
  # below.
  #
  # WHY "no release at all" MAY NOT BE RED. `release.yml`'s `release` job is
  # `needs: ci`, so a red CI is a release that cannot be cut. A repository with
  # no release has no seed, and if that were red the first release could never
  # be made: the gate would be waiting for an artifact only a release produces,
  # and the release would be waiting for the gate. That is the 0.1.0 base case
  # docs/wp12-release.md describes, and it is every fork of this repository on
  # the day it is forked. It is also, exactly, the argument this file makes for
  # keeping the macOS `test` row out, applied to a job that sits on the release
  # path.
  #
  # WHY a missing x86_64-linux seed IS red. There the release exists and is
  # supposed to carry it: .github/seed-targets.json marks that target
  # `attached`, which is release.yml's own statement that it builds one. Its
  # absence is a regression in that workflow or in the asset name the two
  # workflows share, not a state of the world -- and it costs the rolling
  # freeze its only check.
  #
  # This pair is what enforces the rolling freeze. Nish has no conditional
  # compilation and will not grow any -- there is no #[cfg(bootstrap)] to
  # write -- so "a construct added in 0.N cannot be used by self/ until
  # 0.(N+1)" (docs/wp12-release.md, "The bootstrap seed") is a discipline, and
  # a discipline CI does not check is a comment. Using a construct too early
  # breaks here and in `test`, which builds its compiler with the same seed;
  # these rows are the ones that do it on every platform the seed ships for.
  #
  # G3 asks for this on **both** operating systems and it gets both. That is
  # newer than it reads and it took two things, and neither was a line in this
  # file -- which is the point of the matrix being the release's answer:
  #
  #   * the darwin **seed**, which is WP19 G5. release.yml builds one per
  #     target from .github/seed-targets.json, the darwin pair's
  #     `attachedSince` is 0.4.0, and v0.4.0 was the first release to carry
  #     them. Before that macOS was the second state in the table above -- no
  #     row, and the `seeds` summary saying which version it was waiting for.
  #   * the **ld64 fixed point**, which was the `stage3 == stage2` family in
  #     the `test` matrix comment above, and which is settled for the two
  #     comparable stages this job builds: LC_UUID is what ld64 varies, it
  #     varies with the output path, and scripts/bootstrap.sh links both at one
  #     path and moves each into place afterwards
  #     (docs/wp10-ci.md#what-ld64-varies-measured). The Darwin narrowing in
  #     scripts/verify-binaries.sh stays as a net under a comparison that holds
  #     rather than as the arm that decides a row.
  #
  # So `bootstrap (aarch64-darwin)` and `bootstrap (x86_64-darwin)` are rows
  # this workflow runs, and the `test` row above is the one macOS gap left in
  # the file. The `stage3 == stage2` comparison that tests/self/bootstrap.js
  # makes is *not* the one settled here -- it links its two stages at two
  # paths and is one of the six checks named up there.
  seeds:
    name: which seeds the last release attaches
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.pick.outputs.rows }}
      cmp: ${{ steps.pick.outputs.cmp }}
    steps:
      - uses: actions/checkout@v4

      # The lookup is a job of its own, before any toolchain and before
      # `npm ci`, for two reasons. It is the gate, so it should answer in
      # seconds rather than after two minutes of setup it may be about to throw
      # away; and its answer has to be a *job* conclusion and a matrix, because
      # a step that skips inside a green job leaves the job green.
      #
      # The script is in a file rather than here so that `npm test` can run it:
      # tests/run.js drives it against a stand-in for `gh` through each of its
      # states, which is the check that was missing both times this logic was
      # got wrong.
      - name: Ask the last release what it carries
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/seed-matrix.sh

  bootstrap:
    name: bootstrap (${{ matrix.seed.asset }})
    needs: seeds
    # Before the first release nothing is seeded anywhere, which is an empty
    # matrix -- and an empty matrix is a strategy GitHub refuses to evaluate
    # rather than a job with no rows. `seeds` is what says so in that state,
    # and this job is grey rather than green.
    if: needs.seeds.outputs.rows != '[]'
    runs-on: ${{ matrix.seed.runner }}
    strategy:
      # One platform's linker is not another's, so a failure on one row must
      # not cancel the row that would say whether it is the platform or the
      # change.
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.rows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The toolchain is installed on rows that have a seed to build with,
      # which is all of them: a platform with no seed has no row and rents no
      # runner. A `brew install llvm@18` on a row whose every later step is
      # skipped is 42 seconds of the slowest runner GitHub rents, on every
      # push, to emit one warning.
      - name: Install LLVM 18 + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install LLVM 18 + lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          if [ ! -x "$prefix/bin/wasm-ld" ]; then brew install lld; fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The tarball name is .github/seed-targets.json's, resolved against the
      # release by `seeds`. This row exists *because* that asset is on the
      # release, so a download that fails here is a network or permissions
      # fault rather than the absence the gate is about.
      #
      # The matrix reaches bash through `env:` rather than through ${{ }}
      # spliced into the script. A maintainer-created tag is not a plausible
      # attacker, but the value came out of a release and the rule costs
      # nothing -- it is the one pr-title.yml already states.
      - name: Download the seed
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.seed.tag }}
          TARBALL: ${{ matrix.seed.tarball }}
        run: |
          gh release download "$TAG" --pattern "$TARBALL" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP"
          echo "path=$RUNNER_TEMP/${TARBALL%.tar.gz}/bin/nish" >> "$GITHUB_OUTPUT"

      - name: Build self/ with the seed
        env:
          SEED: ${{ steps.download.outputs.path }}
        run: |
          "$SEED" --version
          NISH_BOOTSTRAP="$SEED" bash scripts/bootstrap.sh --verify

      # The command line's contract, asked of the compiler that outlives stage0.
      # `tests/nish/cli.ts` is a Nish program reading the compiler's own output —
      # the streams, the exit-code bands, one flat `--json` object per diagnostic —
      # and here it is pointed at the stage2 this row's seed built, where `npm test`
      # points it at a stage1. Its counted skips are the summary below.
      - name: The CLI contract, against the self-hosted compiler
        run: |
          set -o pipefail
          build/nish tests/nish/cli.ts -o build/nish-cli.ir/ --link build/nish-cli
          build/nish-cli build/nish | tee "$RUNNER_TEMP/nish-cli.log"
          echo "::notice::tests/nish/cli.ts against build/nish: $(tail -n 1 "$RUNNER_TEMP/nish-cli.log")"

      # Reached only when every step above succeeded, which is the point: this
      # line is a claim about a run that happened, and there is no branch of it
      # that describes one that did not. The states in which it did not happen
      # do not reach this job at all -- they are the `seeds` job's summary and
      # a row that is not here.
      - name: Say what this proved
        env:
          TAG: ${{ matrix.seed.tag }}
          ASSET: ${{ matrix.seed.asset }}
          TRIPLE: ${{ matrix.seed.triple }}
        run: |
          echo "::notice::self/ built and verified with $TAG's $ASSET seed ($TRIPLE). That is the rolling freeze checked on this platform, and it says nothing about any other."
          { echo "### The rolling freeze (WP19 G3)"; echo; echo "self/ built and verified with $TAG's \`$ASSET\` seed ($TRIPLE). That is this platform; the \`seeds\` job lists the platforms nothing checked."; } >> "$GITHUB_STEP_SUMMARY"


  # WP19 G2.1 -- one corpus, two compilers, byte for byte.
  #
  # This is the check that replaced `tests/self/ir_oracle.js` and
  # `tests/self/interop_oracle.js`, the two largest of the six oracles R6
  # deleted with `src/`. What they proved -- the IR of every module of every
  # corpus program, and the four WP8 sidecars derived from the same checked
  # program -- they proved by comparing two implementations. There is only one
  # now, so the comparison changed axis: not stage0 against stage1, but the
  # last RELEASED compiler against the one HEAD builds. A wrong lowering then shows up as a release that changed output
  # nobody declared, which is the strongest thing a single-implementation
  # compiler can say about itself (docs/wp19-stage0-retirement.md §2B, §6).
  #
  # It is a job rather than a step in `test` because it needs a seed, which
  # `test` has no reason to download, and because it costs the corpus twice --
  # about three minutes -- which should be a runner rather than wall-clock time
  # on the critical path.
  #
  # An undeclared difference fails the job. The tool's `DECLARED` list is how a
  # difference that is INTENDED goes green, and it deliberately costs
  # something: an entry names the program, the file and the words `CHANGELOG.md`
  # has to carry, and an entry whose words have gone fails the run too, so the
  # release note and the tool cannot drift apart.
  nish-cmp:
    name: nish-cmp (${{ matrix.seed.asset }})
    needs: seeds
    # Empty for the two reasons the `cmpSince` note in seed-targets.json
    # separates: no release has happened, or every release so far carries a
    # seed that cannot compile the corpus. Either way this is grey rather than
    # green, because a green check here would claim a comparison that nothing
    # made -- and an empty matrix is an error GitHub refuses to evaluate rather
    # than a job with no rows, which is why the `if` is on the job.
    if: needs.seeds.outputs.cmp != '[]'
    runs-on: ${{ matrix.seed.runner }}
    strategy:
      # x86_64 and aarch64 have different registers and different calling
      # conventions, so one row failing must not cancel the row that would say
      # whether it is the architecture or the change.
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.seeds.outputs.cmp) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The candidate is built by the reference through `--link`
      # (`buildCandidate` in tests/nish-cmp.js, the arrangement G3 puts in
      # scripts/bootstrap.sh), so this job wants the toolchain for the same
      # reason `bootstrap` does rather than only to read IR.
      - name: Install LLVM 18 + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The same download `bootstrap` makes, and the same rule about the
      # matrix reaching bash through `env:` rather than spliced into the
      # script.
      - name: Download the seed
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.seed.tag }}
          TARBALL: ${{ matrix.seed.tarball }}
        run: |
          gh release download "$TAG" --pattern "$TARBALL" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP"
          echo "path=$RUNNER_TEMP/${TARBALL%.tar.gz}/bin/nish" >> "$GITHUB_OUTPUT"

      # `NISH_BOOTSTRAP` rather than `--reference`, so the spelling is the one
      # scripts/bootstrap.sh and the harness already read and there is one name
      # for the seed across all three.
      - name: The released compiler and HEAD write the same bytes
        env:
          SEED: ${{ steps.download.outputs.path }}
        run: |
          set -o pipefail
          "$SEED" --version
          NISH_BOOTSTRAP="$SEED" node tests/nish-cmp.js | tee "$RUNNER_TEMP/nish-cmp.log"

      # Reached only when the comparison agreed, which is the point: this line
      # is a claim about a run that happened. The summary line carries its own
      # counts -- programs compared, files, IR lines, and what was refused by
      # both or written by neither -- so the notice is the tool's number rather
      # than a restatement of it.
      - name: Say what this proved
        env:
          TAG: ${{ matrix.seed.tag }}
          ASSET: ${{ matrix.seed.asset }}
        run: |
          summary="$(tail -n 1 "$RUNNER_TEMP/nish-cmp.log")"
          echo "::notice::$TAG's $ASSET compiler and HEAD agree byte for byte. $summary"
          { echo "### nish-cmp (WP19 G2.1)"; echo; echo "\`$TAG\`'s \`$ASSET\` compiler and HEAD write the same bytes over the corpus."; echo; echo "\`\`\`"; echo "$summary"; echo "\`\`\`"; } >> "$GITHUB_STEP_SUMMARY"


  # The golden cases again, through the harness written in the language rather
  # than through the one written in Node (`tests/nish/run.ts`, `npm run
  # test:nish`). `npm test` builds that runner and runs it over five cases, which
  # proves it compiles and works; only the full pass proves it still *agrees*,
  # and a harness nobody runs is a harness that rots.
  #
  # It is not a duplicate of the `test` job, and what it adds is worth stating: a
  # compiler regression fails in both, but a regression in the runner itself --
  # or in `readdirSync`, `spawnSyncTo` or `monotonicNanos`, which nothing else
  # exercises together on a real workload -- fails only here. It runs in parallel
  # with `test`, so it costs a runner rather than wall-clock time, and it spawns a
  # compiler per case, which is why `npm test` does not pay for it.
  runner:
    name: the golden cases, in Nish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The same seed and the same build the `test` job makes; see there.
      - name: Fetch the seed
        run: bash scripts/fetch-seed.sh

      - name: Build the compiler with the seed
        run: build/seed/bin/nish self/compile.ts --link build/nish

      # The runner answers 1 when any check failed, so the step's own exit status
      # is the gate. Its last line is the summary, which is what a reader wants
      # in the job log without expanding it.
      # `set -o pipefail` is load-bearing: the default shell for a `run:` step is
      # `bash -e`, without it, so the exit status of a pipeline would be `tee`'s
      # and a runner that answered 1 would still be a green step.
      # The runner is built by the compiler under test and handed it with
      # `--compiler`; with no filter it walks the
      # whole corpus.
      - name: The corpus, through the Nish runner
        run: |
          set -o pipefail
          build/nish tests/nish/run.ts -o build/nish-runner.ir/ --link build/nish-runner
          build/nish-runner --compiler build/nish | tee "$RUNNER_TEMP/nish-runner.log"

      - name: Say what this proved
        if: always()
        run: |
          summary="$(tail -n 1 "$RUNNER_TEMP/nish-runner.log" 2>/dev/null || echo 'the runner produced no summary')"
          echo "::notice::tests/nish/run.ts over tests/cases: $summary"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (only when package.json defines a lint script)
        run: npm run lint --if-present

      # Every relative link and heading anchor in README, CHANGELOG and docs/**.
      # The guidelines are a graph of pointers between files; a broken one sends
      # a reader -- human or agent -- to a page that does not exist.
      - name: Docs (links and anchors resolve)
        run: node docs/check-links.mjs
