# WP19 G1: the corpus half of `--parity`, nightly.
#
# `node tests/run.js --parity` runs the whole corpus through both compilers
# under every flag variation the suite uses and compares everything the
# command line produces -- exit status, stdout, stderr and every file written.
# It is the only check that asks whether a program or a flag is still stage0's,
# and between wp19 §A2 and §A3 it found a miscompile that eleven oracles and
# 1,161 checks had not.
#
# Why here rather than in ci.yml's `test` job: it is roughly 9,000 compilations
# by each compiler over 623 programs, plus linking a stage1 binary first --
# about forty minutes against three for `npm test`, and it grows with every
# flag the suite adds. Making every push wait on that is the trade wp19 §A5
# argues against; the flag-set half, which takes seconds and is what found
# `--no-warn-performance` and `--out-dir`, already runs inside `npm test`.
#
# Why nightly rather than never: G1 was recorded green on an empty difference
# set, and the claim stopped being true without anybody editing it -- arrows
# landed, no `-g` case was written in the arrow spelling, and the gate sat
# reopened until somebody ran the mode by hand. A gate that only runs when
# remembered measures memory. Nightly, a red result names the day it appeared.
#
# A scheduled workflow runs on the default branch only, so this says nothing
# about a branch; `workflow_dispatch` is how you ask it about one.
name: Parity

on:
  schedule:
    # 06:17 UTC. Off the hour because GitHub's scheduler queues everything
    # written at :00, and the run is long enough to care about starting.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only programs whose path contains this (default: the whole corpus)"
        required: false
        type: string

# `issues: write` is what the last step needs: a red gate opens an issue and a
# green one closes it, so the gate's state lives somewhere a person passes
# rather than in a run log somebody has to think to open.
permissions:
  contents: read
  issues: write

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity (the corpus, every variation)
    runs-on: ubuntu-latest
    # The measured run is ~40 minutes on a machine that is not a hosted runner.
    # Two hours is room for a slower one, and short enough that a hang is
    # reported the same morning rather than after six.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The mode spawns `dist/index.js` for stage0 and links its own stage1
      # binary out of `self/`, so stage0 has to exist first.
      - name: Build stage0
        run: npm run build

      # The dispatch input reaches the shell as an environment variable rather
      # than through `${{ }}` interpolation, which would paste whatever was
      # typed into the script itself.
      - name: Parity
        id: parity
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=""
          if [ -n "$ONLY" ]; then args="--only $ONLY"; fi
          # shellcheck disable=SC2086
          set +e
          node tests/run.js --parity $args 2>&1 | tee "$RUNNER_TEMP/parity.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # The summary line carries the numbers wp19 §A4 and §A5 are quoted from,
      # and the point of both sections is that such a number is only true on
      # the day it was measured. Recording it in the run means the next person
      # can quote it with its date instead of re-deriving it.
      - name: Say what this proved
        if: always()
        run: |
          {
            echo "### Parity ($(date -u +%Y-%m-%d), ubuntu-latest, LLVM 18)"
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/parity.log"
            echo '```'
            if [ "${{ steps.parity.outputs.status }}" = "0" ]; then
              echo
              echo "Green: every undeclared difference is gone. Quote this with its date."
            else
              echo
              echo "Red: an undeclared difference. It is a gate, not a flake --"
              echo "read the table above, then wp19 §A2/§A3 for the five classes"
              echo "that have come up before."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # And a gate whose state lives only in a run log is one step short of the
      # silence wp19 §A5 is about. The mode running nightly fixes "nobody
      # remembered to type the command"; it does not fix "nobody opened the
      # run". So a full run that is not green opens an issue -- or adds a
      # comment to the one already open, so a week of red is one thread rather
      # than seven -- and a full run that is green closes it. The repository
      # itself then carries the answer, and a reopened gate arrives as a
      # notification instead of as a number somebody has to re-derive.
      #
      # Only a **full** run may touch the issue. `workflow_dispatch` takes an
      # `only` filter, and a green subset is exactly the claim §A5 records
      # going wrong: an empty difference set over part of the corpus read as an
      # empty difference set. A filtered run therefore reports into the job
      # summary and nowhere else.
      #
      # Two states are not green and both open the issue, because both leave
      # the gate unproved for the day: an undeclared difference, and a run that
      # never got as far as the mode.
      - name: A gate that is not green says so where it will be seen
        if: always() && inputs.only == ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.parity.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Absolute, because a relative link in an issue body is not
          # resolved against the repository the way one in a file is.
          WP19: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/wp19-stage0-retirement.md
          TITLE: "WP19 G1: the parity gate is not green"
        run: |
          today="$(date -u +%Y-%m-%d)"
          # `gh issue list` reads the API directly. `--search` would go through
          # the search index, which lags by minutes and would open a second
          # issue on the second red night.
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"

          if [ "$STATUS" = "0" ]; then
            [ -n "$number" ] || { echo "green, and no issue open"; exit 0; }
            gh issue comment "$number" --body "Green again on $today: \`$(tail -n 1 "$RUNNER_TEMP/parity.log")\`. [The run]($RUN_URL)."
            gh issue close "$number" --reason completed
            echo "green: closed #$number"
            exit 0
          fi

          if [ -s "${RUNNER_TEMP}/parity.log" ]; then
            evidence="$(tail -n 40 "$RUNNER_TEMP/parity.log")"
            what="\`node tests/run.js --parity\` reported an undeclared difference."
          else
            evidence="(the run produced no parity output)"
            what="The run never reached the mode, so the gate is **unmeasured** for $today rather than red. That is not a lesser state: the record may not read green on a day nothing was measured."
          fi

          body="$(printf '%s\n\n%s\n\n```\n%s\n```\n\n%s\n' \
            "$what" \
            "Measured $today on \`ubuntu-latest\` with LLVM 18. [The run]($RUN_URL)." \
            "$evidence" \
            "A red result here is a gate rather than a flake: read the table above, then [wp19 §A2/§A3]($WP19#a2-what---parity-found-on-its-first-run) for the classes that have come up before, and [§A5]($WP19#a5-the-gate-reopened-and-the-correction-a4-needed) for what a gate recorded green while it was red has cost once already. This issue closes itself on the next green full run.")"

          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "not green: commented on #$number"
          else
            gh issue create --title "$TITLE" --body "$body"
            echo "not green: opened an issue"
          fi
