# WP19 G1: the corpus half of `--parity`, nightly.
#
# `node tests/run.js --parity` runs the whole corpus through both compilers
# under every flag variation the suite uses and compares everything the
# command line produces -- exit status, stdout, stderr and every file written.
# It is the only check that asks whether a program or a flag is still stage0's,
# and between wp19 §A2 and §A3 it found a miscompile that eleven oracles and
# 1,161 checks had not.
#
# Why here rather than in ci.yml's `test` job: it is one compilation by each
# compiler for every program of the corpus under every flag variation --
# 13,260 runs over 884 programs on 2026-09-18, against 9,345 over 623 when this
# paragraph was first written -- plus linking a stage1 binary first. Measured on
# `ubuntu-latest`: 2,100.5 s in the mode and 36 minutes for the job, against
# three minutes for `npm test`, and it grows with every program and every flag
# the suite adds. Making every push wait on that is the trade wp19 §A5 argues
# against; the flag-set half, which takes seconds and is what found
# `--no-warn-performance` and `--out-dir`, already runs inside `npm test`, and
# ci.yml's `parity-changed` job runs the corpus half over the programs a pull
# request touched, which is the part of it a pull request can afford.
#
# Those two counts are `programs x variations`, so they are re-derivable from
# the tree rather than remembered -- but they are still a fact about a corpus on
# a date, and this one has grown by a third in two weeks. The run prints its own
# count in the summary line; read that rather than this comment.
#
# Why nightly rather than never: G1 was recorded green on an empty difference
# set, and the claim stopped being true without anybody editing it -- arrows
# landed, no `-g` case was written in the arrow spelling, and the gate sat
# reopened until somebody ran the mode by hand. A gate that only runs when
# remembered measures memory. Nightly, a red result names the day it appeared.
#
# A scheduled workflow runs on the default branch only, so this says nothing
# about a branch; `workflow_dispatch` is how you ask it about one.
name: Parity

on:
  schedule:
    # 06:17 UTC. Off the hour because GitHub's scheduler queues everything
    # written at :00, and the run is long enough to care about starting.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only programs whose path contains this (default: the whole corpus)"
        required: false
        type: string

# Read-only at the top, so that every job inherits the smaller of the two
# tokens. The `record` job below asks for `issues: write` for itself, because
# it is the only one that writes an issue -- and because the job beside it runs
# `npm ci`, `npm run build` and the corpus, which is to say arbitrary code out
# of the repository and its dependency tree. That code has no business holding
# a token that can open, comment on and close issues.
permissions:
  contents: read

# Node's on-disk V8 compile cache, as in ci.yml, and this is the workflow with
# most to gain from it: the corpus half of `--parity` is one compiler process per
# program per variation -- 13,020 runs over 868 programs as this lands -- and
# `tests/batch_worker.js` measured ~473 ms of each one as `import ts from
# "typescript"`. The cache is keyed on file content and Node version and Node
# compiles normally when the key misses, so a cold or stale cache costs time and
# can never change what a run reports, which matters more here than in ci.yml:
# what this workflow reports is a *difference set*, and a gate that could be
# moved by a cache would be worthless. Measured in ci.yml's own comment: 412 ms
# -> 315 ms for one spawn.
#
# The path sits outside the checkout, because the corpus walks the tree.
env:
  NODE_COMPILE_CACHE: /tmp/nish-node-compile-cache

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity (the corpus, every variation)
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.parity.outputs.status }}
    # Five hosted runs exist now and the ceiling is no longer a guess: the four
    # nightlies took 36 to 56 minutes, and the 2026-09-18 run that proved the
    # `record` job below took 36 (2,100.5 s in the mode, 884 programs). Two
    # hours is therefore about double the longest run on a corpus a third
    # larger than the one it measured, and short enough that a hang is reported
    # the same morning rather than after six. A local measurement would not do
    # for this: the boxes wp19 §A7 quotes are shared four-core ones, so their
    # seconds measure the neighbours as much as the compilers.
    # A timeout is not silence any more: the `record` job below reads a run
    # that never reached the mode as **unmeasured** and opens the issue for it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      # The mode spawns `dist/index.js` for stage0 and links its own stage1
      # binary out of `self/`, so stage0 has to exist first.
      - name: Build stage0
        run: npm run build

      # The dispatch input reaches the shell as an environment variable rather
      # than through `${{ }}` interpolation, which would paste whatever was
      # typed into the script itself.
      - name: Parity
        id: parity
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=""
          if [ -n "$ONLY" ]; then args="--only $ONLY"; fi
          # shellcheck disable=SC2086
          set +e
          node tests/run.js --parity $args 2>&1 | tee "$RUNNER_TEMP/parity.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      # The summary line carries the numbers wp19 §A4 and §A5 are quoted from,
      # and the point of both sections is that such a number is only true on
      # the day it was measured. Recording it in the run means the next person
      # can quote it with its date instead of re-deriving it.
      - name: Say what this proved
        if: always()
        run: |
          # A run that died before the mode wrote anything still reports, and
          # reports that: `tail` on a file that is not there would fail the
          # step instead, which is the state disappearing rather than printing.
          [ -f "$RUNNER_TEMP/parity.log" ] || : > "$RUNNER_TEMP/parity.log"
          {
            echo "### Parity ($(date -u +%Y-%m-%d), ubuntu-latest, LLVM 18)"
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/parity.log"
            echo '```'
            if [ "${{ steps.parity.outputs.status }}" = "0" ]; then
              echo
              echo "Green: every undeclared difference is gone. Quote this with its date."
            else
              echo
              echo "Red: an undeclared difference. It is a gate, not a flake --"
              echo "read the table above, then wp19 §A2/§A3 for the five classes"
              echo "that have come up before."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The log is handed to the `record` job as an artifact rather than as a
      # job output, because the output map is a place for short strings and
      # this is forty lines of table. `if-no-files-found: ignore` is the state
      # the next job reads as "the run never reached the mode".
      - name: Keep the log for the recording job
        if: always() && inputs.only == ''
        uses: actions/upload-artifact@v4
        with:
          name: parity-log
          path: ${{ runner.temp }}/parity.log
          if-no-files-found: ignore
          retention-days: 14

  # And a gate whose state lives only in a run log is one step short of the
  # silence wp19 §A5 is about. The mode running nightly fixes "nobody
  # remembered to type the command"; it does not fix "nobody opened the run".
  # So a full run that is not green opens an issue -- or adds a comment to the
  # one already open, so a week of red is one thread rather than seven -- and a
  # full run that is green closes it. The repository itself then carries the
  # answer, and a reopened gate arrives as a notification instead of as a
  # number somebody has to re-derive.
  #
  # It is a **separate job** for one reason: this is the only thing in the
  # workflow that needs `issues: write`, and the job that runs the corpus runs
  # `npm ci` and then a few thousand compilations of whatever is in the tree.
  # Granting that step a token that can write to the issue tracker costs
  # nothing to avoid -- a job boundary and an artifact -- and a workflow-level
  # `issues: write` would hand it to every step in the file.
  #
  # Only a **full** run may touch the issue. `workflow_dispatch` takes an
  # `only` filter, and a green subset is exactly the claim §A5 records going
  # wrong: an empty difference set over part of the corpus read as an empty
  # difference set. A filtered run therefore reports into the job summary and
  # nowhere else, which is why this job does not run at all for one.
  #
  # Two states are not green and both open the issue, because both leave the
  # gate unproved for the day: an undeclared difference, and a run that never
  # got as far as the mode.
  #
  # THIS JOB HAS NOW RUN, which is worth writing down because for its first
  # four nights it had not, and nobody could have told the difference from
  # reading the file. Every red nightly so far happened at a SHA whose
  # `parity.yml` predates the job, so the gate was red for four days and said
  # so only inside a run log -- which is §A5's failure exactly, one level up.
  # Proved on 2026-09-18 by a full run on a branch with the corpus still red:
  # `STATUS` arrived as `1` from a job that had *failed*, the artifact came
  # back, and the job opened amritk/nish#93 with the difference table in it.
  # Two conditions were the ones worth proving rather than reading. `inputs`
  # is null on any event that is not a `workflow_dispatch`, and GitHub casts
  # both null and `""` to 0, so `inputs.only == ''` is true on a `schedule`
  # run and this job is reached -- and the artifact step above, which carries
  # the same condition, uploads. Neither is obvious from the YAML and both are
  # load-bearing: if either read the other way, the gate would go on being
  # visible only to somebody who opened the run.
  record:
    name: a gate that is not green says so where it will be seen
    needs: parity
    if: always() && inputs.only == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # A run that died before the mode wrote anything leaves no artifact, and
      # that is one of the two states this job reports. It must not be an error.
      - name: Fetch the log
        id: log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: parity-log
          path: ${{ runner.temp }}

      - name: Open, comment on, or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ needs.parity.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Absolute, because a relative link in an issue body is not
          # resolved against the repository the way one in a file is.
          WP19: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/wp19-stage0-retirement.md
          TITLE: "WP19 G1: the parity gate is not green"
        run: |
          log="$RUNNER_TEMP/parity.log"
          [ -f "$log" ] || : > "$log"
          today="$(date -u +%Y-%m-%d)"
          # `gh issue list` reads the API directly. `--search` would go through
          # the search index, which lags by minutes and would open a second
          # issue on the second red night.
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"

          if [ "$STATUS" = "0" ]; then
            [ -n "$number" ] || { echo "green, and no issue open"; exit 0; }
            gh issue comment "$number" --body "Green again on $today: \`$(tail -n 1 "$log")\`. [The run]($RUN_URL)."
            gh issue close "$number" --reason completed
            echo "green: closed #$number"
            exit 0
          fi

          if [ -s "$log" ]; then
            evidence="$(tail -n 40 "$log")"
            what="\`node tests/run.js --parity\` reported an undeclared difference."
          else
            evidence="(the run produced no parity output)"
            what="The run never reached the mode, so the gate is **unmeasured** for $today rather than red. That is not a lesser state: the record may not read green on a day nothing was measured."
          fi

          body="$(printf '%s\n\n%s\n\n```\n%s\n```\n\n%s\n' \
            "$what" \
            "Measured $today on \`ubuntu-latest\` with LLVM 18. [The run]($RUN_URL)." \
            "$evidence" \
            "A red result here is a gate rather than a flake: read the table above, then [wp19 §A2/§A3]($WP19#a2-what---parity-found-on-its-first-run) for the classes that have come up before, and [§A5]($WP19#a5-the-gate-reopened-and-the-correction-a4-needed) for what a gate recorded green while it was red has cost once already. This issue closes itself on the next green full run.")"

          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "not green: commented on #$number"
          else
            gh issue create --title "$TITLE" --body "$body"
            echo "not green: opened an issue"
          fi
