# The release train. Two paths, one trigger.
#
#   a normal push to main  -> open or refresh the Release PR
#   the Release PR's merge -> create the tag, which starts release.yml
#
# The shape: every merged pull request accumulates into one open
# "chore(release): <version>" pull request that carries the version bump,
# `changelog/<version>.json` and the rendered CHANGELOG.md section. Merging that
# pull request is the act of releasing -- it is the review step for the release
# notes, before anyone can read them, rather than after.
#
# One repository switch has to be on for that to happen unattended: Settings >
# Actions > General > Workflow permissions > "Allow GitHub Actions to create and
# approve pull requests". Without it the API refuses `gh pr create` outright,
# whatever this workflow's `permissions:` say. The branch is pushed either way,
# so the step warns and links the compare page instead of failing -- a release
# that needs one click is not a reason to paint main red on every merge. A
# RELEASE_PR_TOKEN secret (a PAT or app token with `repo`) also lifts it.
#
# Why the tag is created here and not by the merge itself: a tag pushed by a
# workflow using the default GITHUB_TOKEN does not start another workflow, so
# release.yml would never run on it.
#
# This file used to claim that pushing the tag as a ref creation was enough to
# get around that. It is not, and v0.1.0 is the proof: tagged by this job,
# never built, because `push: tags` raises nothing for a GITHUB_TOKEN push --
# there is no ref-creation exemption. What GitHub does exempt is
# `workflow_dispatch` and `repository_dispatch`, so the step below pushes the
# tag and then dispatches release.yml *at* that tag, which needs no deploy key
# and no personal access token. `actions: write` below is what lets it.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch release.yml at the tag this job pushes

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  train:
    name: release train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the generator walks the log back to the last tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Did this push land the release commit? The release PR is the only
      # thing that writes changelog/<version>.json for the version in
      # package.json, so "the file exists and the tag does not" identifies it
      # exactly, without depending on a label or a commit-message convention.
      - name: Decide which path this push is on
        id: path
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -f "changelog/$version.json" ] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      # ---- path 1: the release PR merged, so cut the tag -------------------------------------
      - name: Tag the release
        if: steps.path.outputs.mode == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.path.outputs.version }}"
          # Never tag or dispatch at a guessed ref. An empty version here would
          # mean the step above changed its output contract, and `v` alone
          # would tag the wrong thing and then aim release.yml at it -- the
          # silent mis-release this chain exists to avoid.
          if [ "$v" = "v" ]; then
            echo "::error::the release train computed an empty version; refusing to tag or dispatch at a guessed ref"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "nish ${{ steps.path.outputs.version }}"
          git push origin "$v"

          # Pushing the tag is not enough, and the comment at the top of this
          # file used to say it was. GitHub raises no event for a ref pushed
          # with GITHUB_TOKEN, so release.yml's `push: tags` trigger never
          # sees it: v0.1.0 was tagged here and never built, and the only
          # symptom was a release that did not exist.
          #
          # `workflow_dispatch` is one of the two events GITHUB_TOKEN may
          # raise, so aim it at the tag we just pushed. The ref carries through
          # as GITHUB_REF_NAME, which is what every step of release.yml reads,
          # so a dispatched run and a human's `git push origin v0.1.0` build
          # exactly the same thing.
          gh workflow run release.yml --ref "$v"

          # `gh workflow run` returning 0 means the dispatch was accepted, not
          # that a run exists; this is the check that tells the two apart,
          # because "the release silently did not happen" is the failure this
          # whole step is fixing. The dispatch already succeeded if we are
          # here, so a run we cannot *see* is a warning naming the one command
          # that finishes the job -- not a red main over an observation.
          for _ in $(seq 1 10); do
            if [ -n "$(gh run list --workflow release.yml --branch "$v" --limit 1 --json databaseId --jq '.[0].databaseId // ""')" ]; then
              echo "::notice::tagged $v and started release.yml, which builds and publishes it"
              exit 0
            fi
            sleep 3
          done
          echo "::warning title=Release run not seen::Tagged $v and dispatched release.yml, but no run appeared within 30s. Check the Actions tab; if there is nothing, start it with: gh workflow run release.yml --ref $v"

      # ---- path 2: an ordinary merge, so refresh the release PR ------------------------------
      - name: Build the next release
        if: steps.path.outputs.mode == 'pr'
        id: next
        run: |
          next="$(node scripts/changelog-gen.mjs --next)"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          node scripts/changelog-gen.mjs --version "$next" --write > /dev/null
          node -e '
            const fs=require("fs");const v=process.argv[1];
            for (const f of ["package.json","package-lock.json"]) {
              const j=JSON.parse(fs.readFileSync(f,"utf8"));
              j.version=v; if (j.packages&&j.packages[""]) j.packages[""].version=v;
              // The per-platform packages carrying the native compiler are
              // pinned to the exact version of the package that depends on
              // them, so they move with it. A bump that left them behind would
              // publish a compiler whose optionalDependencies resolve last
              // release's binaries -- an install that succeeds, runs, and is
              // one release stale in the half of itself nobody looks at.
              // tests/run.js fails while the two disagree.
              const deps=j.optionalDependencies;
              if (deps) for (const k of Object.keys(deps)) if (k.startsWith(`${j.name??""}-`)) deps[k]=v;
              fs.writeFileSync(f, JSON.stringify(j,null,2)+"\n");
            }
            // self/branding.ts carries the version too, and tests/run.js fails
            // when the two disagree -- a bump that touches only package.json
            // turns CI red on the release PR itself.
            const b="self/branding.ts";
            fs.writeFileSync(b, fs.readFileSync(b,"utf8").replace(
              /export const VERSION: string = "[^"]*";/,
              `export const VERSION: string = "${v}";`));
          ' "$next"

      - name: Open or refresh the Release pull request
        if: steps.path.outputs.mode == 'pr'
        env:
          # RELEASE_PR_TOKEN, when the repository has one, is a token the
          # create-pull-request switch does not apply to; the default token is
          # the fallback, and the step below degrades rather than fails when it
          # turns out to be refused.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        run: |
          next="${{ steps.next.outputs.next }}"
          branch="release/next"
          # The title is the squash-merge subject, so it is a conventional
          # commit: pr-title.yml checks it like any other, and the merge lands
          # under "Internal" in the next release instead of being skipped.
          title="chore(release): $next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::nothing to release"
            exit 0
          fi
          git commit -m "$title"
          git push --force origin "$branch"

          # The notes are a `$(...)` away from the prose, and command
          # substitution eats trailing newlines: appending them to a preamble
          # that ends in a rule is what once rendered `---### Fixed` as one
          # line of literal text. So the notes are an argument to a single
          # printf, which is the only thing here that puts the blank lines in.
          notes="$(node scripts/changelog-gen.mjs --from-json "changelog/$next.json" | head -c 50000)"
          body="$(printf '> [!WARNING]\n> **A human merges this one.** Merging it publishes to npm, so an automated agent must never merge it, however green its checks are (see AGENTS.md, "Shipping a change").\n\nMerging this pull request releases **%s**: it creates the `v%s` tag, which builds the artifacts and publishes the release.\n\nThe notes below are the release notes — one line per change, linking the pull request it landed in. They are generated from the commits since the last tag and stored in `changelog/%s.json`, which is the file the website reads, bodies and all. Edit that file in this pull request to fix a wording; do not edit `CHANGELOG.md` by hand, it is rendered from the JSON.\n\n---\n\n%s\n' "$next" "$next" "$next" "$notes")"

          if existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" && [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "::notice::refreshed release PR #$existing for $next"
          elif out="$(gh pr create --head "$branch" --base main --title "$title" --body "$body" 2>&1)"; then
            echo "$out"
            echo "::notice::opened the release PR for $next"
          elif printf '%s' "$out" | grep -qF 'not permitted to create or approve pull requests'; then
            # The branch is pushed and the notes are on it; the only thing
            # missing is the pull request, and the reason is a repository
            # switch rather than anything about this commit. Failing here would
            # paint main red on every merge and say nothing new, so say it once
            # as a warning and hand over the link that opens it in one click.
            echo "$out"
            url="${{ github.server_url }}/${{ github.repository }}/compare/main...$branch?expand=1"
            echo "::warning title=Release pull request not opened::Pushed $branch for $next, but this repository does not let GitHub Actions open pull requests. Turn on Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\", or add a RELEASE_PR_TOKEN secret. Until then, open it here: $url"
          else
            echo "$out" >&2
            exit 1
          fi
