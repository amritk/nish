# The release train. Two paths, one trigger.
#
#   a normal push to main  -> open or refresh the Release PR
#   the Release PR's merge -> create the tag, which starts release.yml
#
# The shape: every merged pull request accumulates into one open
# "chore(release): <version>" pull request that carries the version bump, `changelog/<version>.json`
# and the rendered CHANGELOG.md section. Merging that pull request is the act
# of releasing -- it is the review step for the release notes, before anyone
# can read them, rather than after.
#
# Why the tag is created here and not by the merge itself: a tag pushed by a
# workflow using the default GITHUB_TOKEN does not start another workflow, so
# release.yml would never run. The step below uses the same token but pushes
# the tag as a *ref creation* from a job that release.yml watches by `v*`,
# which does start it. If that ever stops being true, the fix is a deploy key
# or an app token, not a manual tag.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  train:
    name: release train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the generator walks the log back to the last tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Did this push land the release commit? The release PR is the only
      # thing that writes changelog/<version>.json for the version in
      # package.json, so "the file exists and the tag does not" identifies it
      # exactly, without depending on a label or a commit-message convention.
      - name: Decide which path this push is on
        id: path
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -f "changelog/$version.json" ] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      # ---- path 1: the release PR merged, so cut the tag -------------------------------------
      - name: Tag the release
        if: steps.path.outputs.mode == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.path.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "nish ${{ steps.path.outputs.version }}"
          git push origin "$v"
          echo "::notice::tagged $v; release.yml builds and publishes it"

      # ---- path 2: an ordinary merge, so refresh the release PR ------------------------------
      - name: Build the next release
        if: steps.path.outputs.mode == 'pr'
        id: next
        run: |
          next="$(node scripts/changelog-gen.mjs --next)"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          node scripts/changelog-gen.mjs --version "$next" --write > /dev/null
          node -e '
            const fs=require("fs");const v=process.argv[1];
            for (const f of ["package.json","package-lock.json"]) {
              const j=JSON.parse(fs.readFileSync(f,"utf8"));
              j.version=v; if (j.packages&&j.packages[""]) j.packages[""].version=v;
              fs.writeFileSync(f, JSON.stringify(j,null,2)+"\n");
            }
            // self/branding.ts carries the version too, and tests/run.js fails
            // when the two disagree -- a bump that touches only package.json
            // turns CI red on the release PR itself.
            const b="self/branding.ts";
            fs.writeFileSync(b, fs.readFileSync(b,"utf8").replace(
              /export const VERSION: string = "[^"]*";/,
              `export const VERSION: string = "${v}";`));
          ' "$next"

      - name: Open or refresh the Release pull request
        if: steps.path.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next="${{ steps.next.outputs.next }}"
          branch="release/next"
          # The title is the squash-merge subject, so it is a conventional
          # commit: pr-title.yml checks it like any other, and the merge lands
          # under "Chores" in the next release instead of "Uncategorised".
          title="chore(release): $next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::nothing to release"
            exit 0
          fi
          git commit -m "$title"
          git push --force origin "$branch"

          body="$(printf 'Merging this pull request releases **%s**: it creates the `v%s` tag, which builds the artifacts and publishes the release.\n\nThe notes below are the release notes. They are generated from the commits since the last tag -- subject for the heading, body for the prose -- and stored in `changelog/%s.json`, which is the file the website reads. Edit that file in this pull request to fix a wording; do not edit `CHANGELOG.md` by hand, it is rendered from the JSON.\n\n---\n\n' "$next" "$next" "$next")"
          body="$body$(node scripts/changelog-gen.mjs --from-json "changelog/$next.json" | head -c 50000)"

          if existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" && [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "::notice::refreshed release PR #$existing for $next"
          else
            gh pr create --head "$branch" --base main --title "$title" --body "$body"
            echo "::notice::opened the release PR for $next"
          fi
