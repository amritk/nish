# The release train. Two paths, one trigger.
#
#   a normal push to main  -> open or refresh the Release PR
#   the Release PR's merge -> create the tag, which starts release.yml
#
# The shape: every merged pull request accumulates into one open
# "chore(release): <version>" pull request that carries the version bump,
# `changelog/<version>.json` and the rendered CHANGELOG.md section. Merging that
# pull request is the act of releasing -- it is the review step for the release
# notes, before anyone can read them, rather than after.
#
# One repository switch has to be on for that to happen unattended: Settings >
# Actions > General > Workflow permissions > "Allow GitHub Actions to create and
# approve pull requests". Without it the API refuses `gh pr create` outright,
# whatever this workflow's `permissions:` say. The branch is pushed either way,
# so the step warns and links the compare page instead of failing -- a release
# that needs one click is not a reason to paint main red on every merge.
#
# CI on the Release PR needs no personal token either. The branch is pushed with
# GITHUB_TOKEN, whose `pull_request` runs wait as `action_required` until a
# maintainer approves them, so the step also dispatches ci.yml and
# pr-title.yml at `release/next`: a dispatched run needs no approval, and its
# checks land on the same commit, which is the PR's head. A PR's required
# checks never count a dispatched run's check runs, so ci.yml's gate also
# reports itself as a `ci-gate` commit status there. GitHub still refuses
# the merge while any run at the head waits for approval, required or not, so
# the job then deletes those waiting `pull_request` runs.
#
# Why the tag is created here and not by the merge itself: a tag pushed by a
# workflow using the default GITHUB_TOKEN does not start another workflow, so
# release.yml would never run on it.
#
# This file used to claim that pushing the tag as a ref creation was enough to
# get around that. It is not, and v0.1.0 is the proof: tagged by this job,
# never built, because `push: tags` raises nothing for a GITHUB_TOKEN push --
# there is no ref-creation exemption. What GitHub does exempt is
# `workflow_dispatch` and `repository_dispatch`, so the step below pushes the
# tag and then dispatches release.yml *at* that tag, which needs no deploy key
# and no personal access token. `actions: write` below is what lets it.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Dispatch release.yml at the tag this job pushes, dispatch ci.yml and
  # pr-title.yml at release/next, and delete the Release PR's waiting runs.
  actions: write
  # gh attestation verify, for the seed the break-web rebuild fetches.
  attestations: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  train:
    name: release train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the generator walks the log back to the last tag

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      # Did this push land the release commit? The release PR is the only
      # thing that writes changelog/<version>.json for the version in
      # package.json, so "the file exists and the tag does not" identifies it
      # exactly, without depending on a label or a commit-message convention.
      - name: Decide which path this push is on
        id: path
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -f "changelog/$version.json" ] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      # ---- path 1: the release PR merged, so cut the tag -------------------------------------
      - name: Tag the release
        if: steps.path.outputs.mode == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.path.outputs.version }}
        run: |
          v="v$VERSION"
          # Never tag or dispatch at a guessed ref. An empty version here would
          # mean the step above changed its output contract, and `v` alone
          # would tag the wrong thing and then aim release.yml at it -- the
          # silent mis-release this chain exists to avoid.
          if [ "$v" = "v" ]; then
            echo "::error::the release train computed an empty version; refusing to tag or dispatch at a guessed ref"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "nish $VERSION"
          git push origin "$v"

          # Pushing the tag is not enough, and the comment at the top of this
          # file used to say it was. GitHub raises no event for a ref pushed
          # with GITHUB_TOKEN, so release.yml's `push: tags` trigger never
          # sees it: v0.1.0 was tagged here and never built, and the only
          # symptom was a release that did not exist.
          #
          # `workflow_dispatch` is one of the two events GITHUB_TOKEN may
          # raise, so aim it at the tag we just pushed. The ref carries through
          # as GITHUB_REF_NAME, which is what every step of release.yml reads,
          # so a dispatched run and a human's `git push origin v0.1.0` build
          # exactly the same thing.
          gh workflow run release.yml --ref "$v"

          # `gh workflow run` returning 0 means the dispatch was accepted, not
          # that a run exists; this is the check that tells the two apart,
          # because "the release silently did not happen" is the failure this
          # whole step is fixing. The dispatch already succeeded if we are
          # here, so a run we cannot *see* is a warning naming the one command
          # that finishes the job -- not a red main over an observation.
          for _ in $(seq 1 10); do
            if [ -n "$(gh run list --workflow release.yml --branch "$v" --limit 1 --json databaseId --jq '.[0].databaseId // ""')" ]; then
              echo "::notice::tagged $v and started release.yml, which builds and publishes it"
              exit 0
            fi
            sleep 3
          done
          echo "::warning title=Release run not seen::Tagged $v and dispatched release.yml, but no run appeared within 30s. Check the Actions tab; if there is nothing, start it with: gh workflow run release.yml --ref $v"

      # ---- path 2: an ordinary merge, so refresh the release PR ------------------------------
      - name: Build the next release
        if: steps.path.outputs.mode == 'pr'
        id: next
        run: |
          next="$(node scripts/changelog-gen.mjs --next)"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          node scripts/changelog-gen.mjs --version "$next" --write > /dev/null
          node -e '
            const fs=require("fs");const v=process.argv[1];
            for (const f of ["package.json","package-lock.json"]) {
              const j=JSON.parse(fs.readFileSync(f,"utf8"));
              j.version=v; if (j.packages&&j.packages[""]) j.packages[""].version=v;
              // No apostrophes in this comment block, deliberately: it sits
              // inside `node -e '...'`, so one would close that string and hand
              // node a truncated script. That is not hypothetical -- it is how
              // this step first shipped, and it broke the release train on the
              // very commit that added it.
              //
              // Only the version moves. The platform packages are not pinned in
              // the repository at all: release.yml writes them into the copy it
              // packs (scripts/pin-platform-packages.mjs), so there is nothing
              // here for a bump to leave a release behind.
              fs.writeFileSync(f, JSON.stringify(j,null,2)+"\n");
            }
            // src/branding.ts carries the version too, and tests/run.js fails
            // when the two disagree -- a bump that touches only package.json
            // turns CI red on the release PR itself.
            const b="src/branding.ts";
            fs.writeFileSync(b, fs.readFileSync(b,"utf8").replace(
              /export const VERSION: string = "[^"]*"/,
              `export const VERSION: string = "${v}"`));
          ' "$next"

      # The docs site's break game is committed with the compiler's --help and
      # --version written into it: docs/site/break/shell.mjs and manifest.json,
      # and examples/break-web/help.ts, which game.wasm is compiled from.
      # tests/run.js's break-web section fails when they are not what the
      # compiler says, so the bump above has to rebuild them in the same pull
      # request. v0.40.0 is what happens otherwise: tagged with the game still
      # saying 0.39.0, its release stopped at the tag's own CI and published
      # nothing. The compiler is built from the bumped src/ by the last
      # release's seed, as ci.yml builds it; --ignore-scripts because this job
      # holds a token that pushes.
      - name: Install LLVM 18 + lld
        if: steps.path.outputs.mode == 'pr'
        timeout-minutes: 5
        uses: ./.github/actions/apt-install
        with:
          packages: clang-18 lld-18 llvm-18

      - name: Link the LLVM 18 tools by their plain names
        if: steps.path.outputs.mode == 'pr'
        run: |
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as llvm-nm llvm-tli-checker opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Rebuild the break game at the new version
        if: steps.path.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          NISH_REQUIRE_ATTESTATION: "1"
        run: |
          npm ci --ignore-scripts
          bash scripts/fetch-seed.sh
          npm run build
          build/nish --version
          node examples/break-web/build.mjs
          node examples/break-web/build.mjs --check

      - name: Open or refresh the Release pull request
        if: steps.path.outputs.mode == 'pr'
        env:
          # The job's own token, and no secret: `pull-requests: write` opens
          # the pull request once the repository switch above is on (the step
          # degrades rather than fails when it is off), and `actions: write`
          # dispatches ci.yml and pr-title.yml.
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          branch="release/next"
          # The title is the squash-merge subject, so it is a conventional
          # commit: pr-title.yml checks it like any other, and the merge lands
          # under "Internal" in the next release instead of being skipped.
          title="chore(release): $NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::nothing to release"
            exit 0
          fi
          git commit -m "$title"
          git push --force origin "$branch"

          # A push made with GITHUB_TOKEN raises the PR's `pull_request` runs
          # as github-actions[bot], and they wait as `action_required` until
          # someone approves them. `workflow_dispatch` is exempt, as it is for
          # release.yml at the tag above, so start the two workflows whose
          # checks the merge requires at the branch: they report on the commit
          # just pushed, the PR's head, with no approval and no personal token
          # (the required `ci-gate` as a commit status; see ci.yml's gate).
          # A refused dispatch leaves the pull request, which is still worth
          # opening, so it warns.
          for workflow in ci.yml pr-title.yml; do
            if ! gh workflow run "$workflow" --ref "$branch"; then
              echo "::warning title=Release CI not started::Pushed $branch, but dispatching $workflow at it failed. Start it with: gh workflow run $workflow --ref $branch"
            fi
          done

          # The notes are a `$(...)` away from the prose, and command
          # substitution eats trailing newlines: appending them to a preamble
          # that ends in a rule is what once rendered `---### Fixed` as one
          # line of literal text. So the notes are an argument to a single
          # printf, which is the only thing here that puts the blank lines in.
          notes="$(node scripts/changelog-gen.mjs --from-json "changelog/$NEXT.json" | head -c 50000)"
          body="$(printf '> [!WARNING]\n> **A human merges this one.** Merging it publishes to npm, so an automated agent must never merge it, however green its checks are (see AGENTS.md, "Shipping a change").\n\nMerging this pull request releases **%s**: it creates the `v%s` tag, which builds the artifacts and publishes the release.\n\nThe notes below are the release notes — one line per change, linking the pull request it landed in. They are generated from the commits since the last tag and stored in `changelog/%s.json`, which is the file the website reads, bodies and all. Edit that file in this pull request to fix a wording; do not edit `CHANGELOG.md` by hand, it is rendered from the JSON.\n\n---\n\n%s\n' "$NEXT" "$NEXT" "$NEXT" "$notes")"

          if existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" && [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "::notice::refreshed release PR #$existing for $NEXT"
          elif out="$(gh pr create --head "$branch" --base main --title "$title" --body "$body" 2>&1)"; then
            echo "$out"
            echo "::notice::opened the release PR for $NEXT"
          elif printf '%s' "$out" | grep -qF 'not permitted to create or approve pull requests'; then
            # The branch is pushed and the notes are on it; the only thing
            # missing is the pull request, and the reason is a repository
            # switch rather than anything about this commit. Failing here would
            # paint main red on every merge and say nothing new, so say it once
            # as a warning and hand over the link that opens it in one click.
            echo "$out"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning title=Release pull request not opened::Pushed $branch for $NEXT, but this repository does not let GitHub Actions open pull requests. Turn on Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\". Until then, open it here: $url"
          else
            echo "$out" >&2
            exit 1
          fi

      # The merge box says "Some checks are waiting for approval" and refuses
      # to merge while any run at the PR's head is `action_required`, even one
      # no ruleset requires. The push above raises a CI and a PR title run as
      # github-actions[bot] (`synchronize`, or `opened` for a new PR), and the
      # title or body edit raises another PR title run (`edited`); approving
      # them only re-runs what the dispatch already ran. Deleting a run removes
      # its check suite, so this deletes every waiting `pull_request` run at
      # the head. Each appears a few seconds after its event, so it sweeps for
      # a minute rather than once. A run it cannot delete is left for a
      # maintainer to approve, with a warning, rather than failing main.
      - name: Delete the Release PR's runs that wait for approval
        if: steps.path.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(git ls-remote origin refs/heads/release/next | cut -f1)"
          if [ -z "$head" ]; then
            echo "::notice::no release/next branch, so no runs to delete"
            exit 0
          fi
          deleted=0
          failed=" "
          for _ in $(seq 1 12); do
            sleep 5
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&status=action_required&head_sha=$head&per_page=100" --jq '.workflow_runs[].id' || true)"
            for id in $ids; do
              case "$failed" in *" $id "*) continue ;; esac
              if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" > /dev/null; then
                deleted=$((deleted + 1))
              else
                failed="$failed$id "
                echo "::warning title=Release PR run not deleted::Run $id at $head waits for approval and could not be deleted, so the Release PR cannot merge until it is approved or deleted: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
              fi
            done
          done
          echo "::notice::deleted $deleted waiting pull_request run(s) at $head"
