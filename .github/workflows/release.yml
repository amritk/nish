# Nish release: on a `v*` tag, run the full CI workflow (test matrix, lint,
# smoke), then build the npm tarball and one native compiler per supported
# target and attach them all to a GitHub release whose notes are the matching
# CHANGELOG.md section.
#
# Two audiences, and as many artifacts as the release is due to carry:
#   amritk-nish-<version>.tgz      the npm package (@amritk/nish); needs Node
#   nish-<version>-<asset>.tar.gz  the self-hosted compiler; needs nothing
#
# The binaries are also the seed: ci.yml's `bootstrap` job downloads the one
# for its own host from the last release and builds self/ with it (WP19 G3), so
# the name is a contract between the two workflows -- and neither workflow
# spells it. Both read it from .github/seed-targets.json, because a contract
# each side writes down separately is two strings that agree until one is
# edited. That file carries all four of WP19 G5's platforms, the canonical
# target triple each one is (self/target.ts), the runner label that
# provides it, and the version from which a release attaches it; tests/run.js
# checks all four of those against the compiler's own table, against the labels
# this file can ask for, and against this file's own text.
#
# Nothing here is spelled, then, including the matrix: the `targets` job below
# asks .github/seed-due.sh which assets THIS version is due to carry and the
# `binaries` matrix is that answer. A platform is added by adding a row to the
# JSON, and `seeds` in ci.yml grows its bootstrap row from the same file on the
# next run.
#
# Each binary is built on a runner of its own architecture rather than
# cross-compiled, because the chain is a chain: bootstrap.sh runs stage1 to
# build stage2, and a stage1 for another architecture does not run here.
# `scripts/build.sh` has no --target passthrough for the same reason -- it lets
# clang fill the triple in from the host. The upshot worth having is that
# "built" and "smoke-tested" mean the same thing on every row: there is no tier
# that was produced for a machine nobody ran it on.
#
# The chain is seeded by the previous release: each `binaries` row downloads
# that release's compiler for its own host and builds this one with it, the
# same seed ci.yml's `bootstrap` job builds with (WP19 G3).
#
# The `npm` job at the end publishes the packages the release attached, by
# npm's trusted publishing; see it and docs/wp12-release.md.
#
# Two ways in, because one of them does not work unattended. A tag pushed by a
# workflow using the default GITHUB_TOKEN raises no `push` event -- that is
# GitHub's loop guard, and it is why v0.1.0 was tagged and never built. So
# release-pr.yml pushes the tag and then *dispatches* this workflow at it:
# `workflow_dispatch` and `repository_dispatch` are the two events GITHUB_TOKEN
# is allowed to raise, which is what makes the train run end to end without a
# personal access token. The `push` trigger stays for a tag pushed by a human,
# whose credentials do start a workflow.
#
# Either way the ref is the tag, so GITHUB_REF_NAME is `v<version>` and every
# step below reads the same. Running this on a branch is a mistake rather than
# a release, and the first step says so.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# `contents: write` is what `gh release create` needs, and only the `release`
# job needs it. Every other job narrows to `contents: read` at the job level,
# which takes the write token away from the jobs that do not publish -- and
# `binaries` is the one worth taking it from, being `npm ci` and `brew install`
# on as many machines as there are targets.
#
# What this does NOT do is keep third-party install code away from the write
# token, because `release` still runs `npm ci` under it. What it no longer has
# to do is build the compiler first: `npm pack` stopped shipping `dist/` in
# 0.6.0, so the tarball is the launcher and the whitelisted data files, and
# nothing in it is `tsc` output. Narrowing the other jobs shrinks the surface
# from every runner in the matrix to one; it does not remove it. Removing it
# would mean packing in a job with `contents: read` and passing the tarball
# here as an artifact, which is a change worth making on its own terms rather
# than as a footnote.
permissions:
  contents: write

# Two triggers means two ways to land on one tag. Serialise rather than cancel:
# a half-published release is worse than a queued one, and the second run fails
# honestly at `gh release create` instead of racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  # The matrix, as this release's own answer rather than a list. Separate from
  # `binaries` because a matrix has to be known before the job it belongs to
  # starts, and separate from `ci` because a mis-aimed dispatch should be red
  # in seconds rather than after the test suite.
  targets:
    name: which binaries this release attaches
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `workflow_dispatch` can be aimed at any ref, so the ref type is checked
      # before the version is: dispatched at `main`, every step below would
      # read GITHUB_REF_NAME as a branch name and the comparison underneath
      # would report a version mismatch for what is really a mis-aimed run.
      #
      # It is checked here, first, because the version is what decides the
      # matrix: aimed at a branch, `seed-due.sh main` is the question nobody
      # meant to ask.
      - name: Ref must be a v* tag matching package.json version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::release.yml releases a tag; it was run on $GITHUB_REF_TYPE \`$GITHUB_REF_NAME\`. Re-run it with the tag as the ref."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # An empty answer stops the release rather than producing a job with no
      # rows: GitHub refuses an empty matrix as a strategy error, which would
      # report as a broken workflow instead of as a release with no compiler
      # in it. Zero due targets means the JSON is wrong, and saying so here is
      # cheaper than reading a strategy error on a tag.
      - name: Which assets this version is due to attach
        id: rows
        run: |
          version="${GITHUB_REF_NAME#v}"
          rows="$(bash .github/seed-due.sh "$version")"
          if [ "$(printf '%s' "$rows" | jq 'length')" -eq 0 ]; then
            echo "::error::.github/seed-targets.json has no target with an attachedSince of $version or older, so this release would attach no native compiler at all. Fix the file before releasing."
            exit 1
          fi
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          printf '%s' "$rows" | jq -r '.[] | "\(.asset)\t\(.triple)\t\(.runner)\tsince \(.attachedSince)"'
          {
            echo "### Native compilers this release attaches"
            echo
            echo "| Asset | Triple | Runner | Attached since |"
            echo "| --- | --- | --- | --- |"
            printf '%s' "$rows" | jq -r '.[] | "| `nish-'"$version"'-\(.asset).tar.gz` | `\(.triple)` | `\(.runner)` | \(.attachedSince) |"'
          } >> "$GITHUB_STEP_SUMMARY"

  # WP19 G5: one self-hosted compiler per supported target, each built and
  # smoke-tested on its own hardware.
  #
  # `fail-fast: false` so a broken row names itself rather than hiding behind
  # whichever failed first; the release job `needs` this one, so a single
  # failure still stops the release instead of publishing three binaries of
  # four. A partial release is the worse outcome: the missing one is the seed
  # some later `bootstrap` row will look for and not find.
  binaries:
    name: binary (${{ matrix.target.asset }})
    needs: [ci, targets]
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.rows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      # Homebrew's llvm@18 carries clang, lld and llvm-as in one keg, so this
      # is one formula rather than the Ubuntu side's symlink farm -- the tools
      # are already unversioned inside it. No fallback for a missing linker:
      # if the keg ever stops shipping one, the build fails at the link with
      # clang's own message, which is a better diagnostic than a second `brew
      # install` whose prefix this step does not put on PATH anyway.
      - name: Install LLVM 18 + lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # The seed: the previous release's compiler for this row's host, which
      # builds this release's stage1 (WP19 G3), fetched into build/seed by
      # scripts/fetch-seed.sh -- the download every local run and CI's test
      # job use -- where scripts/bootstrap.sh takes it as its default seed.
      # "Previous" is the newest published release that is not this tag, so a
      # re-run after this tag's release exists does not seed from itself.
      # Every target in .github/seed-targets.json has been attached since
      # 0.4.0, so that release carries every row's asset; a target added later
      # needs its first release seeded some other way, and the fetch fails
      # rather than building with nothing.
      - name: Fetch the seed (the previous release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api "repos/$GITHUB_REPOSITORY/releases" |
            jq -r --arg self "$GITHUB_REF_NAME" '[.[] | select((.draft or .prerelease) | not) | select(.tag_name != $self)][0].tag_name // empty')"
          if [ -z "$previous" ]; then
            echo "::error::there is no earlier release to seed $GITHUB_REF_NAME from"
            exit 1
          fi
          bash scripts/fetch-seed.sh "${previous#v}"

      # A tarball rather than a bare binary, because a bare binary is half a
      # compiler. `--link` shells out to scripts/build.sh and compiles
      # runtime/runtime.c, and the compiler looks for both in <its own dir>/..
      # and in the working directory -- so `nish` must sit one level down from
      # them, exactly as `bin/nish` does in the npm package. Ship it flat
      # beside runtime/ and it links only while the working directory happens
      # to be the unpacked folder, which is a trap rather than a distribution.
      #
      # stage2, not stage1: it is the first binary in the chain that no part of
      # the seed emitted, and --verify is what says the stages agree.
      #
      # The runner's own `uname` is checked against the row's `host` before the
      # row's `asset` is stamped into a name. An asset labelled for one
      # architecture and built on another is the one failure this job cannot
      # smoke-test its way out of -- it runs here, it runs in the smoke step,
      # and it fails on a user's machine and on the `bootstrap` row that seeds
      # from it -- and it is not hypothetical: a GitHub label can change what
      # it provides, which is what `macos-latest` did when it moved from Intel
      # to Apple Silicon. The matrix pins label to triple, so this check fires
      # exactly when that pinning has gone stale.
      - name: Build the native compiler
        id: binary
        env:
          ASSET: ${{ matrix.target.asset }}
          HOST: ${{ matrix.target.host }}
          RUNNER_LABEL: ${{ matrix.target.runner }}
        run: |
          host="$(uname -s)-$(uname -m)"
          if [ "$host" != "$HOST" ]; then
            echo "::error::$RUNNER_LABEL provides $host, but .github/seed-targets.json says the $ASSET row is built on $HOST. One of the two has moved: fix the row's runner or its host before releasing, because the asset would otherwise be labelled for an architecture it was not built on."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          name="nish-$version-$ASSET"
          stage="build/release/$name"
          mkdir -p "$stage/bin" "$stage/scripts"
          bash scripts/bootstrap.sh -o "$stage/bin/nish" --profile speed --verify
          cp -r runtime "$stage/runtime"
          cp -r std "$stage/std"
          cp scripts/build.sh "$stage/scripts/build.sh"
          cp LICENSE docs/INSTALL.md "$stage/"
          tar -czf "build/release/$name.tar.gz" -C build/release "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "asset=build/release/$name.tar.gz" >> "$GITHUB_OUTPUT"

      # The same gate the `Pack` step applies to the npm tarball, applied to
      # the one that is the seed. `cp -r runtime` copies the directory today,
      # so this is a check on the layout rather than a suspicion of the copy:
      # a narrower copy, or a stage layout edited on one line, would publish a
      # compiler that links `hello.ts` and fails on any program that reads a
      # file, lists a directory, spawns a child or asks the clock. That is the
      # half of the runtime no smoke test of one program can see -- `build.sh`
      # pairs runtime_os.c with runtime.c only `if [ -f "$os" ]`, silently, so
      # its absence is not an error anywhere -- which is why the npm side has
      # this list and why the seed should not go without it.
      #
      # It is a presence check and that is its limit, shared with `Pack`'s: a
      # runtime_os.c that is present and EMPTY passes here, compiles as an
      # empty translation unit, and links both smoke programs. A corrupt one is
      # caught, because clang then fails. Checking content would mean naming a
      # symbol the file must define, which is a second copy of the runtime's
      # ABI to keep in step; the hole is named here instead.
      #
      # `std/` is on the list as of 2026-09-20, and it is the case the comment
      # above described happening for real one level up. Every release from
      # 0.1.1 to 0.4.0 staged `bin`, `runtime` and `scripts` and no standard
      # library, so the compiler they carry links `hello.ts` and answers any
      # `import { trim } from "nish/text"` with ``Module `nish/text` is not
      # part of the standard library (it has: json, testing, text)`` -- a
      # sentence that lists the module it is refusing, because the list is
      # static and the file is what is missing. The smoke step below grew a
      # third program for it: a list is a claim about names, and only running
      # one of those modules says the library is whole.
      - name: The tarball carries a whole compiler
        run: |
          tar -tzf "${{ steps.binary.outputs.asset }}" |
            sed 's#^${{ steps.binary.outputs.name }}/##' | sort > "$RUNNER_TEMP/files.txt"
          for f in bin/nish runtime/runtime.c runtime/LICENSE-ryu runtime/runtime_os.c runtime/nish.h scripts/build.sh std/text.ts std/testing.ts std/json.ts std/pair.ts std/threads.ts std/collections.ts LICENSE INSTALL.md; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "::error::$f missing from ${{ steps.binary.outputs.name }}.tar.gz"; exit 1; }
          done
          echo "$(wc -l < "$RUNNER_TEMP/files.txt") paths, and the fifteen that have to be there"

      # A released compiler that does not work is worse than no release: it is
      # the seed every later release is built from. Unpack the actual tarball
      # somewhere unrelated and drive it from a third directory, so neither the
      # repository nor the unpack directory can be what makes it work.
      #
      # Three programs, because two of them were not enough. `hello.ts` is a
      # single module and exercises none of the layout the comment above spends
      # six lines on: `examples/multi` is two modules, so the compiler has to
      # plan `<exe>.modules/`, find `scripts/build.sh` relative to its own
      # directory rather than to the working directory, and hand it several
      # `.ll` files. A `--link` that resolved build.sh from the cwd on one path
      # and from argv[0] on the other would pass on `hello.ts` and fail on
      # every real program.
      #
      # Neither of those two imports the standard library, and that is exactly
      # the hole four releases fell through: `std/` was never staged, so the
      # compiler 0.1.1 through 0.4.0 shipped refuses every `nish/<module>`
      # specifier while both programs here pass. The third program imports
      # `nish/text` and RUNS it, because the refusal the omission produces
      # names the module it is refusing -- a check that only read the message
      # would have to know it was wrong to distrust it. The standard library
      # is reached by its package specifier rather than by a path, since that
      # is the form that goes through the compiler's own package root and so
      # the only form the staging can break.
      - name: Smoke the native compiler
        run: |
          version="${GITHUB_REF_NAME#v}"
          unpack="$RUNNER_TEMP/unpack"; work="$RUNNER_TEMP/work"
          mkdir -p "$unpack" "$work"
          tar -xzf "${{ steps.binary.outputs.asset }}" -C "$unpack"
          nish="$unpack/${{ steps.binary.outputs.name }}/bin/nish"
          test "$("$nish" --version)" = "nish $version"
          cp examples/hello.ts "$work/hello.ts"
          mkdir -p "$work/multi"
          cp examples/multi/main.ts examples/multi/math.ts "$work/multi/"
          cat > "$work/stdlib.ts" <<'PROGRAM'
          import { trim } from "nish/text";

          export const main = (): number => {
            write(`[${trim("  padded  ")}]\n`);
            return 0;
          };
          PROGRAM
          cd "$work"
          "$nish" hello.ts --link hello
          test "$(./hello)" = "hello from Nish"
          "$nish" multi/main.ts --link multi-app
          set +e; ./multi-app; code=$?; set -e
          test "$code" = "49" || { echo "::error::the unpacked compiler linked examples/multi but it exited $code, not 49"; exit 1; }
          "$nish" stdlib.ts --link stdlib || { echo "::error::the unpacked compiler cannot compile a program that imports nish/text. The tarball is missing std/: see the staging step above."; exit 1; }
          test "$(./stdlib)" = "[padded]" || { echo "::error::the unpacked compiler linked a nish/text program but it printed $(./stdlib), not [padded]"; exit 1; }
          echo "native compiler works from an unrelated directory, on one module, on two, and on the standard library"

      # The same staged directory, packaged a second way. `npm pack` over it is
      # the package the installer resolves: the binary this job just built,
      # --verify'd and smoke-tested, with a package.json declaring the `os` and
      # `cpu` npm matches a machine against. Nothing is rebuilt and nothing is
      # copied -- the bytes a user downloads are the bytes the step above ran
      # -- which is the property that makes `npm install` a download rather
      # than a build (docs/wp12-release.md, "Which compiler the package ships").
      #
      # The layout needs no rearranging because the release tarball and the npm
      # package want the same one: `bin/nish` beside the `runtime/` and
      # `scripts/` it resolves one level up from itself.
      - name: The platform package npm installs
        id: platform
        env:
          ASSET: ${{ matrix.target.asset }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="build/release/nish-$version-$ASSET"
          node scripts/platform-package.mjs "$stage" "$ASSET" --version "$version"
          file="$(npm pack "$stage" --pack-destination build/release | tail -n 1)"
          echo "tarball=build/release/$file" >> "$GITHUB_OUTPUT"
          # A platform package whose binary did not ship is the worst outcome
          # this workflow can produce: it installs without error on every
          # machine it matches, and every `nish` on those machines then refuses
          # for want of the binary this package exists to carry -- an install
          # that reports success and leaves the user with no compiler. Since
          # 0.6.0 that is a refusal rather than a silent fall back to Node,
          # which is louder and no less broken. No smoke test of the unpacked
          # tarball can see it, so the list is checked here.
          tar -tzf "build/release/$file" | sed 's#^package/##' | sort > "$RUNNER_TEMP/pkg.txt"
          for f in bin/nish runtime/runtime.c runtime/LICENSE-ryu runtime/runtime_os.c runtime/nish.h scripts/build.sh std/text.ts std/testing.ts std/json.ts std/pair.ts std/threads.ts std/collections.ts package.json; do
            grep -qx "$f" "$RUNNER_TEMP/pkg.txt" || { echo "::error::$f missing from $file"; exit 1; }
          done
          echo "$file carries $(wc -l < "$RUNNER_TEMP/pkg.txt") paths"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target.asset }}
          path: |
            ${{ steps.binary.outputs.asset }}
            ${{ steps.platform.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: release
    needs: [ci, targets, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # The same guard `targets` carries. Repeated rather than inherited
      # because this job stamps GITHUB_REF_NAME into what it publishes, and a
      # guard is worth having next to the step it guards.
      - name: Ref must be a v* tag matching package.json version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::release.yml releases a tag; it was run on $GITHUB_REF_TYPE \`$GITHUB_REF_NAME\`. Re-run it with the tag as the ref."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # No LLVM here any more, and no build either: this job packs and publishes,
      # and the compilers were built and smoke-tested on their own hardware by the
      # `binaries` job above. `npm run build` used to be needed because `npm pack`
      # shipped `dist/`; since 0.6.0 the tarball is the launcher in `bin/` plus the
      # whitelisted data files, none of it `tsc` output, so there is nothing to
      # build before packing.
      - name: Install dependencies
        run: npm ci

      # Every binary the matrix produced, back into one directory. The release
      # job `needs: binaries`, so reaching this step at all means every row
      # passed; `if-no-files-found: error` on the upload side and the check
      # below are what stop a silently empty download from publishing a release
      # with no compiler attached.
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: build/release

      # The matrix reaches bash through `env:` rather than through ${{ }}, so
      # the JSON is a value this script reads and never text the runner pastes
      # into it. The list of assets is the same answer the matrix was built
      # from, so this step and `gh release create` below cannot disagree about
      # what the release carries.
      - name: Every asset this version is due to attach is present
        id: assets
        env:
          ROWS: ${{ needs.targets.outputs.rows }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          : > build/release/assets.txt
          : > build/release/packages.txt
          # `npm pack` names a tarball after the package: the leading `@` goes
          # and every `/` becomes `-`, so `@<scope>/nish-<asset>` packs as
          # `<scope>-nish-<asset>-<version>.tgz`. Both halves are derived --
          # the scope from package.json#name and the asset from the matrix --
          # for the reason this whole file names no platform: a contract
          # written down twice is two strings that agree until one is edited,
          # and tests/run.js fails on an asset spelled here
          # (docs/wp12-release.md, "The npm name").
          while read -r asset; do
            [ -n "$asset" ] || continue
            path="build/release/nish-$version-$asset.tar.gz"
            test -s "$path" || { echo "::error::$path is missing or empty"; exit 1; }
            echo "$path" >> build/release/assets.txt
            echo "$(du -h "$path" | cut -f1)  $path"
            pkg="build/release/$(node -p "\`\${require('./package.json').name}-$asset\`.replace(/^@/, '').replace(/\//g, '-')")-$version.tgz"
            test -s "$pkg" || { echo "::error::$pkg is missing or empty; the $asset row built a compiler but not the package that installs it"; exit 1; }
            echo "$pkg" >> build/release/packages.txt
            echo "$(du -h "$pkg" | cut -f1)  $pkg"
          done < <(printf '%s' "$ROWS" | jq -r '.[].asset')
          test -s build/release/assets.txt || { echo "::error::no native compiler assets to attach"; exit 1; }
          test -s build/release/packages.txt || { echo "::error::no platform packages to attach"; exit 1; }

      - name: Pack
        id: pack
        run: |
          mkdir -p build/release
          file="$(npm pack --pack-destination build/release | tail -n 1)"
          echo "tarball=build/release/$file" >> "$GITHUB_OUTPUT"
          tar -tzf "build/release/$file" | sed 's#^package/##' | sort | tee build/release/files.txt
          # The tarball must be usable on its own, and this list is what makes that
          # a gate rather than a hope. `runtime_os.c` is on it because a `files`
          # regression that dropped it would publish a compiler that links a
          # program printing a string and fails on any program that reads a file,
          # lists a directory, spawns a child or asks the clock -- the half of the
          # runtime whose absence a smoke test of `hello.ts` cannot see.
          #
          # `bin/` rather than `dist/index.js` since 0.6.0: the tarball carries the
          # launcher and not a compiler, and the compiler travels in the platform
          # packages the matrix above built. The three `bin/` paths are the command
          # and the two files behind it, and a tarball missing any of them installs
          # a package whose `bin` points at nothing.
          for f in bin/nish bin/launcher.js bin/packaging.js runtime/runtime.c runtime/LICENSE-ryu runtime/runtime_os.c runtime/nish.h scripts/build.sh std/text.ts std/testing.ts std/json.ts std/pair.ts std/threads.ts std/collections.ts; do
            grep -qx "$f" build/release/files.txt || { echo "::error::$f missing from tarball"; exit 1; }
          done

      # From the JSON the release pull request was reviewed with, not from a
      # fresh walk of the log: what gets published must be what someone
      # approved. changelog-section.sh remains for a tag cut by hand, and is
      # the fallback when a release predates the generator.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f "changelog/$version.json" ]; then
            node scripts/changelog-gen.mjs --from-json "changelog/$version.json" > build/release/notes.md
          else
            echo "::warning::no changelog/$version.json; falling back to the CHANGELOG.md section"
            bash scripts/changelog-section.sh "$GITHUB_REF_NAME" > build/release/notes.md
          fi
          # A GitHub release body is capped at 125,000 characters and
          # `gh release create` fails outright above it -- at the last step,
          # with the tag already pushed. Cut at a paragraph boundary and point
          # at the file that holds all of it.
          if [ "$(wc -m < build/release/notes.md)" -gt 120000 ]; then
            head -c 120000 build/release/notes.md > build/release/notes.cut
            printf '\n\n*These notes are truncated. The full record for this release is [changelog/%s.json](https://github.com/amritk/nish/blob/%s/changelog/%s.json).*\n' \
              "$version" "$GITHUB_REF_NAME" "$version" >> build/release/notes.cut
            mv build/release/notes.cut build/release/notes.md
          fi
          test -s build/release/notes.md || { echo "::error::release notes are empty"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The asset list the step above wrote and checked, so the attach and
          # the check are one list rather than two.
          assets=()
          while IFS= read -r path; do assets+=("$path"); done < build/release/assets.txt
          # The platform packages are attached as well as published: the `npm`
          # job below publishes these very files, downloaded back from this
          # release, and a user who cannot reach the registry can still install
          # the pair for their machine by hand (docs/INSTALL.md, §2).
          while IFS= read -r path; do assets+=("$path"); done < build/release/packages.txt
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pack.outputs.tarball }}" \
            "${assets[@]}" \
            --title "nish $GITHUB_REF_NAME" \
            --notes-file build/release/notes.md \
            --verify-tag

  # The registry half of the release: the N+1 packages `release` just attached,
  # published by npm's trusted publishing. Each package trusts this workflow
  # file in this repository (`npm trust github <pkg> --repo amritk/nish --file
  # release.yml --allow-publish`), and the job proves it is that workflow with a
  # short-lived OIDC token, so there is no NPM_TOKEN secret to leak or rotate.
  #
  # A job of its own rather than a step of `release`, for three reasons:
  #
  # - It is the only job that holds `id-token: write`, and it runs no `npm ci`,
  #   so no third-party install code ever runs next to the token that publishes.
  # - It publishes the bytes the GitHub release carries, downloaded back from
  #   it, rather than a second pack: what is on npm is what is on the release.
  # - A publish that fails half way is retried with "Re-run failed jobs", which
  #   re-runs this job alone. Re-running `release` would stop at
  #   `gh release create`, because the release already exists.
  npm:
    name: publish to npm
    needs: [targets, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: that writes an .npmrc naming NODE_AUTH_TOKEN, and
      # trusted publishing needs no token at all. npm exchanges the job's OIDC
      # token for a publish credential itself, which needs npm 11.5.1 or later;
      # Node 22 ships npm 10.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Download the packages the release attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/npm
          gh release download "$GITHUB_REF_NAME" --pattern '*.tgz' --dir build/npm
          ls -l build/npm

      # The same derivation the `release` job's asset check makes, for the same
      # reason: the platforms come from the matrix and the scope from
      # package.json, so this file still names no platform. Platform packages
      # first and the main package last, so a publish that fails half way leaves
      # a registry where this version of the main package does not exist yet,
      # and nobody can install a launcher whose binaries are missing.
      - name: Publish order
        env:
          ROWS: ${{ needs.targets.outputs.rows }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          stem="$(node -p "require('./package.json').name.replace(/^@/, '').replace(/\//g, '-')")"
          : > build/npm/order.txt
          while read -r asset; do
            [ -n "$asset" ] || continue
            echo "build/npm/$stem-$asset-$version.tgz" >> build/npm/order.txt
          done < <(printf '%s' "$ROWS" | jq -r '.[].asset')
          echo "build/npm/$stem-$version.tgz" >> build/npm/order.txt
          while IFS= read -r tgz; do
            test -s "$tgz" || { echo "::error::$tgz is not on the $GITHUB_REF_NAME release"; exit 1; }
          done < build/npm/order.txt
          cat build/npm/order.txt

      # Every package is asked about before any is published, so the one case
      # this job cannot handle stops it before it has uploaded anything.
      #
      # That case is a package that has never been published. Trust is set on a
      # package, and a package exists only once something has published it, so
      # the first version of every new package -- a platform added to
      # .github/seed-targets.json, say -- is published by hand and then trusted.
      # Without this check it fails as a bare 404 from the registry, part way
      # through the list; with it, the error says what to do.
      #
      # One lookup per package answers both questions. A package npm has never
      # seen and a version it has not seen are both E404, so asking for the
      # version alone could not tell a first publish from a routine one; any
      # other failure is the registry or the network, and is fatal.
      - name: Every package can be published from here
        run: |
          version="${GITHUB_REF_NAME#v}"
          : > build/npm/todo.txt
          while IFS= read -r tgz; do
            name="$(tar -xzOf "$tgz" package/package.json | jq -r .name)"
            if ! npm view "$name" versions --json > build/npm/versions.json 2> build/npm/view.err; then
              if grep -q E404 build/npm/view.err; then
                echo "::error::$name has never been published, so it cannot trust this workflow yet. Publish $(basename "$tgz") by hand with 'npm publish <tarball> --access public', run 'npm trust github $name --repo $GITHUB_REPOSITORY --file release.yml --allow-publish', then re-run this job."
              else
                cat build/npm/view.err
                echo "::error::could not ask the registry about $name"
              fi
              exit 1
            fi
            if jq -e --arg v "$version" '[.] | flatten | index($v) != null' build/npm/versions.json > /dev/null; then
              echo "$name@$version is already on the registry; skipping"
            else
              echo "$tgz" >> build/npm/todo.txt
            fi
          done < build/npm/order.txt

      # Idempotent, so a re-run finishes what a failed run started: the step
      # above left out every version already on the registry, and the order is
      # still platforms first.
      #
      # `--access public` because a scoped package is private by default, and a
      # private publish on a free account fails at the registry. Trusted
      # publishing attaches a provenance attestation without being asked;
      # `--provenance` says so where the command is read.
      - name: Publish
        run: |
          while IFS= read -r tgz; do
            npm publish "$tgz" --access public --provenance
          done < build/npm/todo.txt
