# THROWAWAY. This file is deleted by the pull request that reports its results.
#
# It exists to answer the question `.github/seed-targets.json`'s note asks under
# BEFORE ADDING A PLATFORM: does a platform's `binaries` row actually pass,
# before a release attaches its seed and `ci.yml` grows a `bootstrap` row for it
# on every push from then on. The note also closes the two obvious ways of
# asking -- `release.yml` cannot be dispatched at a branch, because `targets`
# exits unless the ref is a tag matching `package.json`'s version, and a
# temporary matrix entry in it cannot be reached for the same reason -- and
# prescribes this one: a throwaway workflow on a branch, `on: workflow_dispatch`,
# one job `runs-on:` the label in question, the steps of release.yml's `binaries`
# job down to the smoke test, with no upload.
#
# The steps below are COPIED from that job rather than rewritten, so that a green
# run here says the release will do this, not that a paraphrase of it worked. The
# three differences are deliberate and each is marked EXERCISE:
#
#   * the version comes from package.json rather than from a `v*` tag, because
#     there is no tag on a branch. It is the same string the compiler reports for
#     `--version`, which is what the smoke test compares against.
#   * nothing is uploaded and no release is touched.
#   * on Darwin, a measurement step runs first. `scripts/bootstrap.sh --verify`
#     asserts `stage3 == stage2` through `scripts/verify-binaries.sh`, which on
#     Mach-O fails anything it cannot attribute -- so on a red row the copied
#     step reports "unattributed" and nothing else, and what this workflow is for
#     on that platform is WHICH BYTES. The measurement runs its own three stages
#     without --verify, so it produces the evidence whether or not the row passes.
#
# No row is typed here. The `rows` job asks .github/seed-targets.json, which is
# the one place an asset, a runner label, a host `uname` pair and a triple are
# spelled, and the matrix below is that answer -- the same shape release.yml's
# `targets` -> `binaries` pair has, for the same reason.
#
# TWO TRIGGERS, and the second one is not decoration. `workflow_dispatch` is what
# the note prescribes and what a person should use. It was not available to the
# session that wrote this: dispatching a workflow needs `actions: write` and the
# token here has `actions: read`, so the API answered 403. A `push:` trigger
# scoped to this branch runs the same jobs, on the same hardware, with the same
# steps, and the branch goes away with the file, so it is the same throwaway.
# `paths:` is what keeps a documentation push from spending three runners on a
# result it cannot change.
#
# On a dispatch the `asset` input names one row and the matrix is that row alone.
# On a push it is every row `.github/seed-due.sh` says this version is NOT yet due
# -- exactly the rows no release has ever carried, which is the set this file
# exists to exercise.
name: Exercise a seed target (throwaway)

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "the `asset` of one .github/seed-targets.json row, or empty for every row not yet due"
        required: false
        type: string
  push:
    branches: ["feature/m6-dual-compiler-removal/seed-exercise"]
    paths:
      - ".github/workflows/exercise-target.yml"
      - ".github/seed-targets.json"
      - "scripts/**"
      - "self/**"
      - "src/**"
      - "runtime/**"

permissions:
  contents: read

# Three macOS and ARM runners per push is enough to want the last push to be the
# one that answers.
concurrency:
  group: exercise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # release.yml's `targets` job, asking the complement of its question. A matrix
  # has to be known before the job it belongs to starts, which is why that one is
  # a job of its own and why this one is too.
  rows:
    name: which rows have never run
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@v4

      - name: Which rows this run exercises
        id: rows
        env:
          ASSET: ${{ inputs.asset }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$ASSET" ]; then
            rows="$(jq -c --arg a "$ASSET" '[.targets[] | select(.asset == $a)]' .github/seed-targets.json)"
          else
            # Every row release.yml would NOT build at this version: the rows no
            # release has carried, which is the set that wants exercising. The
            # due half is seed-due.sh's own answer, so this job and release.yml
            # cannot come to disagree about what "due" means.
            due="$(bash .github/seed-due.sh "$version" | jq -c '[.[].asset]')"
            rows="$(jq -c --argjson due "$due" '[.targets[] | select(.asset as $a | $due | index($a) | not)]' .github/seed-targets.json)"
          fi
          if [ "$(printf '%s' "$rows" | jq 'length')" -eq 0 ]; then
            echo "::error::no row of .github/seed-targets.json to exercise (asset=\`$ASSET\`, version=$version). The assets it has: $(jq -r '[.targets[].asset] | join(", ")' .github/seed-targets.json)"
            exit 1
          fi
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          printf '%s' "$rows" | jq -r '.[] | "\(.asset)\t\(.triple)\t\(.runner)\tsince \(.attachedSince)"'

  binary:
    name: binary (${{ matrix.target.asset }})
    needs: rows
    runs-on: ${{ matrix.target.runner }}
    # A broken row names itself rather than hiding behind whichever failed first.
    # Learning which platforms pass is the whole point of the exercise, so one
    # red row must not cancel the others.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.rows.outputs.rows) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install LLVM 18 + lld (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang clang++ llc llvm-as opt ld.lld wasm-ld lld; do
            ln -sf "/usr/bin/$tool-18" "$bin/$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Install LLVM 18 + lld (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          prefix="$(brew --prefix llvm@18)"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # EXERCISE: not in release.yml's `binaries` job, and the reason this
      # workflow was aimed at a mac at all.
      #
      # Three stages without --verify, so the comparison does not stop the job
      # before it has said anything. Then every differing byte is attributed to
      # the load command, section or linkedit blob it falls inside, by walking
      # the Mach-O headers of both files. "Unattributed" is what
      # verify-binaries.sh reports and it is the absence of exactly this; the
      # script below is the presence of it, and it is where the measurement in
      # the commit body comes from.
      - name: Measure what ld64 varies between stage2 and stage3 (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/bootstrap.sh --stages 3 --profile speed \
            -o "$RUNNER_TEMP/measure/nish" --work "$RUNNER_TEMP/measure/selfhost"
          a="$RUNNER_TEMP/measure/selfhost/stage2"
          b="$RUNNER_TEMP/measure/selfhost/stage3"
          echo "== sizes =="
          wc -c "$a" "$b"
          size -m "$a" || true
          echo "== otool -l, diffed =="
          otool -l "$a" > "$RUNNER_TEMP/a.lc"
          otool -l "$b" > "$RUNNER_TEMP/b.lc"
          diff "$RUNNER_TEMP/a.lc" "$RUNNER_TEMP/b.lc" || true
          echo "== codesign =="
          codesign -dvvv "$a" 2>&1 || true
          echo "== every differing byte, attributed =="
          python3 - "$a" "$b" <<'ATTRIBUTE'
          # Attribute every differing byte between two Mach-O files to the load command,
          # section or linkedit blob it falls inside. "Unattributed" is what
          # scripts/verify-binaries.sh reports and it is the absence of exactly this.
          import sys, struct

          LC_SEGMENT_64, LC_UUID, LC_SYMTAB, LC_DYSYMTAB = 0x19, 0x1B, 0x02, 0x0B
          LINKEDIT = {  # cmd -> name, for every load command of linkedit_data_command shape
              0x1D: "LC_CODE_SIGNATURE", 0x26: "LC_FUNCTION_STARTS", 0x29: "LC_DATA_IN_CODE",
              0x2E: "LC_LINKER_OPTIMIZATION_HINT", 0x80000033: "LC_DYLD_EXPORTS_TRIE",
              0x80000034: "LC_DYLD_CHAINED_FIXUPS",
          }
          NAMES = {LC_SEGMENT_64: "LC_SEGMENT_64", LC_UUID: "LC_UUID", LC_SYMTAB: "LC_SYMTAB",
                   LC_DYSYMTAB: "LC_DYSYMTAB", 0x80000022: "LC_DYLD_INFO_ONLY", 0x1F: "LC_MAIN",
                   0x0E: "LC_LOAD_DYLINKER", 0x0C: "LC_LOAD_DYLIB", 0x32: "LC_BUILD_VERSION",
                   0x2B: "LC_SOURCE_VERSION", 0x24: "LC_VERSION_MIN_MACOSX"}


          def regions(buf):
              """[(start, end, label)], every file range these headers name."""
              magic, _, _, _, ncmds, sizeofcmds = struct.unpack_from("<IiiIII", buf, 0)
              if magic != 0xFEEDFACF:
                  sys.exit(f"not a 64-bit little-endian Mach-O (magic {magic:#x})")
              out = [(0, 32, "mach_header_64"), (32, 32 + sizeofcmds, "the load commands")]
              off = 32
              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from("<II", buf, off)
                  name = NAMES.get(cmd) or LINKEDIT.get(cmd) or f"LC_{cmd:#x}"
                  out.append((off, off + cmdsize, f"{name} (the load command itself)"))
                  if cmd == LC_SEGMENT_64:
                      seg = buf[off + 8:off + 24].split(b"\0")[0].decode()
                      fileoff, filesize = struct.unpack_from("<QQ", buf, off + 40)
                      nsects = struct.unpack_from("<I", buf, off + 64)[0]
                      if filesize:
                          out.append((fileoff, fileoff + filesize, f"segment {seg}"))
                      for i in range(nsects):
                          s = off + 72 + i * 80
                          sect = buf[s:s + 16].split(b"\0")[0].decode()
                          size = struct.unpack_from("<Q", buf, s + 40)[0]
                          soff = struct.unpack_from("<I", buf, s + 48)[0]
                          if size and soff:
                              out.append((soff, soff + size, f"section {seg},{sect}"))
                  elif cmd == LC_UUID:
                      out.append((off + 8, off + 24, "LC_UUID's sixteen bytes of UUID"))
                  elif cmd in LINKEDIT:
                      dataoff, datasize = struct.unpack_from("<II", buf, off + 8)
                      if datasize:
                          out.append((dataoff, dataoff + datasize, f"{LINKEDIT[cmd]}'s blob"))
                  elif cmd == LC_SYMTAB:
                      symoff, nsyms, stroff, strsize = struct.unpack_from("<IIII", buf, off + 8)
                      if nsyms:
                          out.append((symoff, symoff + nsyms * 16, "the symbol table"))
                      if strsize:
                          out.append((stroff, stroff + strsize, "the string table"))
                  off += cmdsize
              return out


          def label(regs, pos):
              """The narrowest region containing pos, which is the most specific answer."""
              hit = [r for r in regs if r[0] <= pos < r[1]]
              return min(hit, key=lambda r: r[1] - r[0])[2] if hit else "UNATTRIBUTED"


          a, b = (open(p, "rb").read() for p in sys.argv[1:3])
          if len(a) != len(b):
              sys.exit(f"different sizes: {len(a)} vs {len(b)}")
          regs = regions(a)
          diff = [i for i in range(len(a)) if a[i] != b[i]]
          if not diff:
              print("the two files are byte-identical")
              sys.exit(0)

          runs, start = [], diff[0]
          for prev, pos in zip(diff, diff[1:] + [None]):
              if pos != prev + 1:
                  runs.append((start, prev + 1))
                  start = pos
          print(f"{len(diff)} differing bytes of {len(a)}, in {len(runs)} run(s):")
          seen = {}
          for lo, hi in runs:
              where = label(regs, lo)
              seen[where] = seen.get(where, 0) + (hi - lo)
              print(f"  {lo:#010x}..{hi:#010x}  {hi - lo:>7} bytes  {where}")
              print(f"      stage2 {a[lo:min(hi, lo + 16)].hex()}")
              print(f"      stage3 {b[lo:min(hi, lo + 16)].hex()}")
          print("\nby region:")
          for where, n in sorted(seen.items(), key=lambda kv: -kv[1]):
              print(f"  {n:>7} bytes  {where}")
          uuid = "LC_UUID's sixteen bytes of UUID"
          if set(seen) == {uuid}:
              print("\nVERDICT: LC_UUID alone. Link with -Wl,-no_uuid (scripts/build.sh).")
          elif set(seen) == {uuid, "LC_CODE_SIGNATURE's blob"}:
              print("\nVERDICT: LC_UUID, and the ad-hoc code signature whose page hashes cover it.")
              print("         The signature is a consequence, not a second cause: link with")
              print("         -Wl,-no_uuid (scripts/build.sh) and both runs go away together.")
          elif "UNATTRIBUTED" in seen:
              print("\nVERDICT: some bytes fall outside every region these headers name.")
          else:
              print("\nVERDICT: see the regions above; it is not LC_UUID alone.")
          ATTRIBUTE

      - name: Build the native compiler
        id: binary
        env:
          ASSET: ${{ matrix.target.asset }}
          HOST: ${{ matrix.target.host }}
          RUNNER_LABEL: ${{ matrix.target.runner }}
        run: |
          host="$(uname -s)-$(uname -m)"
          if [ "$host" != "$HOST" ]; then
            echo "::error::$RUNNER_LABEL provides $host, but .github/seed-targets.json says the $ASSET row is built on $HOST. One of the two has moved: fix the row's runner or its host before releasing, because the asset would otherwise be labelled for an architecture it was not built on."
            exit 1
          fi
          # EXERCISE: package.json rather than ${GITHUB_REF_NAME#v}; there is no
          # tag on a branch, and this is the version `nish --version` reports.
          version="$(node -p "require('./package.json').version")"
          name="nish-$version-$ASSET"
          stage="build/release/$name"
          mkdir -p "$stage/bin" "$stage/scripts"
          bash scripts/bootstrap.sh -o "$stage/bin/nish" --profile speed --verify
          cp -r runtime "$stage/runtime"
          cp scripts/build.sh "$stage/scripts/build.sh"
          cp LICENSE docs/INSTALL.md "$stage/"
          tar -czf "build/release/$name.tar.gz" -C build/release "$name"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "asset=build/release/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: The tarball carries a whole compiler
        run: |
          tar -tzf "${{ steps.binary.outputs.asset }}" |
            sed 's#^${{ steps.binary.outputs.name }}/##' | sort > "$RUNNER_TEMP/files.txt"
          for f in bin/nish runtime/runtime.c runtime/runtime_os.c runtime/nish.h scripts/build.sh LICENSE INSTALL.md; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "::error::$f missing from ${{ steps.binary.outputs.name }}.tar.gz"; exit 1; }
          done
          echo "$(wc -l < "$RUNNER_TEMP/files.txt") paths, and the seven that have to be there"

      - name: Smoke the native compiler
        run: |
          version="${{ steps.binary.outputs.version }}"
          unpack="$RUNNER_TEMP/unpack"; work="$RUNNER_TEMP/work"
          mkdir -p "$unpack" "$work"
          tar -xzf "${{ steps.binary.outputs.asset }}" -C "$unpack"
          nish="$unpack/${{ steps.binary.outputs.name }}/bin/nish"
          test "$("$nish" --version)" = "nish $version"
          cp examples/hello.ts "$work/hello.ts"
          mkdir -p "$work/multi"
          cp examples/multi/main.ts examples/multi/math.ts "$work/multi/"
          cd "$work"
          "$nish" hello.ts --link hello
          test "$(./hello)" = "hello from Nish"
          "$nish" multi/main.ts --link multi-app
          set +e; ./multi-app; code=$?; set -e
          test "$code" = "49" || { echo "::error::the unpacked compiler linked examples/multi but it exited $code, not 49"; exit 1; }
          echo "native compiler works from an unrelated directory, on one module and on two"
